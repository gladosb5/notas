<script>
/* =========================================================================
   CHROME - the lens in the tool pill. One graphite disc travels to whichever
   tool is pressed instead of each button lighting up on its own. It follows
   aria-pressed, which the ink code already maintains, so nothing else changes.
   ========================================================================= */
(function(){
'use strict';
const strip=document.getElementById('pill-strip'), lens=document.getElementById('pill-lens');
if(!strip||!lens)return;
function place(){
  const on=strip.querySelector('.tool[data-tool][aria-pressed="true"]');
  if(!on){ strip.style.setProperty('--lens-on','0'); return; }
  strip.style.setProperty('--lens-on','1');
  strip.style.setProperty('--lens-x',on.offsetLeft+'px');
}
new MutationObserver(place).observe(strip,{attributes:true,attributeFilter:['aria-pressed'],subtree:true});
addEventListener('resize',place);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
/* the first placement is silent: the lens appears on its tool, it does not slide there */
lens.style.transition='none'; place();
requestAnimationFrame(()=>requestAnimationFrame(()=>{ lens.style.transition=''; }));
})();
</script>

<script>
/* =========================================================================
   TYPING - the caret glides and the chrome steps back while you type.
   The lines are untouched: a mirror of the one the caret is in measures
   where it is, one bar slides there, and blinks only once you pause.
   ========================================================================= */
(function(){
'use strict';
const layer=document.getElementById('textlayer'), root=document.getElementById('lines'), caret=document.getElementById('caret'), mirror=document.getElementById('caret-mirror');
if(!layer||!root||!caret||!mirror)return;
let idleTimer=null, raf=0;
function measure(){
  raf=0;
  const ta=N.text&&N.text.currentText&&N.text.currentText(); if(!ta||!ta.isConnected){ hide(); return; }
  const line=ta.parentElement;
  mirror.style.width=ta.offsetWidth+'px';
  const at=ta.selectionDirection==='backward'?ta.selectionStart:ta.selectionEnd;
  mirror.textContent=ta.value.slice(0,at);
  const mark=document.createElement('i'); mirror.appendChild(mark);
  /* a trailing newline collapses without something after it */
  mirror.appendChild(document.createTextNode('\u200b'));
  const x=line.offsetLeft+mark.offsetLeft, y=line.offsetTop+mark.offsetTop+1;
  caret.style.transform='translate('+x+'px,'+y+'px)';
  caret.classList.add('on');
}
function schedule(){ if(!raf)raf=requestAnimationFrame(measure); }
function hide(){ caret.classList.remove('on','idle'); }
function typed(){
  /* a moving caret does not blink; it starts again half a second after the last key */
  caret.classList.remove('idle'); clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>caret.classList.add('idle'),500);
}
function focusMode(on){ document.body.classList.toggle('typing',on); }
layer.addEventListener('focusin',e=>{ if(root.contains(e.target)){ typed(); schedule(); } });
layer.addEventListener('focusout',e=>{ if(root.contains(e.target)&&!(e.relatedTarget&&root.contains(e.relatedTarget))){ hide(); focusMode(false); } });
layer.addEventListener('input',e=>{ if(root.contains(e.target)){ typed(); schedule(); } });
layer.addEventListener('keydown',e=>{
  if(!root.contains(e.target))return;
  typed(); schedule();
  /* printable keys and editing keys mean writing; a lone modifier does not */
  const key=e.key||'';   /* Scribble sends key events without a key */
  if(!e.ctrlKey&&!e.metaKey&&(key.length===1||key==='Backspace'||key==='Enter'||key==='Delete'))focusMode(true);
});
layer.addEventListener('keyup',e=>{ if(root.contains(e.target))schedule(); });
layer.addEventListener('pointerup',e=>{ if(root.contains(e.target))schedule(); });
document.addEventListener('selectionchange',()=>{ if(root.contains(document.activeElement))schedule(); });
/* the chrome comes back the moment a hand reaches for it */
addEventListener('pointermove',()=>{ if(document.body.classList.contains('typing'))focusMode(false); },{passive:true});
addEventListener('pointerdown',()=>focusMode(false),{passive:true,capture:true});
addEventListener('resize',schedule);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
N.typing={refresh:schedule};
})();
</script>

<script>
/* =========================================================================
   TUTOR - red ink on the page. Primitives in, hand drawn marks out.
   ========================================================================= */
(function(){
'use strict';
const C = N.core, S = C.S, M = C.M, $ = C.$;
let rc = null, animating = false;

function red(){ return N.ink ? N.ink.colors.red : '#C0392B'; }
function seed(id){ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))|0; return Math.abs(h)%9999; }

/* ---- where a mark can go without covering the student's work ---- */
const CELL = 16;
function occupancy(){
  const set = new Set();
  const mark = (b)=>{
    for(let y=Math.floor(b[1]/CELL); y<=Math.floor(b[3]/CELL); y++)
      for(let x=Math.floor(b[0]/CELL); x<=Math.floor(b[2]/CELL); x++) set.add(x+','+y);
  };
  for(const s of S.strokes) mark(s.bbox);
  for(const l of S.lines) mark([0, l.y, M.contentW, l.y+C.LINE_H]);
  for(const im of S.images) mark([im.x, im.y, im.x+im.w, im.y+im.h]);
  for(const a of S.annos) for(const o of (a.marks||[])) if(o.box) mark(o.box);
  return set;
}
function free(set, b){
  if(b[0] < -8 || b[2] > M.colW) return false;
  for(let y=Math.floor(b[1]/CELL); y<=Math.floor(b[3]/CELL); y++)
    for(let x=Math.floor(b[0]/CELL); x<=Math.floor(b[2]/CELL); x++) if(set.has(x+','+y)) return false;
  return true;
}
function findSpace(set, w, h, near){
  const tries = [];
  /* right margin first, then below, then above */
  for(let dy=0; dy<=160; dy+=CELL){
    tries.push([M.contentW+8, near[1]+dy]);
    if(dy) tries.push([M.contentW+8, near[1]-dy]);
  }
  for(let dy=CELL; dy<=220; dy+=CELL) tries.push([near[0], near[3]+dy]);
  for(let dy=CELL; dy<=160; dy+=CELL) tries.push([near[0], near[1]-h-dy]);
  for(const [x,y] of tries){
    const b = [x, y, x+w, y+h];
    if(b[1] < 8) continue;
    if(free(set, b)) return b;
  }
  return [M.contentW+8, near[3]+CELL, M.contentW+8+w, near[3]+CELL+h];
}
function boxOf(target){
  if(!target) return null;
  const cl = S.clusters.find(c=>c.id === target); if(cl) return cl.bbox.slice();
  const ln = S.lines.find(l=>l.id === target); if(ln) return [0, ln.y, Math.min(M.contentW, 40+ln.text.length*9), ln.y+C.LINE_H];
  const nd = (S.nodes||[]).find(n=>n.id === target);
  if(nd) return [nd.x, nd.y, nd.x+120, nd.y+C.LINE_H];
  return null;
}

/* ---- turn model ops into placed, drawable marks ---- */
function place(ops){
  const set = occupancy();
  const out = [];
  for(const o of ops){
    const b = boxOf(o.target) || [20, lastY()+40, 160, lastY()+70];
    const to = boxOf(o.to);
    if(o.op === 'circle'){
      out.push({k:'ellipse', x:(b[0]+b[2])/2, y:(b[1]+b[3])/2, w:(b[2]-b[0])+22, h:(b[3]-b[1])+18, box:b});
    } else if(o.op === 'underline'){
      out.push({k:'line', x1:b[0]-4, y1:b[3]+6, x2:b[2]+4, y2:b[3]+6, box:[b[0],b[3],b[2],b[3]+8]});
    } else if(o.op === 'strike'){
      out.push({k:'line', x1:b[0]-4, y1:(b[1]+b[3])/2, x2:b[2]+4, y2:(b[1]+b[3])/2, box:b});
    } else if(o.op === 'tick'){
      const p = findSpace(set, 26, 26, b);
      out.push({k:'tick', x:p[0], y:p[1], box:p}); mark(set, p);
    } else if(o.op === 'cross'){
      const p = findSpace(set, 26, 26, b);
      out.push({k:'cross', x:p[0], y:p[1], box:p}); mark(set, p);
    } else if(o.op === 'arrow'){
      const t = to || findSpace(set, 40, 24, b);
      out.push({k:'arrow', x1:(b[0]+b[2])/2, y1:b[3]+4, x2:(t[0]+t[2])/2, y2:t[1]-4, box:null});
    } else if(o.op === 'label' || o.op === 'sticky'){
      const text = String(o.text||'');
      const w = Math.min(Math.max(70, text.length*9.5), M.contentW >= C.CONTENT_MAX ? M.marginW+30 : Math.max(70, M.marginW-8));
      const lines = wrap(text, Math.floor(w/9.5));
      const h = 8 + lines.length*22;
      const p = findSpace(set, w, h, b);
      out.push({k:'text', x:p[0], y:p[1], lines, box:p, boxed:(o.op==='sticky')});
      mark(set, p);
      out.push({k:'arrow', x1:p[0]-6, y1:p[1]+12, x2:b[2]+4, y2:(b[1]+b[3])/2, box:null});
    }
  }
  return out;
}
function mark(set, b){
  for(let y=Math.floor(b[1]/CELL); y<=Math.floor(b[3]/CELL); y++)
    for(let x=Math.floor(b[0]/CELL); x<=Math.floor(b[2]/CELL); x++) set.add(x+','+y);
}
function wrap(t, n){
  const words = t.split(/\s+/), out = []; let cur = '';
  for(const w of words){
    if((cur+' '+w).trim().length > n){ if(cur) out.push(cur); cur = w; } else cur = (cur?cur+' ':'')+w;
  }
  if(cur) out.push(cur);
  return out.slice(0, 5);
}
function lastY(){
  let y = 40;
  for(const s of S.strokes) y = Math.max(y, s.bbox[3]);
  for(const l of S.lines) y = Math.max(y, l.y+C.LINE_H);
  return y;
}

function addAnno(ops, tag){
  const marks = place(ops);
  if(!marks.length) return null;
  const a = { id:C.uid(), tag:tag||'tutor', marks, t0:performance.now() };
  S.annos.push(a);
  animating = true;
  N.ink.renderAI();
  C.markDirty();
  return a;
}
function clearAnnos(tag){
  S.annos = tag ? S.annos.filter(a=>a.tag !== tag) : [];
  N.ink.renderAI(); C.markDirty();
}

/* ---- drawing ---- */
/* rough.js gives the marks a hand drawn edge. If it is unreachable the tutor
   still writes, just with a steadier hand, rather than disappearing. */
function pen(ctx, col){
  if(window.rough){
    if(!rc) rc = rough.canvas($('#c-ai'));
    return {
      line:(a,b,c,d,o)=>rc.line(a,b,c,d,o),
      ellipse:(x,y,w,h,o)=>rc.ellipse(x,y,w,h,o),
      rectangle:(x,y,w,h,o)=>rc.rectangle(x,y,w,h,o),
      linearPath:(pts,o)=>rc.linearPath(pts,o)
    };
  }
  const stroke = ()=>{ ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.lineCap='round'; };
  return {
    line:(a,b,c,d)=>{ stroke(); ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.stroke(); },
    ellipse:(x,y,w,h)=>{ stroke(); ctx.beginPath(); ctx.ellipse(x,y,w/2,h/2,0,0,6.284); ctx.stroke(); },
    rectangle:(x,y,w,h)=>{ stroke(); ctx.strokeRect(x,y,w,h); },
    linearPath:(pts)=>{ stroke(); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
                        for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.stroke(); }
  };
}
/* ---- the tutor's hand: every mark is drawn along its path, not stamped ---- */
const HAND = 0.62;            /* px per ms, roughly the pace of a real hand */
const HAND_FONT = '600 21px "Caveat","Segoe Script",system-ui,sans-serif';

function polyOf(m){
  if(m.k === 'line' || m.k === 'arrow') return [[m.x1,m.y1],[m.x2,m.y2]];
  if(m.k === 'tick')  return [[m.x+3,m.y+13],[m.x+10,m.y+21],[m.x+23,m.y+3]];
  if(m.k === 'cross') return [[m.x+3,m.y+3],[m.x+21,m.y+21],[m.x+21,m.y+3],[m.x+3,m.y+21]];
  return null;
}
function polyLen(p){
  let L = 0;
  for(let i=1;i<p.length;i++) L += Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]);
  return L;
}
function markDur(m){
  if(m.k === 'text')    return Math.max(260, m.lines.join('').length * 26);
  if(m.k === 'ellipse') return Math.min(950, Math.max(280, (Math.PI*(m.w+m.h)/2)/HAND));
  const p = polyOf(m);
  return p ? Math.min(900, Math.max(190, polyLen(p)/HAND)) : 280;
}
function alongPoly(p, t){
  const total = polyLen(p);
  let want = total * t;
  for(let i=1;i<p.length;i++){
    const L = Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]);
    if(want <= L || i === p.length-1){
      const f = L ? Math.min(1, want/L) : 1;
      return { x:p[i-1][0] + (p[i][0]-p[i-1][0])*f, y:p[i-1][1] + (p[i][1]-p[i-1][1])*f };
    }
    want -= L;
  }
  return { x:p[p.length-1][0], y:p[p.length-1][1] };
}
function markPoint(ctx, m, t){
  if(m.k === 'ellipse'){
    const a = -Math.PI/2 + t*Math.PI*2;
    return { x:m.x + Math.cos(a)*m.w/2, y:m.y + Math.sin(a)*m.h/2 };
  }
  if(m.k === 'text'){
    ctx.font = HAND_FONT;
    const n = Math.ceil(m.lines.join('').length * t);
    let idx = 0;
    for(let k=0;k<m.lines.length;k++){
      const len = m.lines[k].length;
      if(idx + len >= n || k === m.lines.length-1){
        const take = Math.max(0, Math.min(len, n - idx));
        return { x:m.x + ctx.measureText(m.lines[k].slice(0, take)).width, y:m.y + k*22 + 15 };
      }
      idx += len;
    }
  }
  const p = polyOf(m);
  return p ? alongPoly(p, t) : { x:m.x || m.x1 || 0, y:m.y || m.y1 || 0 };
}
/* Clip to the part of the path already travelled, so the finished rough stroke is
   revealed rather than redrawn. Redrawing a rough path every frame would jitter,
   because rough.js re-randomises whenever its endpoints move. */
function sweepClip(ctx, p, t){
  const total = polyLen(p);
  let want = total * t;
  const W = 15;
  ctx.beginPath();
  for(let i=1;i<p.length;i++){
    const ax = p[i-1][0], ay = p[i-1][1];
    const L = Math.hypot(p[i][0]-ax, p[i][1]-ay);
    if(L <= 0) continue;
    const f = Math.min(1, want/L);
    if(f <= 0) break;
    const bx = ax + (p[i][0]-ax)*f, by = ay + (p[i][1]-ay)*f;
    const dx = (bx-ax)/ (Math.hypot(bx-ax, by-ay) || 1), dy = (by-ay)/(Math.hypot(bx-ax, by-ay) || 1);
    const nx = -dy*W, ny = dx*W, ex = dx*W*0.6, ey = dy*W*0.6;
    ctx.moveTo(ax-ex+nx, ay-ey+ny);
    ctx.lineTo(bx+ex+nx, by+ey+ny);
    ctx.lineTo(bx+ex-nx, by+ey-ny);
    ctx.lineTo(ax-ex-nx, ay-ey-ny);
    ctx.closePath();
    want -= L;
    if(want <= 0) break;
  }
  ctx.clip();
}
function drawWhole(ctx, rc, m, o, col, upto){
  if(m.k === 'ellipse') rc.ellipse(m.x, m.y, m.w, m.h, o);
  else if(m.k === 'line') rc.line(m.x1, m.y1, m.x2, m.y2, o);
  else if(m.k === 'arrow'){
    rc.line(m.x1, m.y1, m.x2, m.y2, o);
    const ang = Math.atan2(m.y2-m.y1, m.x2-m.x1);
    rc.line(m.x2, m.y2, m.x2-11*Math.cos(ang-0.42), m.y2-11*Math.sin(ang-0.42), o);
    rc.line(m.x2, m.y2, m.x2-11*Math.cos(ang+0.42), m.y2-11*Math.sin(ang+0.42), o);
  }
  else if(m.k === 'tick') rc.linearPath([[m.x+3,m.y+13],[m.x+10,m.y+21],[m.x+23,m.y+3]], o);
  else if(m.k === 'cross'){ rc.line(m.x+3,m.y+3,m.x+21,m.y+21,o); rc.line(m.x+21,m.y+3,m.x+3,m.y+21,o); }
  else if(m.k === 'text'){
    if(m.boxed) rc.rectangle(m.x-6, m.y-4, (m.box[2]-m.box[0])+12, (m.box[3]-m.box[1])+8, {...o, roughness:1.8});
    ctx.fillStyle = col;
    ctx.font = HAND_FONT;
    ctx.textBaseline = 'top';
    const n = upto === undefined ? Infinity : upto;
    let idx = 0;
    m.lines.forEach((ln, k)=>{
      const take = Math.max(0, Math.min(ln.length, n - idx));
      if(take > 0) ctx.fillText(ln.slice(0, take), m.x, m.y + k*22);
      idx += ln.length;
    });
  }
}
/* a pencil at the tip, so the mark is visibly being written by someone */
function drawPencil(ctx, x, y, col){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(0.5);                       /* held up and to the right */
  ctx.fillStyle = col;
  ctx.beginPath();                       /* nib */
  ctx.moveTo(0,0); ctx.lineTo(-3.6,-8); ctx.lineTo(3.6,-8); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = .9;                  /* barrel */
  ctx.beginPath();
  ctx.moveTo(-3.6,-8); ctx.lineTo(-3.6,-27); ctx.lineTo(3.6,-27); ctx.lineTo(3.6,-8);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = .45;                 /* end */
  ctx.beginPath();
  ctx.moveTo(-3.6,-27); ctx.lineTo(3.6,-27); ctx.lineTo(0,-32); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawAnnos(ctx, scrollTop){
  const col = red(), now = performance.now(), still = C.reducedMotion();
  const rc = pen(ctx, col);
  let more = false, tip = null;
  ctx.save();
  for(const a of S.annos){
    if(!a.durs) a.durs = a.marks.map(markDur);
    let start = a.t0;
    for(let i=0;i<a.marks.length;i++){
      const m = a.marks[i], dur = a.durs[i] || 260;
      const t = still ? 1 : (now - start)/dur;
      start += dur + 70;
      if(t <= 0){ more = true; continue; }        /* its turn has not come yet */
      const p = Math.min(1, t);
      if(p < 1){ more = true; tip = markPoint(ctx, m, p); }
      const o = { stroke:col, strokeWidth:1.6, roughness:1.5, seed:seed(a.id)+i, bowing:1.2 };
      try{
        if(p >= 1 || m.k === 'text'){
          drawWhole(ctx, rc, m, o, col, m.k === 'text' && p < 1
            ? Math.ceil(m.lines.join('').length * p) : undefined);
        } else {
          ctx.save();
          if(m.k === 'ellipse'){
            const R = Math.max(m.w, m.h);
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.arc(m.x, m.y, R, -Math.PI/2, -Math.PI/2 + Math.max(0.001, p)*Math.PI*2);
            ctx.closePath();
            ctx.clip();
          } else {
            const poly = polyOf(m);
            if(poly) sweepClip(ctx, poly, p);
          }
          drawWhole(ctx, rc, m, o, col);
          ctx.restore();
        }
      }catch(e){}
    }
  }
  ctx.restore();
  if(tip) drawPencil(ctx, tip.x, tip.y, col);
  animating = more;
  if(more) requestAnimationFrame(()=>N.ink.renderAI());
}

/* ---- asking ---- */
const LEVELS = ['nudge','hint','next step','full solution'];
let level = 0, lastQuestion = '';
async function ask(question, lv){
  level = lv === undefined ? 0 : Math.max(0,Math.min(3,lv));
  lastQuestion = question || lastQuestion || 'help';
  try{
    const out = N.localMath.help(lastQuestion,level,S.nodes||[]);
    clearAnnos('tutor');
    if(out.ops.length) addAnno(out.ops,'tutor');
    reply(esc(out.say));speak(out.say);ladder('answered');
  }catch(e){reply('the maths helper could not check that expression. try typing it again.',true);ladder('idle');}
}
function reply(html, sys){
  const bar = $('#askbar'), r = $('#reply');
  r.innerHTML = html || '';
  r.classList.toggle('sys', !!sys);
  bar.classList.toggle('has-reply', !!html);
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function ladder(mode){
  const el = $('#ladder'), bar = $('#askbar');
  el.innerHTML = '';
  if(mode === 'thinking'){ bar.classList.remove('has-rungs'); return; }
  const mk = (label, cls, fn)=>{
    const b = document.createElement('button');
    b.className = cls; b.textContent = label; b.onclick = fn; el.appendChild(b);
  };
  /* one rung at a time: the next step down, never the whole staircase */
  if(mode === 'answered' && lastQuestion && level < LEVELS.length-1)
    mk(LEVELS[level+1], 'rung', ()=>ask(lastQuestion, level+1));
  mk('check my work', 'quiet', checkWork);
  if(mode === 'answered') mk('clear marks', 'quiet', ()=>clearAnnos('tutor'));
  if(mode === 'answered' && lastQuestion){
    const d = document.createElement('span');
    d.className = 'depth';
    d.title = 'how much of the answer has been shown';
    for(let i=0;i<LEVELS.length;i++){
      const s = document.createElement('i');
      if(i <= level) s.className = 'on';
      d.appendChild(s);
    }
    el.appendChild(d);
  }
  bar.classList.add('has-rungs');
}

/* ---- check my work: the model points, the CAS confirms ---- */
function verifyPair(a,b){return N.localMath.verifyPair(a,b);}
async function checkWork(){
  const steps=(S.nodes||[]).filter(n=>n.src&&!n.ref?.review&&N.mathcore.looksLikeMath(n.src));
  if(steps.length<2)return reply('write at least two steps and confirm any handwriting first.');
  const bad=[];let checked=0,unknown=0;
  for(let i=1;i<steps.length;i++){
    const valid=verifyPair(steps[i-1].src,steps[i].src);
    if(valid===false)bad.push(i);
    else if(valid===true)checked++;
    else unknown++;
  }
  clearAnnos('tutor');
  if(bad.length){
    const i=bad[0];
    addAnno([{op:'circle',target:steps[i].id},{op:'label',target:steps[i].id,text:'check this step'}],'tutor');
    return reply('step '+(i+1)+' does not agree with the line above. check the operation on both sides.');
  }
  if(unknown)return reply('verified '+checked+' of '+(steps.length-1)+' transitions. the remaining '+unknown+' are outside what the local checker supports.');
  addAnno([{op:'tick',target:steps.at(-1).id}],'tutor');
  reply('all '+checked+' step transitions agree.');

// Browser speech recognition may upload audio. This offline build has no microphone.
function listen(){}
function speak(t){
  if(!S.settings.voice||!t||!window.speechSynthesis)return;
  const lang=/[\uac00-\ud7af]/u.test(t)?'ko':/[\u3040-\u30ff]/u.test(t)?'ja':/[\u3400-\u9fff\uf900-\ufaff]/u.test(t)?'zh':'en';
  const local=speechSynthesis.getVoices().filter(v=>v.localService);
  const voice=local.find(v=>v.lang.toLowerCase().startsWith(lang)) || (lang==='en'?local.find(v=>/^en/i.test(v.lang)):null);
  if(!voice)return;
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(t);utterance.lang=voice.lang||lang;utterance.voice=voice;speechSynthesis.speak(utterance);
}

N.tutor = { drawAnnos, addAnno, clearAnnos, ask, checkWork, listen, speak, reply, ladder,
            hasVoice:false, findSpace, occupancy, place, verifyPair, LEVELS };
})();

<script>
/* =========================================================================
   PLOT - a small graph card in the margin, with a slider per free parameter
   ========================================================================= */
(function(){
'use strict';
const C = N.core, S = C.S, M = C.M, $ = C.$;
const cards = new Map();
const marginEl = $('#margin');

function card(node, top){
  let el = cards.get(node.id);
  if(!el){
    el = document.createElement('div');
    el.className = 'plot';
    el.innerHTML = '<canvas role="img"></canvas><div class="plot-desc"></div><div class="plot-error" hidden></div><div class="sliders"></div>';
    marginEl.appendChild(el);
    cards.set(node.id, el);
    el.addEventListener('pointerdown', e=>e.stopPropagation());
  }
  /* the card fills the margin; a narrowed margin gets a smaller graph rather
     than one that hangs past the paper's edge and puts a sideways scroll on
     a phone */
  const w = Math.max(84, Math.min(M.marginW - 16, M.colW - (M.contentW + 14) - 2)), h = Math.round(w*0.78);
  el.style.top = top+'px';
  el.style.left = (M.contentW + 14)+'px';
  el.style.width = w+'px';
  const cv = el.querySelector('canvas');
  const dpr = M.dpr;
  /* assigning width clears a canvas, so only do it when the size changed */
  const cw = Math.floor(w*dpr), ch = Math.floor(h*dpr);
  if(cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; cv.style.height = h+'px'; cv._drawKey = ''; }

  const vals = node.plot.vals || (node.plot.vals = {});
  const box = el.querySelector('.sliders');
  const want = node.plot.params.join(',');
  if(box.dataset.for !== want){
    box.dataset.for = want; box.innerHTML = '';
    for(const p of node.plot.params){
      if(vals[p] === undefined) vals[p] = 1;
      const row = document.createElement('label');
      row.className = 'sl';
      row.innerHTML = '<span>'+p+'</span><input type="range" min="-5" max="5" step="0.1" value="'+vals[p]+'"><span class="v">'+vals[p]+'</span>';
      const inp = row.querySelector('input'), out = row.querySelector('.v');
      inp.setAttribute('aria-label','graph parameter '+p);
      inp.addEventListener('input', ()=>{
        vals[p] = parseFloat(inp.value); out.textContent = inp.value;
        C.markDirty();
        /* one redraw per frame however fast the slider moves */
        if(!el._raf) el._raf = requestAnimationFrame(()=>{ el._raf = 0; paintGraphMeta(el,cv,node,w,h,dpr); });
      });
      box.appendChild(row);
    }
  }
  paintGraphMeta(el,cv,node,w,h,dpr);
  return el;
}
function drop(id){ const el = cards.get(id); if(el){ el.remove(); cards.delete(id); } }
function keep(ids){ for(const id of [...cards.keys()]) if(!ids.has(id)) drop(id); }

function paintGraphMeta(el,cv,node,w,h,dpr){
  const meta=draw(cv,node,w,h,dpr);
  if(!meta)return;
  const desc=el.querySelector('.plot-desc'),err=el.querySelector('.plot-error');
  const range='x −10 to 10, y '+fmtAxis(meta.lo)+' to '+fmtAxis(meta.hi);
  const samples=meta.samples&&meta.samples.length?' · '+meta.samples.map(p=>'y('+p.x+') = '+fmtAxis(p.y)).join(', '):'';
  desc.textContent=range+samples;
  err.hidden=!meta.error;err.textContent=meta.error||'';
  cv.setAttribute('aria-label','graph of y = '+node.plot.expr+'. '+range+samples+(meta.error?'. '+meta.error:''));
}
function fmtAxis(v){
  if(!Number.isFinite(v))return '?';
  /* short, but never "1.2e+3": big values are rounded to whole numbers,
     small ones keep their first two meaningful digits */
  const a=Math.abs(v);
  if(a>=1000)return String(Math.round(v));
  if(a<.01&&a!==0)return v.toFixed(Math.min(20,1-Math.floor(Math.log10(a)))).replace(/0+$/,'');
  return String(Math.round(v*100)/100);
}
/* what a redraw depends on, so an unchanged graph is not recomputed on every
   keystroke elsewhere on the page */
function drawKey(node, w, h, dpr){
  const sc = S.scope || {}; let sig = '';
  for(const k of Object.keys(sc)){ const v = sc[k]; sig += k+'='+(typeof v === 'function' ? 'f' : String(v))+';'; }
  return node.plot.expr+'|'+JSON.stringify(node.plot.vals||{})+'|'+sig+'|'+w+'x'+h+'@'+dpr+'|'+S.settings.angle+'|'+(N.ink?N.ink.colors.blue:'');
}
function draw(cv, node, w, h, dpr){
  const key = drawKey(node, w, h, dpr);
  if(cv._drawKey === key && cv._drawMeta) return null;
  const x = cv.getContext('2d');
  x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,w,h);
  const cs = getComputedStyle(document.documentElement);
  const blue = cs.getPropertyValue('--blue').trim();
  const rule = cs.getPropertyValue('--rule').trim();

  const X0 = -10, X1 = 10;
  const pts = [];
  const scope = Object.assign(N.mathcore.baseScope(), S.scope || {}, node.plot.vals || {});
  let lo = Infinity, hi = -Infinity, firstError='';
  const expr=N.mathcore.normalize(node.plot.expr);
  let fn = null;
  try{ fn = N.mathcore.compileRaw(expr); }catch(e){ firstError=e?.message||String(e); }
  const at = xv => { scope.x = xv; return Number(fn.evaluate(scope)); };
  for(let i=0;i<=160;i++){
    const xv = X0 + (X1-X0)*i/160;
    let yv = NaN;
    if(fn) try{ yv = at(xv); }catch(e){ if(!firstError)firstError=e?.message||String(e); }
    if(isFinite(yv)){ lo = Math.min(lo, yv); hi = Math.max(hi, yv); }
    pts.push([xv, yv]);
  }
  const noFinite=!isFinite(lo)||!isFinite(hi);
  if(noFinite || lo === hi){ lo = -5; hi = 5; }
  const padY = (hi-lo)*0.12; lo -= padY; hi += padY;
  if(hi-lo > 400){ lo = -20; hi = 20; }
  const sx = v => (v - X0)/(X1-X0)*w;
  const sy = v => h - (v - lo)/(hi - lo)*h;

  /* axes and a small numerical scale, since the page itself carries no grid */
  x.strokeStyle = rule; x.lineWidth = 1;
  x.beginPath(); x.moveTo(sx(0), 0); x.lineTo(sx(0), h); x.moveTo(0, sy(0)); x.lineTo(w, sy(0)); x.stroke();
  x.fillStyle=cs.getPropertyValue('--blue-quiet').trim();x.font='9px "IBM Plex Mono",monospace';
  x.textBaseline='top';
  for(const xv of [-10,-5,0,5,10]){
    const px=sx(xv);x.fillText(String(xv),Math.min(w-18,Math.max(1,px+2)),Math.min(h-11,Math.max(1,sy(0)+2)));
  }
  x.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const yv=lo+(hi-lo)*i/4,py=sy(yv);x.fillText(fmtAxis(yv),Math.min(w-34,Math.max(2,sx(0)+3)),Math.min(h-6,Math.max(6,py)));
  }

  x.strokeStyle = blue; x.lineWidth = 1.6; x.beginPath();
  let pen = false, prev = null;
  for(const [xv, yv] of pts){
    if(!isFinite(yv) || yv < lo - (hi-lo)*3 || yv > hi + (hi-lo)*3){ pen = false; prev = null; continue; }
    const py = sy(yv);
    /* break the path across an asymptote rather than drawing a vertical bar */
    if(prev !== null && Math.abs(py - prev) > h*0.8){ pen = false; }
    if(!pen){ x.moveTo(sx(xv), py); pen = true; } else x.lineTo(sx(xv), py);
    prev = py;
  }
  x.stroke();
  const samples=[];
  if(fn) for(const xv of [-5,0,5]){
    try{const yv=at(xv);if(Number.isFinite(yv))samples.push({x:xv,y:yv});}catch(e){}
  }
  const meta={lo,hi,samples,error:noFinite?('could not graph this expression.'+(firstError?': '+firstError:'')):''};
  cv._drawKey = key; cv._drawMeta = meta;
  return meta;
}

N.plot = { card, drop, keep, draw };
})();
</script>

<script>
/* =========================================================================
   UI - menu, notes, search, export, keyboard, photo drop
   ========================================================================= */
(function(){
'use strict';
const C = N.core, S = C.S, M = C.M, $ = C.$;
const sc = $('#scroller');

/* ---- overlays ---- */
let sheet = null;
let sheetReturnFocus = null;
const inertTargets=['#topbar','#scroller','#pill','#penpop','#askbar','#ask-dot','#offline-status','#local-status','#selbar','#library'];
function setMainInert(on){
  /* a panel closing over the notes page or drawer leaves the page behind
     them as it found it: still out of reach */
  const lib=!!(N.library&&N.library.modal);

/* The leading <h2> of every panel becomes a fixed header carrying the close

/* opts.fit: a short list of actions, as tall as its rows rather than 60% of

  const m = /^\s*<h2>([\s\S]*?)<\/h2>/.exec(html);
  const heading = m ? m[1] : '';
  const rest = m ? html.slice(m[0].length) : html;
  sheet = document.createElement('div');
  sheet.className = opts===true ? 'sheet notes-sheet' : (opts && opts.fit ? 'sheet fit' : 'sheet');
  const headingId='sheet-title-'+C.uid();
  sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.setAttribute('aria-labelledby',headingId);
  sheet.innerHTML =
    '<div class="box">' +
      '<button class="notes-grab" type="button" aria-label="expand panel" aria-expanded="false" title="drag to resize; drag down to close"></button>' +
      '<div class="head"><h2 id="'+headingId+'">'+heading+'</h2>' +
        '<button class="sheet-x" type="button" title="close" aria-label="close">' +
          '<i class="ph ph-x"></i><span class="fb" hidden>esc</span></button>' +
      '</div>' +
      '<div class="body">'+rest+'</div>' +
    '</div>';

     backdrop should not dismiss the panel */

  sheet.addEventListener('pointerdown', e=>{ backdropPress = e.target === sheet; });
  sheet.addEventListener('click', e=>{ if(backdropPress && e.target === sheet) closeSheet(); backdropPress = false; });

    if(e.key==='Escape'){e.preventDefault();closeSheet();return;}
    if(e.key!=='Tab')return;

    if(!fs.length){e.preventDefault();return;}

  });

  const body = sheet.querySelector('.body');
  body.addEventListener('wheel', e=>{ if(!e.ctrlKey && !e.metaKey && C.smoothWheel(body, e, 'y')) e.preventDefault(); }, {passive:false});
  setMainInert(true);
  sheet.classList.add('enter');

  sheet.classList.remove('enter');

    /* ---- the sheet is dragged, not toggled ----
       A bottom sheet that only answers a completed swipe feels like a switch
       someone flipped for you. This one follows the finger: above its resting
       height it grows upward from the bottom edge, below it the whole panel
       slides off, and on release it goes where the throw was headed - the
       rest, the top, or away. The handle and the heading are both grips, so
       the reach is the width of the sheet rather than a 36px pill. */
    const panel=sheet,box=panel.querySelector('.box'),grab=panel.querySelector('.notes-grab'),head=panel.querySelector('.head');
    /* a sheet sized to its few rows has nothing more to show: it only
       slides down to close, instead of stretching up and springing back */

    if(fit){grab.removeAttribute('aria-expanded');grab.setAttribute('aria-label','close panel');grab.title='drag down to close';}
    let drag=null,suppressClick=false;

    const collapse=()=>{panel.classList.remove('expanded');grab.setAttribute('aria-expanded','false');grab.setAttribute('aria-label','expand panel');};

       the top of the screen */

      /* measure the collapsed height without showing it */
      const h0=box.style.height;box.style.height='';
      panel.classList.remove('expanded');const h=box.offsetHeight;panel.classList.add('expanded');

    };
    const start=e=>{
      if(!e.isPrimary||e.button!==0)return;
      if(e.target.closest('button:not(.notes-grab),input,textarea,a[href]'))return;
      suppressClick=false;

         and a drag that never got up to speed still counts as an intention
         once it has moved further than a fidget. A throw down from the top
         lands at the resting height, not off the screen: pulling an
         expanded sheet back to the middle used to close it because a hand
         that has that far to travel is nearly always moving fast enough. */
      const wasUp=d.h>d.rest+40;
      if(want<d.rest-70||(flick>0.5&&!wasUp)){ closeSheet(); return; }
      if(fit)return;
      if(flick<-0.45||dy<-56){ expand(); return; }
      if(flick>0.2||dy>56){ collapse(); return; }

    };

      grip.addEventListener('pointerdown',start);
      grip.addEventListener('pointermove',move);
      grip.addEventListener('pointerup',end);
      for(const type of ['pointercancel','lostpointercapture'])
        grip.addEventListener(type,()=>{if(drag){drag=null;settle();}});
    }
    grab.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return;}if(fit)closeSheet();else if(panel.classList.contains('expanded'))collapse();else expand();});
    grab.addEventListener('keydown',e=>{
      if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;
      e.preventDefault();
      if(e.key==='End'||(fit&&e.key==='ArrowDown'))closeSheet();
      else if(fit)return;
      else if(e.key==='ArrowDown')panel.classList.contains('expanded')?collapse():closeSheet();
      else expand();
    });
  }
  /* with a keyboard the search box is where the Notes panel starts; on a
     tablet focusing it would raise the keyboard over the list, so the close
     control takes focus there, as it does in every other panel */
  const search = sheet.querySelector('#search');
  ((search && matchMedia('(pointer:fine)').matches) ? search : sheet.querySelector('.sheet-x')).focus();
  return sheet.querySelector('.box');
}
function closeSheet(immediate){
  if(!sheet)return;
  const el=sheet; sheet=null; setMainInert(false);
  if(immediate === true){ el.remove(); }
  else {
    el.classList.add('leave'); el.removeAttribute('role'); el.setAttribute('aria-hidden','true'); el.inert=true;
    let gone=false; const done=()=>{ if(gone)return; gone=true; el.remove(); };
    el.addEventListener('transitionend', done, {once:true});

  }

  if(back&&back.isConnected)try{back.focus();}catch(e){}
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Handwriting search is intentionally tolerant of small recognition mistakes.
   Short words stay exact because one changed letter there is too ambiguous. */
function searchText(s){

     those scripts is matched character by character across the whole line
     rather than against words that do not exist. */

  if(spaceless){
    const qa=Array.from(q),ta=Array.from(text.replace(/ /g,'')),limit=editLimit(q);
    if(!limit)return null;
    let best=Infinity;
    for(let width=Math.max(1,qa.length-limit);width<=qa.length+limit;width++){
      for(let at=0;at+width<=ta.length;at++)best=Math.min(best,distanceWithin(q,ta.slice(at,at+width).join(''),limit));
    }

function searchHit(doc,q){

  // label shown beside the note, even when fuzzy matching recovered a likely

    const m=fuzzyHandwriting(q,raw);if(!m)continue;
    const hit={score:6+m.score,kind:'handwriting',label:raw};
    if(!best||hit.score<best.score)best=hit;
  }
  return best;
}

/* ---- notes ----
   the list of notes is the library (its own script below): a page of its
   own on a phone, a drawer on a tablet, a sidebar on a desktop */
function notesSheet(){ return N.library ? N.library.open({focusSearch:true}) : null; }
function blank(id){
  N.recog.reset();
  S.id = id || C.uid(); S.title = 'untitled'; S.created = Date.now();
  S.strokes = []; S.lines = []; S.images = []; S.annos = []; S.clusters = []; S.nodes = []; S.textTranscripts = [];
  S.docH = 1600; S.selection = []; S.imageSelection=null; S.savedRev=0; S.remoteRev=0;
  C.Undo.back.length = 0; C.Undo.fwd.length = 0;
}
function paintAll(answers){
  $('#title').textContent = C.displayTitle(S.title, S.lines);
  C.paintUndo();
  N.text.reset(); N.mathcore.reset(); N.plot.keep(new Set());
  N.mathcore.restoreAnswers(answers);
  N.text.render(); N.recog.rebuild(); N.mathcore.run(); C.layout(); N.ink.render();
}
let changingNote = false;
async function newNote(id){
  if(changingNote) return;
  changingNote = true;
  try{
  do{ if(!await C.save()) return; }while(S.dirty);
  N.library && await N.library.leaving();
  blank(id);
  N.text.add(120, false);
  M.zoom = 1;
  paintAll();
  $('#scroller').scrollTop=0; $('#scroller').scrollLeft=0;
  C.saveView(S.id,0,0);
  N.text.focusLast();
  await C.save();
  N.collab && N.collab.noteChanged();
  N.tutorial && N.tutorial.maybeStart();
  N.library && N.library.changed();
  }finally{ changingNote = false; }
}
async function openNote(id){
  if(changingNote) return;
  changingNote = true;
  try{
  do{ if(!await C.save()) return; }while(S.dirty);
  N.library && await N.library.leaving();
  const doc = await C.Store.get('notas.note.'+id);
  if(!doc) return C.toast('that note could not be opened.');
  while(S.dirty){ if(!await C.save()) return; }
  blank(id);
  S.title = doc.title || 'untitled'; S.created = doc.created || Date.now();
  S.strokes = doc.strokes || []; S.lines = doc.lines || []; S.images = doc.images || [];
  S.textTranscripts = (doc.textTranscripts || []).filter(t=>t&&t.hash&&t.text);
  S.docH = doc.docH || 1600;
  S.savedRev = doc.rev || 0; S.remoteRev = 0;
  if(doc.settings) for(const k of ['angle','fractions','aiOn']) if(k in doc.settings) S.settings[k]=doc.settings[k];
  C.applyPrefs();
  if(!doc.localVersion)S.settings.aiOn=true;
  for(const t of (doc.transcripts||[])) N.recog.cache.set(t.hash, t);
  const view=C.getView(id)||doc.view||{};
  M.zoom = C.clamp(+view.zoom || 1, C.ZOOM_MIN, C.ZOOM_MAX);
  paintAll(doc.answers);
  $('#scroller').scrollTop = Math.max(0, view.scrollTop || 0);
  $('#scroller').scrollLeft = Math.max(0, view.scrollLeft || 0);
  C.setActive(id);
  applyTheme();
  N.ai.toggle();
  refreshTitle();
  N.text.focusLast();
  N.collab && N.collab.noteChanged();
  N.library && N.library.changed();
  }finally{ changingNote = false; }
}

/* ---- export ---- */
function contentBottom(){
  let y = 400;
  for(const s of S.strokes) y = Math.max(y, s.bbox[3]);
  for(const l of S.lines) y = Math.max(y, l.y + Math.max(C.LINE_H,l.h||C.LINE_H));
  for(const im of S.images) y = Math.max(y, im.y + im.h);
  document.querySelectorAll('#margin .chip, #margin .plot').forEach(el=>{
    y = Math.max(y, parseFloat(el.style.top||0) + el.offsetHeight);
  });
  return y + 40;
}
function loadImages(){
  return Promise.all(S.images.map(im=>new Promise(res=>{
    const el = new Image();
    el.onload = ()=>res({im, el}); el.onerror = ()=>res(null);
    el.src = im.src;
  })));
}
async function renderExport(){
  /* Export is a fresh rendering of note state, not a screenshot of whichever
     transient popup happened to be open. Recalculate first so an immediate
     export after typing cannot capture an older answer. */
  N.mathcore.run();
  const loaded = await loadImages();
  const w = M.colW, h = contentBottom();
  const scale = Math.min(2, Math.max(1, 2400/Math.max(w,h)));
  const cv = document.createElement('canvas');
  cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
  const x = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  x.fillStyle = cs.getPropertyValue('--paper').trim(); x.fillRect(0,0,cv.width,cv.height);
  x.scale(scale, scale);
  for(const pair of loaded){
    if(!pair) continue;
    try{
      const im=pair.im;
      if(im.rot){ x.save(); x.translate(im.x+im.w/2, im.y+im.h/2); x.rotate(im.rot); x.drawImage(pair.el, -im.w/2, -im.h/2, im.w, im.h); x.restore(); }
      else x.drawImage(pair.el, im.x, im.y, im.w, im.h);
    }catch(e){}
  }
  for(const st of S.strokes) N.ink.drawStroke(x, st);
  x.fillStyle = cs.getPropertyValue('--graphite').trim();
  x.font = '400 16px '+((getComputedStyle(document.documentElement).getPropertyValue('--type')||'').trim()||'ui-monospace, monospace'); x.textBaseline = 'top';
  for(const l of S.lines) if(l.text) drawWrapped(x,l.text,2,l.y+3,M.contentW-4,22.4);
  x.fillStyle = cs.getPropertyValue('--blue').trim();
  x.font = '600 21px "Caveat","Segoe Script",system-ui,sans-serif';
  x.textBaseline='alphabetic';
  document.querySelectorAll('#margin .chip').forEach(el=>{
    const n=S.nodes.find(o=>o.id===el.dataset.node);if(!n)return;
    const label=n.error?('cannot calculate, '+n.error):(n.result||'');if(!label)return;
    x.fillText(label, parseFloat(el.style.left||0), parseFloat(el.style.top||0) + 18);
  });
  document.querySelectorAll('#margin .plot').forEach(el=>{
    const pc=el.querySelector('canvas');if(!pc)return;
    const left=parseFloat(el.style.left||0),top=parseFloat(el.style.top||0),cw=parseFloat(pc.style.width)||pc.clientWidth,ch=parseFloat(pc.style.height)||pc.clientHeight;
    x.fillStyle=cs.getPropertyValue('--panel').trim();x.fillRect(left,top,el.offsetWidth,el.offsetHeight);
    try{x.drawImage(pc,left+8,top+8,cw,ch);}catch(e){}
    x.fillStyle=cs.getPropertyValue('--blue').trim();x.font='500 11px "IBM Plex Mono",monospace';x.textBaseline='top';
    let sy=top+8+ch+5;
    for(const row of el.querySelectorAll('.sl')){x.fillText((row.querySelector('span')?.textContent||'')+' = '+(row.querySelector('.v')?.textContent||''),left+8,sy);sy+=15;}
  });
  return cv;
}
function drawWrapped(ctx,text,left,top,maxWidth,lineHeight){
  let y=top;
  for(const para of String(text).split(/\r?\n/)){
    const pieces=/\s/.test(para)?(para.match(/\S+\s*/g)||[]):Array.from(para);
    let line='';
    for(const piece of pieces){
      const next=line+piece;
      if(line&&ctx.measureText(next).width>maxWidth){ctx.fillText(line.trimEnd(),left,y);y+=lineHeight;line=piece.trimStart();}
      else line=next;
    }
    if(line||!pieces.length){ctx.fillText(line.trimEnd(),left,y);y+=lineHeight;}
  }
  return y;
}
function download(name, href){
  const a = document.createElement('a');
  a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
async function exportPNG(){
  try{
    const cv = await renderExport();

      download((S.title||'notas')+'.png', URL.createObjectURL(b));

}
function exportJSON(){
  const blob = new Blob([JSON.stringify(C.serialize(), null, 1)], {type:'application/json'});

/* Every way in (file picker, drop, Ctrl+V, the Paste image button) goes through
   one normaliser because images are stored inline as data URLs. A screenshot

async function importNoteFile(f){
  if(changingNote)return false;

  try{
    do{if(!await C.save())return false;}while(S.dirty);
    if(f.size>36*1024*1024)throw new Error('that note export is too large to import safely.');
    const raw=JSON.parse(await f.text());
    /* a backup of many notes goes into the library rather than onto the page */
    if(raw&&raw.notasBundle&&Array.isArray(raw.notes)&&N.library)return await N.library.importBundle(raw);
    const doc=validateImportedNote(raw);
    blank();
    S.title=typeof doc.title==='string'&&doc.title.trim()?doc.title.trim():'imported note';
    S.created=Date.now();
    S.strokes=doc.strokes;S.lines=doc.lines;S.images=doc.images;
    S.textTranscripts=doc.textTranscripts;
    S.docH=Math.max(1600,Number(doc.docH)||1600);
    if(doc.settings)for(const k of ['angle','fractions','aiOn'])if(k in doc.settings)S.settings[k]=doc.settings[k];
    C.applyPrefs();
    for(const t of doc.transcripts)N.recog.cache.set(t.hash,t);
    if(!S.lines.length)S.lines.push({id:C.uid(),y:120,text:'',h:C.LINE_H});

    C.markDirty();

  }catch(e){C.toast(e&&e.message?e.message:'could not import that note.',7000);return false;}

/* ---- ask bar ---- */
let askOpen = false, holdT = null, held = false, askTimer = null;
function showAsk(on){
  if(askOpen === on) return;
  askOpen = on;
  const bar = $('#askbar'), dot = $('#ask-dot');
  clearTimeout(askTimer);
  if(on){
    bar.hidden = false;
    dot.classList.add('away');
    void bar.offsetWidth;              /* start the transition from the folded state */
    bar.classList.add('on');
    $('#ask-in').focus();
    if(!bar.classList.contains('has-rungs')) N.tutor.ladder('idle');
    N.tutorial && N.tutorial.check('ask');
  } else {
    bar.classList.remove('on');
    dot.classList.remove('away');
    /* a timeout, not transitionend, so reduced motion cannot leave it stuck open */
    askTimer = setTimeout(()=>{ if(!askOpen) bar.hidden = true; }, 220);
  }
}
$('#ask-dot').addEventListener('pointerdown', e=>{
  held = false;
  holdT = setTimeout(()=>{ held = true; N.tutor.listen(true); }, 350);
});
const relDot = ()=>{
  clearTimeout(holdT);
  if(held){ N.tutor.listen(false); held = false; showAsk(true); }
  else showAsk(true);
};
$('#ask-dot').addEventListener('pointerup', relDot);
$('#ask-dot').addEventListener('pointercancel', ()=>{ clearTimeout(holdT); N.tutor.listen(false); });
$('#ask-go').onclick = ()=>N.tutor.ask($('#ask-in').value.trim(), 0);
$('#ask-in').addEventListener('keydown', e=>{
  if(e.isComposing||e.keyCode===229)return;
  if(e.key === 'Enter') N.tutor.ask($('#ask-in').value.trim(), 0);
  if(e.key === 'Escape') showAsk(false);
});

};

/* ---- theme ---- */
function applyTheme(){
  const t = S.settings.theme;
  if(t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const theme=document.querySelector('meta[name="theme-color"]');
  if(theme)theme.content=getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()||'#F6F7F5';
  N.ink.refreshColors(); N.ink.render();
}

/* Keep the active typed line above a software keyboard without maintaining a
   second layout model. Android's interactive-widget mode usually resizes the
   content viewport itself; iPadOS exposes the same change through visualViewport. */
if(window.visualViewport){
  let viewportRaf=0;
  const keepEditorVisible=()=>{
    if(viewportRaf)return;
    viewportRaf=requestAnimationFrame(()=>{
      viewportRaf=0;
      const active=document.activeElement;
      if(!active)return;
      /* the editing host is the whole page; the line the caret is in is what must show */
      const el=active.closest?.('#lines')?(N.text&&N.text.currentText&&N.text.currentText()):(active.matches?.('#ask-in,.keyin,#search')?active:null);
      if(!el)return;
      try{el.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}
    });
  };
  visualViewport.addEventListener('resize',keepEditorVisible,{passive:true});
  visualViewport.addEventListener('scroll',keepEditorVisible,{passive:true});
}

/* ---- keyboard ---- */
let springFrom = null, springAt = 0;
window.addEventListener('keydown', e=>{
  const typing = N.ink.isTyping(e);
  const mod = e.metaKey || e.ctrlKey;
  if(e.isComposing || e.keyCode===229 || typeof e.key !== 'string') return;   /* Scribble sends key events without a key */
  const k = e.key.toLowerCase();
  /* App-level commands work even while a typed line has focus. Undo is
     deliberately excluded here so Ctrl/Cmd+Z remains native text undo. */
  if(mod && k === 's'){ e.preventDefault(); C.save({announce:true}); return; }
  if(mod && e.key === ','){ e.preventDefault(); menuSheet(); return; }
  if(mod && e.shiftKey && k === 'o'){ e.preventDefault(); notesSheet(); return; }
  /* ctrl/cmd K finds a note, unless the hint bar (hidden in this build) is back */
  if(mod && !e.shiftKey && k === 'k' && $('#ask-dot').hidden){ e.preventDefault(); notesSheet(); return; }
  if(mod && e.shiftKey && k === 'n'){ e.preventDefault(); newNote(); return; }
  if((mod && e.key === '/') || (!typing && e.key === '?')){ e.preventDefault(); shortcutsSheet(); return; }
  if(typing) return;
  if(mod && k === 'a'){ e.preventDefault(); N.ink.selectAll(); return; }
  /* The hint surface is intentionally hidden in this build. Do not let its old
     shortcut expose a panel that has no visible launcher. */
  if(mod && k === 'k' && !$('#ask-dot').hidden){ e.preventDefault(); showAsk(!askOpen); return; }
  if(N.ink.cropping()){
    if(e.key === 'Enter'){ e.preventDefault(); N.ink.applyCrop(); return; }
    if(e.key === 'Escape'){ e.preventDefault(); N.ink.cancelCrop(); return; }
  }
  if(e.key === 'Escape'){ closeSheet(); showAsk(false); N.ink.setPenPop(false); N.ink.clearSelection(); return; }
  if(mod && k === 'z'){ e.preventDefault(); e.shiftKey ? C.redo() : C.undo(); return; }
  if(mod && k === 'y'){ e.preventDefault(); C.redo(); return; }
  if(e.key === 'z' && !mod){ e.shiftKey ? C.redo() : C.undo(); return; }
  const map = {'p':'pen','v':'select','t':'text'};
  if(map[k]){ N.ink.setTool(map[k]); if(map[k] === 'pen') penNotice(); return; }
  if(k === 'e' && !e.repeat){ springFrom = S.tool; springAt = Date.now(); N.ink.setTool('eraser'); }
  if(e.key === 'Delete' || e.key === 'Backspace'){
    if(S.imageSelection){
      const del=[...document.querySelectorAll('#selbar button')].find(b=>b.textContent==='delete');
      if(del)del.click();
    }else if(S.selection.length){
      N.ink.deleteSelection();
    }
  }
  /* Copy, cut and duplicate act on lassoed ink. Paste is the paste event, so
     the system clipboard gets to say whether an image was copied since. */
  if(mod && S.selection.length && !e.shiftKey && !e.altKey){
    if(k === 'c'){ e.preventDefault(); N.ink.copySelection(false); return; }
    if(k === 'x'){ e.preventDefault(); N.ink.copySelection(true); return; }
    if(k === 'd'){ e.preventDefault(); N.ink.duplicateSelection(); return; }
  }
});
window.addEventListener('keyup', e=>{
  if(typeof e.key === 'string' && e.key.toLowerCase() === 'e' && springFrom){
    /* held long enough to be a spring, short enough to be a switch */
    if(Date.now() - springAt > 350) N.ink.setTool(springFrom);
    springFrom = null;
  }
});
$('#btn-undo').onclick = ()=>C.undo();
$('#btn-share').onclick = ()=>N.collab && N.collab.share();

/* ---- models: what is arriving behind the page ----
   The handwriting readers are fetched in the background, so nothing holds
   the notebook. The button in the bar wears a ring that fills while a model
   is on its way and opens a popover naming it, with how far along; a model
   that has arrived leaves the list, and an empty list says so. Rows are
   updated in place: a count that changes every few hundred milliseconds
   must not rebuild the list. The other readers still report here (the
   offline copy, the algebra engine) so a chip can ask after them, but only
   the models are shown. */
const DL = new Map();
const DL_MODELS = ['ink','text','cutout'];
const DL_NAMES = { ink:'hand-to-tex stroke reader', text:'pp-ocrv6 small text reader', cutout:'birefnet lite background remover', offline:'offline copy of notas', cas:'algebra engine' };
const DL_BUSY = new Set(['download','starting','loading','preparing']);
const dlPop = $('#dlpop'), dlBtn = $('#btn-downloads');
function dlSet(key, phase, detail, retry, loaded, total){
  const was = DL.get(key);
  loaded = loaded || 0; total = total || 0;
  if(was && was.phase === phase && (was.detail||'') === (detail||'') && was.loaded === loaded && was.total === total) return;
  DL.set(key, { phase, detail:detail||'', retry:retry || (was && was.retry) || null, loaded, total });
  dlPaint();
}
/* a model counts as arriving once its bytes are: "fetching" before the
   first byte, or a stored copy being read, shows nothing */
function dlArriving(key){ const d = DL.get(key); return !!d && d.phase === 'download' && d.loaded > 0; }
function dlBusy(){ for(const d of DL.values()) if(DL_BUSY.has(d.phase)) return true; return false; }
function dlMB(n){ return (n/1048576).toFixed(2)+' MB'; }
function dlPaint(){
  const rows = DL_MODELS.filter(dlArriving), ring = $('#dl-ring');
  if(ring){
    ring.hidden = !rows.length;
    let l = 0, t = 0, known = true;
    for(const k of rows){ const d = DL.get(k); l += d.loaded; if(d.total) t += d.total; else known = false; }
    ring.classList.toggle('spin', !known || !t);
    ring.style.setProperty('--p', known && t ? Math.min(100, Math.round(100*l/t)) : 0);
  }
  if(dlBtn){ const words = rows.length ? 'models, downloading' : 'models'; dlBtn.title = words; dlBtn.setAttribute('aria-label', words); }
  if(dlPop && !dlPop.hidden) dlRender();
}
function dlRender(){
  const list = dlPop.querySelector('.dl-list'); if(!list) return;
  const keys = DL_MODELS.filter(dlArriving);
  const shape = keys.join('|');
  if(list.dataset.shape !== shape){
    list.dataset.shape = shape;
    list.innerHTML = keys.length ? keys.map(k=>
      '<div class="dl-row" data-key="'+k+'"><i class="ph ph-cube"></i><span class="dl-name">'+esc(DL_NAMES[k])+'</span>' +
      '<span class="dl-bar"><span><i></i></span><span><i></i></span><span><i></i></span></span>' +
      '<span class="dl-state"><span class="dl-spin"></span><span class="dl-words"></span></span></div>').join('')
      : '<p class="dl-empty">no models are being downloaded yet.</p>';
  }
  for(const row of list.querySelectorAll('.dl-row')){
    const d = DL.get(row.dataset.key), words = row.querySelector('.dl-words'), parts = row.querySelectorAll('.dl-bar span > i');
    const p = d.total ? Math.min(1, d.loaded/d.total) : 0;
    const text = 'downloading: ' + (d.total ? Math.round(100*p)+'%, ' : '') + dlMB(d.loaded);
    if(words.textContent !== text) words.textContent = text;
    /* three segments fill in turn, the whole bar being the whole download */
    parts.forEach((part, i)=>{ part.style.width = Math.round(100*Math.max(0, Math.min(1, p*parts.length - i)))+'%'; });
  }
}
function dlPlace(){
  const r = dlBtn.getBoundingClientRect();
  dlPop.style.top = Math.round(r.bottom + 8)+'px';
  dlPop.style.right = Math.max(16, Math.round(innerWidth - r.right))+'px';
}
function dlOpen(open){
  if(dlPop.hidden === !open) return;
  dlPop.hidden = !open;
  dlBtn.setAttribute('aria-expanded', String(open));
  if(open){ dlRender(); dlPlace(); dlPop.focus({preventScroll:true}); }
  else if(document.activeElement === dlPop) dlBtn.focus({preventScroll:true});
}
dlBtn.onclick = ()=>dlOpen(dlPop.hidden);
dlPop.addEventListener('keydown', e=>{ if(e.key === 'Escape'){ e.preventDefault(); dlOpen(false); } });
document.addEventListener('pointerdown', e=>{ if(!dlPop.hidden && !dlPop.contains(e.target) && !dlBtn.contains(e.target)) dlOpen(false); }, true);
addEventListener('resize', ()=>{ if(!dlPop.hidden) dlPlace(); });
/* the two readers report their own setup; the panel mirrors it */
function dlSyncReaders(){
  if(!N.ai) return;
  const a = N.ai.setupState ? N.ai.setupState() : null, t = N.ai.textSetupState ? N.ai.textSetupState() : null;
  if(a) dlSet('ink', a.phase, a.detail, N.ai.retry, a.loaded, a.total);
  if(t) dlSet('text', t.phase, t.detail, N.ai.retryText, t.loaded, t.total);
}
if(N.ai && N.ai.watch){ N.ai.watch(dlSyncReaders); N.ai.watchText && N.ai.watchText(dlSyncReaders); dlSyncReaders(); }
N.downloads = { set:dlSet, sync:dlSyncReaders, open:dlOpen, busy:dlBusy };
$('#btn-redo').onclick = ()=>C.redo();
$('#btn-menu').onclick = menuSheet;
$('#brand').onclick = ()=>N.library ? N.library.toggle() : notesSheet();
/* the title edits where it sits: tap it, type, and Enter or a tap elsewhere
   keeps the new name. Escape puts the old one back. */
const titleEl = $('#title'), titleIn = $('#title-edit');
function editTitle(){
  if(!titleIn.hidden) return;
  titleIn.value = S.title === 'untitled' ? '' : S.title;
  titleIn.placeholder = C.displayTitle(S.title, S.lines);
  /* a preferred width, not a fixed one: the bar may shrink it further */
  titleIn.style.width = Math.max(120, Math.min(titleEl.offsetWidth + 32, Math.round(innerWidth * .44))) + 'px';
  titleEl.hidden = true; titleIn.hidden = false;
  document.body.classList.add('renaming');
  titleIn.focus(); titleIn.select();
}
function refreshTitle(){ titleEl.textContent = C.displayTitle(S.title, S.lines); }
function endTitleEdit(keep){
  if(titleIn.hidden) return;
  if(keep){
    const v = titleIn.value.trim() || 'untitled';
    if(v !== S.title){ S.title = v; C.markDirty(); }
  }
  refreshTitle();
  titleIn.hidden = true; titleEl.hidden = false;
  document.body.classList.remove('renaming');
}
titleEl.onclick = editTitle;
titleIn.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); endTitleEdit(true); titleEl.focus(); }
  else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); endTitleEdit(false); titleEl.focus(); }
});
titleIn.addEventListener('blur', ()=>endTitleEdit(true));

/* ---- icon fallback: if Phosphor did not load, the letters teach the keys ---- */
function checkIcons(){
  const ok = ()=>{ try{ return document.fonts.check('16px Phosphor'); }catch(e){ return true; } };
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(!ok()) document.body.classList.add('noicons'); });
}

document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ C.flushView(); C.save().then(()=>N.library && N.library.leaving()); } });
window.addEventListener('pagehide', ()=>{ C.flushView(); const t=$('#toast'); if(t) t.classList.remove('in'); });
window.addEventListener('beforeunload', e=>{ C.flushView(); if(S.dirty){ C.save(); } });

/* closing "the panel" from outside also closes the notes library when it
   is the thing covering the page */
function closePanel(immediate){ if(!sheet && immediate !== true && N.library) N.library.close(); closeSheet(immediate); }
N.ui = { openSheet, closeSheet:closePanel, notesSheet, menuSheet, privacySheet, penNotice, refreshTitle, newNote, openNote,
         shortcutsSheet, applyTheme, checkIcons, showAsk, exportPNG, exportJSON, printNote, renderExport, paintAll,
         searchText, searchHit, fuzzyHandwriting, chooseImage, chooseNoteImport, importNoteFile,
          insertImageFile, insertImages, pasteFromClipboard, transferImages, transferHasText, imageSpot, normaliseImage,
          validateImportedNote, download, esc, get changing(){ return changingNote; } };
})();
</script>

<script>
/* =========================================================================
   LIBRARY - every note, where it lives, and what it looks like.
   One panel, three shapes. On a phone it is a page of its own: the list is
   somewhere you go, and a sheet over the paper had its search box buried by
   the keyboard and its swipe-to-close fighting the list's own scrolling.
   On a tablet it is a drawer over the paper; on a desktop it docks beside
   it and stays open while you write. Short, focused choices (a note's
   actions, where to move it, confirming a delete) are still sheets on touch
   and a small menu under the pointer on a desktop.
   Notes are filed in flat folders, can be pinned, and go to a trash that
   empties itself after 30 days. Each has a small WebP picture of its first
   screen, because a page of handwriting is recognised by its shape long
   before anyone reads its title.
   ========================================================================= */
(function(){
'use strict';
const C = N.core, S = C.S, M = C.M, $ = C.$;
const el = $('#library'), panel = el.querySelector('.lib-panel'), list = $('#notelist');
const search = $('#search'), chips = el.querySelector('.lib-chips'), heading = $('#lib-heading');
const selbar = el.querySelector('.lib-selbar'), undoBar = $('#lib-undo');
const esc = s=>N.ui.esc(s);
const TRASH_DAYS = 30, THUMB_W = 400, THUMB_H = 300, THUMB_EVERY = 30000;

/* ---- shape ---- */
const mqDock = matchMedia('(pointer:fine) and (min-width:1100px)');
const mqWide = matchMedia('(min-width:700px)');
const mqFine = matchMedia('(pointer:fine)');
function shape(){ return mqDock.matches ? 'dock' : mqWide.matches ? 'drawer' : 'page'; }

/* ---- preferences: sort order, whether the desktop sidebar stays open ---- */
const PREF_KEY = 'notas.library';
function prefs(){ try{ return JSON.parse(localStorage.getItem(PREF_KEY)||'{}')||{}; }catch(e){ return {}; } }
function setPref(k, v){ const p = prefs(); p[k] = v; try{ localStorage.setItem(PREF_KEY, JSON.stringify(p)); }catch(e){} }

const L = { open:false, view:'all', query:'', rows:[], ix:[], folders:[], selecting:false, sel:new Set(),
            pushed:false, docs:new Map(), hits:null, purged:false, searchSeq:0 };

/* ---- folders: flat names; an empty folder is remembered on its own ---- */
function cleanFolder(v){ return String(v||'').replace(/\s+/g,' ').trim().slice(0,60); }
async function loadFolders(){
  const kept = (await C.Store.get('notas.folders')) || [];
  const all = new Set(kept.map(cleanFolder).filter(Boolean));
  for(const r of L.ix) if(r.folder) all.add(r.folder);
  return [...all].sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:'base', numeric:true}));
}
async function saveFolders(names){ await C.Store.set('notas.folders', [...new Set(names.map(cleanFolder).filter(Boolean))]); }

/* ---- the list ---- */
function title(r){ return r.title && r.title !== 'untitled' ? r.title : (r.preview || 'untitled'); }
function inView(r){
  if(L.view === 'trash') return !!r.trashed;
  if(r.trashed) return false;
  if(L.view === 'shared') return !!(N.collab && N.collab.isShared(r.id));
  if(L.view.startsWith('f:')) return r.folder === L.view.slice(2);
  return true;
}
function sorted(rows){
  const by = prefs().sort || 'updated';
  const cmp = by === 'name' ? (a,b)=>title(a).localeCompare(title(b), undefined, {sensitivity:'base', numeric:true})
            : by === 'created' ? (a,b)=>(b.created||b.updated||0)-(a.created||a.updated||0)
            : (a,b)=>(b.updated||0)-(a.updated||0);
  const trash = L.view === 'trash';
  return rows.slice().sort((a,b)=>trash ? (b.trashed-a.trashed) : ((!!b.pinned - !!a.pinned) || cmp(a,b)));
}
async function refresh(){
  L.ix = await C.Store.index();
  await purgeTrash();
  L.folders = await loadFolders();
  if(L.view.startsWith('f:') && !L.folders.includes(L.view.slice(2))) L.view = 'all';
  if(L.view === 'shared' && !L.ix.some(r=>!r.trashed && N.collab && N.collab.isShared(r.id))) L.view = 'all';
  for(const id of [...L.sel]) if(!L.ix.some(r=>r.id===id)) L.sel.delete(id);
  paintChips();
  if(L.query) await runSearch(L.query); else paint();
}
/* notes that have sat in the trash for 30 days go for good, once a session */
async function purgeTrash(){
  if(L.purged) return; L.purged = true;
  const cutoff = Date.now() - TRASH_DAYS*864e5, old = L.ix.filter(r=>r.trashed && r.trashed < cutoff && r.id !== S.id);
  for(const r of old) await C.deleteStoredNote(r.id);
  if(old.length) L.ix = await C.Store.index();
}

function chip(view, icon, label, count){
  const on = L.view === view;
  return '<button type="button" class="lib-chip" role="tab" aria-selected="'+on+'" data-view="'+esc(view)+'">' +
    '<i class="ph '+icon+'" aria-hidden="true"></i><span>'+esc(label)+'</span>' +
    (count ? '<span class="n">'+count+'</span>' : '') + '</button>';
}
function paintChips(){
  const live = L.ix.filter(r=>!r.trashed), trashed = L.ix.length - live.length;
  const shared = live.filter(r=>N.collab && N.collab.isShared(r.id)).length;
  chips.innerHTML =
    chip('all','ph-notebook','all notes', live.length) +
    (shared ? chip('shared','ph-users','shared', shared) : '') +
    L.folders.map(f=>chip('f:'+f,'ph-folder-simple', f, live.filter(r=>r.folder===f).length)).join('') +
    '<button type="button" class="lib-chip add" data-add="1"><i class="ph ph-folder-simple-plus" aria-hidden="true"></i><span>new folder</span></button>' +
    chip('trash','ph-trash','trash', trashed);
  heading.textContent = L.view === 'trash' ? 'trash' : L.view === 'shared' ? 'shared' : L.view.startsWith('f:') ? L.view.slice(2) : 'notes';
  $('#lib-fab').hidden = L.view === 'trash';
}
chips.addEventListener('click', e=>{
  const b = e.target.closest('.lib-chip'); if(!b) return;
  if(b.dataset.add){ newFolderSheet(); return; }
  setView(b.dataset.view);
});
/* arrow keys walk the folders, as in any row of tabs */
chips.addEventListener('keydown', e=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
  const all = [...chips.querySelectorAll('.lib-chip')], at = all.indexOf(document.activeElement); if(at<0) return;
  e.preventDefault();
  const next = all[(at + (e.key==='ArrowLeft'||e.key==='ArrowUp' ? -1 : 1) + all.length) % all.length];
  next.focus(); next.scrollIntoView({block:'nearest', inline:'nearest'});
});
function setView(v){
  if(L.view === v) return;
  L.view = v; endSelect(); paintChips();
  if(L.query) runSearch(L.query); else paint();
  list.scrollTop = 0;
}

function emptyText(){
  if(L.query) return 'no notes match that yet.';
  if(L.view === 'trash') return 'the trash is empty. deleted notes wait here for '+TRASH_DAYS+' days.';
  if(L.view === 'shared') return 'no shared notes.';
  if(L.view.startsWith('f:')) return 'nothing in this folder yet. move notes here from their menu, or start one with new note.';
  return 'no notes yet. start one with new note.';
}
function meta(r){
  const bits = [];
  if(L.view === 'trash') bits.push('deleted '+C.whenLabel(r.trashed));
  else bits.push(C.whenLabel(prefs().sort === 'created' ? (r.created||r.updated) : r.updated));
  if(r.folder && !L.view.startsWith('f:')) bits.push(r.folder);
  return bits.join(' · ');
}
function paint(hits){
  const focusId = document.activeElement && document.activeElement.closest && document.activeElement.closest('.note-row')?.dataset.id;
  const keepTop = list.scrollTop;
  const rows = hits ? hits.map(h=>h.row) : sorted(L.ix.filter(inView));
  L.rows = rows; L.hits = hits || null;
  list.innerHTML = '';
  list.classList.toggle('selecting', L.selecting);
  if(!rows.length){ list.innerHTML = '<p class="lib-empty">'+esc(emptyText())+'</p>'; paintSel(); return; }
  const frag = document.createDocumentFragment();
  for(const r of rows){
    const h = hits && hits.find(x=>x.row.id===r.id);
    const d = document.createElement('div');
    d.className = 'note-row'; d.dataset.id = r.id; d.setAttribute('role','listitem');
    if(r.id === S.id) d.setAttribute('aria-current','true');
    if(L.sel.has(r.id)) d.classList.add('sel');
    const shared = N.collab && N.collab.isShared(r.id);
    d.innerHTML =
      '<span class="lib-swipe" aria-hidden="true"><span class="l"><i class="ph ph-push-pin"></i>'+(r.pinned?'unpin':'pin')+'</span>' +
        '<span class="r"><i class="ph ph-trash"></i>'+(L.view==='trash'?'restore':'trash')+'</span></span>' +
      '<div class="lib-card">' +
        '<span class="lib-tick" aria-hidden="true"><i class="ph '+(L.sel.has(r.id)?'ph-check-circle':'ph-circle')+'"></i></span>' +
        '<button type="button" class="t" '+(L.selecting?'aria-pressed="'+L.sel.has(r.id)+'"':'')+'>' +
          '<span class="lib-thumb" data-thumb="'+esc(r.id)+'"><span class="lib-thumb-txt">'+esc(r.preview||'')+'</span></span>' +
          '<span class="lib-text"><span class="lib-name">'+esc(title(r))+'</span>' +
            '<span class="lib-meta">'+(r.pinned&&L.view!=='trash'?'<i class="ph ph-push-pin" aria-label="pinned"></i>':'')+(shared?'<i class="ph ph-users" aria-label="shared"></i>':'')+esc(meta(r))+'</span>' +
            (h&&h.label?'<span class="match" title="'+esc(h.kind==='handwriting'?'handwriting was read as this':'matching note text')+'">'+esc(h.label)+'</span>':'') +
          '</span>' +
        '</button>' +
        '<button type="button" class="lib-more" aria-label="more for '+esc(title(r))+'" title="more"><i class="ph ph-dots-three-vertical"></i><span class="fb" hidden>...</span></button>' +
      '</div>';
    if(mqFine.matches && L.view !== 'trash'){ d.draggable = true; }
    frag.appendChild(d);
  }
  list.appendChild(frag);
  list.scrollTop = keepTop;
  if(focusId){ const f = list.querySelector('.note-row[data-id="'+CSS.escape(focusId)+'"] .t'); if(f) f.focus({preventScroll:true}); }
  watchThumbs();
  paintSel();
}

/* ---- search: typed text, names and handwriting, as before ---- */
let searchTimer = null;
search.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  L.query = search.value.trim();
  if(!L.query){ L.searchSeq++; paint(); return; }
  searchTimer = setTimeout(()=>runSearch(L.query), 150);
});
search.addEventListener('keydown', e=>{
  if(e.key === 'ArrowDown'){ const f = list.querySelector('.note-row .t'); if(f){ e.preventDefault(); f.focus(); } }
  if(e.key === 'Enter'){ const f = list.querySelector('.note-row'); if(f){ e.preventDefault(); openRow(f.dataset.id); } }
});
async function docOf(id){
  if(id === S.id) return C.serialize();
  if(!L.docs.has(id)) L.docs.set(id, (await C.Store.get('notas.note.'+id)) || null);
  return L.docs.get(id);
}
async function runSearch(q){
  const seq = ++L.searchSeq, hits = [];
  for(const row of L.ix.filter(inView)){
    const doc = await docOf(row.id);
    if(seq !== L.searchSeq) return;
    if(!doc) continue;
    const hit = N.ui.searchHit(doc, q);
    if(hit) hits.push({row, ...hit});
  }
  hits.sort((a,b)=>a.score-b.score || ((b.row.updated||0)-(a.row.updated||0)));
  paint(hits);
}

/* ---- thumbnails ----
   The first screen of the note, drawn from its saved state (so any note can
   be pictured, not only the open one) into a 400x300 WebP of a few KB. The
   paper is left transparent and the picture remembers which theme drew it;
   shown under the other theme it is inverted, so a page of graphite ink
   never turns into a white card in dark mode. */
const thumbs = new Map();                /* id -> {src, dark, at} */
function darkNow(){
  const g = getComputedStyle(document.documentElement).getPropertyValue('--graphite').trim();
  const cx = document.createElement('canvas').getContext('2d'); cx.fillStyle = g;
  const hex = /^#([0-9a-f]{6})$/i.exec(cx.fillStyle); if(!hex) return false;
  const n = parseInt(hex[1],16); return ((n>>16&255)*.299 + (n>>8&255)*.587 + (n&255)*.114) > 140;
}
function loadImage(src){
  return new Promise(res=>{
    const im = new Image(), t = setTimeout(()=>res(null), 1500);
    im.onload = ()=>{ clearTimeout(t); res(im); }; im.onerror = ()=>{ clearTimeout(t); res(null); };
    im.src = src;
  });
}
function wrapText(x, text, left, top, maxW, lh, bottom){
  let y = top;
  for(const para of String(text).split(/\r?\n/)){
    const pieces = /\s/.test(para) ? (para.match(/\S+\s*/g)||[]) : Array.from(para);
    let line = '';
    for(const p of pieces){
      const next = line + p;
      if(line && x.measureText(next).width > maxW){ x.fillText(line.trimEnd(), left, y); y += lh; line = p.trimStart(); if(y > bottom) return; }
      else line = next;
    }
    x.fillText(line.trimEnd(), left, y); y += lh; if(y > bottom) return;
  }
}
async function renderThumb(doc){
  const strokes = doc.strokes||[], lines = (doc.lines||[]).filter(l=>l.text&&l.text.trim()), images = doc.images||[];
  if(!strokes.length && !lines.length && !images.length) return null;
  /* the picture is as wide as the writing, not the whole column: a few words
     in the corner of a wide page are still legible at 72px */
  const full = M.contentW || C.CONTENT_MAX || 720;
  let top = Infinity, right = 0;
  for(const st of strokes) if(st.bbox){ top = Math.min(top, st.bbox[1]); right = Math.max(right, st.bbox[2]); }
  for(const l of lines){ top = Math.min(top, l.y); right = Math.max(right, Math.min(full, 4 + 9.7*Math.max(...l.text.split(/\r?\n/).map(t=>t.length)))); }
  for(const im of images){ top = Math.min(top, im.y); right = Math.max(right, im.x + im.w); }
  const w = Math.max(360, Math.min(full, right + 24)), h = w*THUMB_H/THUMB_W;
  top = Math.max(0, (Number.isFinite(top) ? top : 0) - 24);
  const bottom = top + h, cv = document.createElement('canvas');
  cv.width = THUMB_W; cv.height = THUMB_H;
  const x = cv.getContext('2d'), cs = getComputedStyle(document.documentElement);
  x.scale(THUMB_W/w, THUMB_W/w); x.translate(0, -top);
  for(const im of images){
    if(im.y > bottom || im.y + im.h < top) continue;
    const img = await loadImage(im.src); if(!img) continue;
    try{
      if(im.rot){ x.save(); x.translate(im.x+im.w/2, im.y+im.h/2); x.rotate(im.rot); x.drawImage(img, -im.w/2, -im.h/2, im.w, im.h); x.restore(); }
      else x.drawImage(img, im.x, im.y, im.w, im.h);
    }catch(e){}
  }
  for(const st of strokes){
    if(st.bbox && (st.bbox[1] > bottom || st.bbox[3] < top)) continue;
    try{ N.ink.drawStroke(x, st); }catch(e){}
  }
  x.fillStyle = cs.getPropertyValue('--graphite').trim();
  x.font = '400 16px '+(cs.getPropertyValue('--type').trim()||'ui-monospace, monospace'); x.textBaseline = 'top';
  for(const l of lines) if(l.y < bottom && l.y + 400 > top) wrapText(x, l.text, 2, l.y+3, w-4, 22.4, bottom);
  let src = '';
  try{ src = cv.toDataURL('image/webp', 0.72); }catch(e){ return null; }
  /* Safari before 17 cannot encode WebP and hands back a PNG; that is kept,
     only larger */
  return {src, dark:darkNow(), at:Date.now()};
}
async function thumbOf(id){
  if(thumbs.has(id)) return thumbs.get(id);
  const t = (await C.Store.get('notas.thumb.'+id)) || null;
  thumbs.set(id, t); return t;
}
async function storeThumb(id, t){
  thumbs.set(id, t);
  if(t) await C.Store.set('notas.thumb.'+id, t); else await C.Store.del('notas.thumb.'+id);
}
/* the page being left is pictured on the way out, so the list shows it as
   it was just now; while the sidebar stays docked it is redrawn at most
   every half minute of writing */
let lastThumb = new Map();
async function pictureCurrent(){
  if(!S.id || !S.savedRev) return;
  try{
    const t = await renderThumb(C.serialize());
    await storeThumb(S.id, t); lastThumb.set(S.id, Date.now());
    showThumb(S.id);
  }catch(e){}
}
/* a picture is a nicety: switching notes never waits more than a moment for one */
async function leaving(){
  if(!S.id || (lastThumb.get(S.id)||0) >= (L.lastEdit||0)) return;
  await Promise.race([pictureCurrent(), new Promise(r=>setTimeout(r, 600))]);
}
/* rows scrolled into view are pictured if they have none, or theirs is older
   than the note (edited in another tab, or before thumbnails existed) */
const backlog = [];
let backlogBusy = false;
async function drainBacklog(){
  if(backlogBusy) return; backlogBusy = true;
  try{
    while(backlog.length){
      const id = backlog.shift(), row = L.ix.find(r=>r.id===id); if(!row) continue;
      const have = await thumbOf(id);
      if(have ? (have.at >= (row.updated||0) - 1000) : false){ showThumb(id); continue; }
      await new Promise(r=>(window.requestIdleCallback||setTimeout)(r, {timeout:400}));
      const doc = id === S.id ? C.serialize() : await C.Store.get('notas.note.'+id);
      if(!doc) continue;
      const t = await renderThumb(doc);
      if(t) await storeThumb(id, t); else { thumbs.set(id, null); await C.Store.del('notas.thumb.'+id); }
      if(id === S.id) lastThumb.set(id, Date.now());
      showThumb(id);
    }
  }finally{ backlogBusy = false; }
}
async function showThumb(id){
  const box = list.querySelector('.lib-thumb[data-thumb="'+CSS.escape(id)+'"]'); if(!box) return;
  const t = await thumbOf(id);
  let img = box.querySelector('img');
  if(!t){ if(img) img.remove(); box.classList.remove('has'); return; }
  if(!img){ img = document.createElement('img'); img.alt = ''; img.decoding = 'async'; box.appendChild(img); }
  if(img.getAttribute('src') !== t.src) img.src = t.src;
  img.classList.toggle('flip', !!t.dark !== darkNow());
  box.classList.add('has');
}
let seen = null;
function watchThumbs(){
  if(seen) seen.disconnect();
  const boxes = list.querySelectorAll('.lib-thumb');
  const want = box=>{ const id = box.dataset.thumb; showThumb(id); if(!backlog.includes(id)) backlog.push(id); drainBacklog(); };
  if(!('IntersectionObserver' in window)){ boxes.forEach(want); return; }
  seen = new IntersectionObserver(es=>{ for(const e of es) if(e.isIntersecting){ seen.unobserve(e.target); want(e.target); } }, {root:list, rootMargin:'200px 0px'});
  boxes.forEach(b=>seen.observe(b));
}
/* the theme changed: pictures drawn under the other one are inverted */
new MutationObserver(()=>{ if(L.open) list.querySelectorAll('.lib-thumb img').forEach(img=>{ const id = img.parentNode.dataset.thumb, t = thumbs.get(id); if(t) img.classList.toggle('flip', !!t.dark !== darkNow()); }); })
  .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ if(L.open) paint(L.hits || undefined); });

/* ---- open, close, dock ---- */
const MAIN = ['#topbar','#scroller','#pill','#penpop','#askbar','#offline-status','#local-status','#selbar'];
function setMainInert(on){ for(const sel of MAIN){ const m = document.querySelector(sel); if(m) m.inert = !!on; } }
let returnFocus = null;
async function open(opts={}){
  const was = L.open, mode = shape();
  if(!was){
    L.open = true;
    returnFocus = document.activeElement instanceof HTMLElement && !el.contains(document.activeElement) ? document.activeElement : null;
    el.dataset.mode = mode;
    panel.setAttribute('role', mode === 'dock' ? 'complementary' : 'dialog');
    if(mode === 'dock') panel.removeAttribute('aria-modal'); else panel.setAttribute('aria-modal','true');
    el.hidden = false; el.classList.add('enter');
    $('#brand').setAttribute('aria-expanded','true');
    if(mode === 'dock'){ setPref('docked', true); document.body.classList.add('lib-docked'); C.layout(); }
    else {
      setMainInert(true);
      if(mode === 'page'){ try{ history.pushState({notasLibrary:1}, ''); L.pushed = true; }catch(e){} }
    }
    void el.offsetWidth; el.classList.remove('enter');
  }
  if(was && opts.focusSearch && mqFine.matches){ search.focus(); search.select(); return; }
  await refresh();
  /* with a keyboard the search box is where the list starts; on a touch
     screen that would raise the keyboard over the list */
  if(opts.focusSearch && (mqFine.matches || opts.focusSearch === 'force')){ search.focus(); search.select(); }
  else if(!was){
    const cur = list.querySelector('.note-row[aria-current="true"] .t') || list.querySelector('.note-row .t');
    (mode === 'dock' && cur ? cur : el.querySelector('.lib-close')).focus({preventScroll:true});
    const row = list.querySelector('.note-row[aria-current="true"]'); if(row) row.scrollIntoView({block:'nearest'});
  }
}
function close(opts={}){
  if(!L.open) return;
  /* on a phone the list is a page in the history: closing it is going back,
     so the system back gesture and the arrow in the corner agree */
  if(el.dataset.mode === 'page' && L.pushed && !opts.fromHistory){ L.pushed = false; try{ history.back(); }catch(e){} }
  L.open = false; L.pushed = false; endSelect(); closePop();
  const mode = el.dataset.mode, inside = el.contains(document.activeElement);
  $('#brand').setAttribute('aria-expanded','false');
  if(mode === 'dock'){
    if(!opts.keepDocked) setPref('docked', false);
    document.body.classList.remove('lib-docked'); el.hidden = true; C.layout();
  } else {
    setMainInert(false);
    if(opts.immediate){ el.hidden = true; }
    else {
      el.classList.add('leave');
      let gone = false; const done = ()=>{ if(gone) return; gone = true; el.classList.remove('leave'); if(!L.open) el.hidden = true; };
      panel.addEventListener('transitionend', done, {once:true}); setTimeout(done, 260);
    }
  }
  if(inside){ const back = returnFocus && returnFocus.isConnected ? returnFocus : $('#brand'); try{ back.focus({preventScroll:true}); }catch(e){} }
  returnFocus = null;
}
function toggle(){ L.open ? close() : open(); }
addEventListener('popstate', ()=>{ if(L.open && L.pushed){ L.pushed = false; close({fromHistory:true}); } });
/* a rotated tablet or a resized window takes the panel's other shape */
function reshape(){
  const mode = shape();
  if(L.open && el.dataset.mode !== mode){
    const wasDock = el.dataset.mode === 'dock';
    if(el.dataset.mode === 'page' && L.pushed){ L.pushed = false; try{ history.back(); }catch(e){} }
    close({immediate:true, fromHistory:true, keepDocked:true});
