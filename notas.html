    if(mode === 'dock' ? (wasDock || prefs().docked) : !wasDock) open();
  } else if(!L.open && mode === 'dock' && prefs().docked) open();
}
mqDock.addEventListener?.('change', reshape); mqWide.addEventListener?.('change', reshape);
el.querySelector('.lib-close').onclick = ()=>close();
el.querySelector('.lib-scrim').onclick = ()=>close();
el.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && !e.defaultPrevented){
    e.preventDefault(); e.stopPropagation();
    if(pop){ closePop(); return; }
    if(L.selecting){ endSelect(); return; }
    if(search.value && document.activeElement === search){ search.value = ''; search.dispatchEvent(new Event('input')); return; }
    close(); return;
  }
  /* page and drawer are modal: Tab stays inside */
  if(e.key === 'Tab' && el.dataset.mode !== 'dock'){
    const fs = [...panel.querySelectorAll('button,input,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled && !x.closest('[hidden]') && x.getClientRects().length);
    if(!fs.length) return;
    const first = fs[0], last = fs[fs.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
/* drawer: a swipe toward the edge it came from puts it away */
{
  let sw = null;
  panel.addEventListener('pointerdown', e=>{ if(el.dataset.mode === 'drawer' && e.pointerType !== 'mouse') sw = {x:e.clientX, y:e.clientY, id:e.pointerId}; });
  panel.addEventListener('pointermove', e=>{
    if(!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if(Math.abs(dy) > 24 && Math.abs(dy) > Math.abs(dx)){ sw = null; panel.style.transform = ''; return; }
    if(dx < -8 && !swipe) panel.style.transform = 'translateX('+dx+'px)';
  });
  const end = e=>{
    if(!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x; sw = null; panel.style.transform = '';
    if(dx < -90) close();
  };
  panel.addEventListener('pointerup', end); panel.addEventListener('pointercancel', ()=>{ sw = null; panel.style.transform = ''; });
}

/* ---- opening a note ---- */
async function openRow(id){
  if(L.selecting){ toggleSel(id); return; }
  if(L.view === 'trash'){ rowMenu(id); return; }
  if(el.dataset.mode !== 'dock') close();
  if(id !== S.id) await N.ui.openNote(id);
  else N.text && N.text.focusLast && N.text.focusLast();
  if(L.open) markCurrent();
}
function markCurrent(){
  list.querySelectorAll('.note-row').forEach(r=>{ if(r.dataset.id === S.id) r.setAttribute('aria-current','true'); else r.removeAttribute('aria-current'); });
}
async function newNote(){
  const folder = L.view.startsWith('f:') ? L.view.slice(2) : '';
  if(el.dataset.mode !== 'dock') close();
  await N.ui.newNote();
  S.newFolder = folder ? {id:S.id, folder} : null;
}
$('#lib-new').onclick = newNote;
$('#lib-fab').onclick = newNote;

/* ---- rows: tap, keys, long press, swipe, right click, drag ---- */
let swipe = null, press = null, pressFired = false, quietUntil = 0, lastPointer = 'mouse';
list.addEventListener('click', e=>{
  /* the tap that ends a long press or a swipe is not also a tap on the row */
  if(performance.now() < quietUntil){ e.preventDefault(); return; }
  const row = e.target.closest('.note-row'); if(!row) return;
  const id = row.dataset.id;
  if(e.target.closest('.lib-more')){ rowMenu(id, e.target.closest('.lib-more')); return; }
  if(!e.target.closest('.t, .lib-tick')) return;
  /* ctrl/cmd click picks, shift click picks a run, as in any file list */
  if(e.metaKey || e.ctrlKey){ startSelect(id); return; }
  if(e.shiftKey && (L.selecting || L.anchor)){
    const ids = L.rows.map(r=>r.id), a = ids.indexOf(L.anchor || id), b = ids.indexOf(id);
    if(!L.selecting) startSelect(null);
    for(let i = Math.min(a,b); i <= Math.max(a,b); i++) if(i >= 0) L.sel.add(ids[i]);
    paintSelState(); return;
  }
  L.anchor = id;
  openRow(id);
});
list.addEventListener('keydown', e=>{
  const row = e.target.closest && e.target.closest('.note-row'); if(!row) return;
  const rows = [...list.querySelectorAll('.note-row')], at = rows.indexOf(row);
  const go = i=>{ const r = rows[Math.max(0, Math.min(rows.length-1, i))]; if(r){ e.preventDefault(); r.querySelector('.t').focus(); r.scrollIntoView({block:'nearest'}); } };
  if(e.key === 'ArrowDown') return go(at+1);
  if(e.key === 'ArrowUp'){ if(at === 0){ e.preventDefault(); search.focus(); return; } return go(at-1); }
  if(e.key === 'Home') return go(0);
  if(e.key === 'End') return go(rows.length-1);
  if(e.key === 'F2' && L.view !== 'trash'){ e.preventDefault(); renameSheet(row.dataset.id); return; }
  if((e.key === 'Delete' || (e.key === 'Backspace' && (e.metaKey||e.ctrlKey))) && L.view !== 'trash'){ e.preventDefault(); trash(L.selecting && L.sel.size ? [...L.sel] : [row.dataset.id]); return; }
  if(e.key === ' ' && L.selecting){ e.preventDefault(); toggleSel(row.dataset.id); }
});
list.addEventListener('contextmenu', e=>{
  const row = e.target.closest('.note-row'); if(!row) return;
  e.preventDefault();
  if(lastPointer === 'touch') return;          /* a long press on touch picks the note instead */
  const kb = e.button !== 2 && !e.clientX && !e.clientY;
  rowMenu(row.dataset.id, kb ? row.querySelector('.lib-more') : {x:e.clientX, y:e.clientY});
});
list.addEventListener('pointerdown', e=>{
  lastPointer = e.pointerType;
  const row = e.target.closest('.note-row'); if(!row || e.button !== 0 || e.target.closest('.lib-more')) return;
  if(e.pointerType === 'mouse') return;
  const card = row.querySelector('.lib-card');
  swipe = {id:e.pointerId, x:e.clientX, y:e.clientY, row, card, dx:0, on:false};
  clearTimeout(press);
  press = setTimeout(()=>{
    if(!swipe || swipe.on) return;
    press = null; swipe = null; pressFired = true;
    try{ navigator.vibrate && navigator.vibrate(8); }catch(err){}
    if(L.selecting) toggleSel(row.dataset.id); else startSelect(row.dataset.id);
  }, 480);
});
list.addEventListener('pointermove', e=>{
  if(!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if(!swipe.on){
    if(Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)){ clearTimeout(press); swipe = null; return; }
    if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)*1.5 && !L.selecting){ swipe.on = true; clearTimeout(press); swipe.row.classList.add('swiping'); }
    else return;
  }
  swipe.dx = Math.max(-140, Math.min(140, dx));
  swipe.card.style.transform = 'translateX('+swipe.dx+'px)';
  swipe.row.dataset.dir = swipe.dx < 0 ? 'r' : 'l';
  swipe.row.classList.toggle('armed', Math.abs(swipe.dx) > 88);
});
function endSwipe(e, cancel){
  clearTimeout(press);
  if(!swipe || (e && e.pointerId !== swipe.id)) return;
  const s = swipe; swipe = null;
  if(!s.on) return;
  quietUntil = performance.now() + 400;
  s.row.classList.remove('swiping','armed'); s.card.style.transform = '';
  if(cancel || Math.abs(s.dx) <= 88) return;
  const id = s.row.dataset.id;
  if(s.dx < 0) (L.view === 'trash' ? restore([id]) : trash([id]));
  else if(L.view !== 'trash') pin([id], !(L.ix.find(r=>r.id===id)||{}).pinned);
}
list.addEventListener('pointerup', e=>{ if(pressFired){ pressFired = false; quietUntil = performance.now() + 400; } endSwipe(e, false); });
list.addEventListener('pointercancel', e=>{ pressFired = false; endSwipe(e, true); });
/* desktop: drag rows onto a folder, onto all notes to unfile, or onto the trash */
const DRAG_TYPE = 'application/x-notas-notes';
list.addEventListener('dragstart', e=>{
  const row = e.target.closest && e.target.closest('.note-row'); if(!row) return;
  const ids = L.sel.has(row.dataset.id) ? [...L.sel] : [row.dataset.id];
  e.dataTransfer.setData(DRAG_TYPE, JSON.stringify(ids)); e.dataTransfer.effectAllowed = 'move';
  row.classList.add('dragging');
});
list.addEventListener('dragend', e=>{ const row = e.target.closest && e.target.closest('.note-row'); if(row) row.classList.remove('dragging'); });
chips.addEventListener('dragover', e=>{
  const b = e.target.closest('.lib-chip[data-view]'); if(!b || !e.dataTransfer.types.includes(DRAG_TYPE) || b.dataset.view === 'shared') return;
  e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'move';
  chips.querySelectorAll('.drop').forEach(x=>x!==b&&x.classList.remove('drop')); b.classList.add('drop');
});
chips.addEventListener('dragleave', e=>{ const b = e.target.closest('.lib-chip'); if(b && !b.contains(e.relatedTarget)) b.classList.remove('drop'); });
chips.addEventListener('drop', e=>{
  const b = e.target.closest('.lib-chip[data-view]'); if(!b || !e.dataTransfer.types.includes(DRAG_TYPE)) return;
  e.preventDefault(); e.stopPropagation(); b.classList.remove('drop');
  let ids = []; try{ ids = JSON.parse(e.dataTransfer.getData(DRAG_TYPE)); }catch(err){ return; }
  const v = b.dataset.view;
  if(v === 'trash') trash(ids);
  else if(v === 'all') move(ids, '');
  else if(v.startsWith('f:')) move(ids, v.slice(2));
});

/* ---- picking several ---- */
function startSelect(id){
  L.selecting = true; if(id){ L.sel.add(id); L.anchor = id; }
  list.classList.add('selecting'); paintSelState();
}
function endSelect(){
  if(!L.selecting && !L.sel.size) return;
  L.selecting = false; L.sel.clear();
  list.classList.remove('selecting'); paintSelState();
}
function toggleSel(id){
  if(L.sel.has(id)) L.sel.delete(id); else L.sel.add(id);
  L.anchor = id;
  paintSelState();
}
function paintSelState(){
  list.querySelectorAll('.note-row').forEach(r=>{
    const on = L.sel.has(r.dataset.id);
    r.classList.toggle('sel', on);
    const t = r.querySelector('.t'); if(L.selecting) t.setAttribute('aria-pressed', String(on)); else t.removeAttribute('aria-pressed');
    const i = r.querySelector('.lib-tick i'); if(i) i.className = 'ph '+(on ? 'ph-check-circle' : 'ph-circle');
  });
  paintSel();
}
function paintSel(){
  selbar.hidden = !L.selecting;
  el.classList.toggle('selecting', L.selecting);
  if(!L.selecting) return;
  const n = L.sel.size, trashV = L.view === 'trash';
  selbar.querySelector('.lib-count').textContent = n ? n+' selected' : 'pick notes';
  selbar.querySelectorAll('[data-act]').forEach(b=>{
    const a = b.dataset.act;
    b.hidden = trashV ? !['restore','purge'].includes(a) : ['restore','purge'].includes(a);
    b.disabled = !n;
  });
}
selbar.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const ids = [...L.sel];
  if(b.dataset.done){ endSelect(); return; }
  if(b.dataset.all){ L.rows.forEach(r=>L.sel.add(r.id)); paintSelState(); return; }
  switch(b.dataset.act){
    case 'move': moveSheet(ids); break;
    case 'pin': pin(ids, !ids.every(id=>(L.ix.find(r=>r.id===id)||{}).pinned)); endSelect(); break;
    case 'export': exportNotes(ids); break;
    case 'trash': trash(ids); break;
    case 'restore': restore(ids); break;
    case 'purge': purgeSheet(ids); break;
  }
});

/* ---- menus: a sheet on touch, a popover under the pointer on a desktop ---- */
let pop = null;
function closePop(){ if(!pop) return; const p = pop; pop = null; p.remove(); if(p._back && p._back.isConnected) p._back.focus({preventScroll:true}); }
function menu(titleText, items, anchor){
  items = items.filter(Boolean);
  const html = items.map((it,i)=>it === '-' ? '<hr>' :
    '<button type="button" class="mi'+(it.danger?' danger':'')+'" data-i="'+i+'" role="menuitem"><i class="ph '+it.icon+'"></i>'+esc(it.label)+(it.k?'<span class="k">'+esc(it.k)+'</span>':'')+'</button>').join('');
  const run = i=>{ const it = items[i]; if(it && it.run) it.run(); };
  if(!mqFine.matches || !anchor){
    const box = N.ui.openSheet('<h2>'+esc(titleText)+'</h2>'+html, {fit:true});
    box.querySelectorAll('[data-i]').forEach(b=>b.onclick = ()=>{ N.ui.closeSheet(); run(+b.dataset.i); });
    return;
  }
  closePop();
  pop = document.createElement('div');
  pop.className = 'lib-pop glass'; pop.setAttribute('role','menu'); pop.setAttribute('aria-label', titleText);
  pop.innerHTML = html; pop._back = document.activeElement;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : {left:anchor.x, right:anchor.x, top:anchor.y, bottom:anchor.y};
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = anchor.getBoundingClientRect ? r.right - pw : r.left, y = r.bottom + 4;
  if(y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 4);
  x = Math.max(8, Math.min(innerWidth - pw - 8, x));
  pop.style.left = x+'px'; pop.style.top = y+'px';
  const btns = [...pop.querySelectorAll('[data-i]')];
  btns.forEach(b=>b.onclick = ()=>{ closePop(); run(+b.dataset.i); });
  pop.addEventListener('keydown', e=>{
    const at = btns.indexOf(document.activeElement);
    if(e.key === 'ArrowDown'){ e.preventDefault(); btns[(at+1)%btns.length].focus(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); btns[(at-1+btns.length)%btns.length].focus(); }
    else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); closePop(); }
    else if(e.key === 'Tab'){ e.preventDefault(); closePop(); }
  });
  btns[0] && btns[0].focus();
}
document.addEventListener('pointerdown', e=>{ if(pop && !pop.contains(e.target)) closePop(); }, true);
addEventListener('resize', closePop);
list.addEventListener('scroll', closePop, {passive:true});

function rowMenu(id, anchor){
  const r = L.ix.find(x=>x.id===id); if(!r) return;
  if(r.trashed) return menu(title(r), [
    {icon:'ph-arrow-counter-clockwise', label:'restore', run:()=>restore([id])},
    {icon:'ph-trash', label:'delete forever', danger:true, run:()=>purgeSheet([id])},
  ], anchor);
  menu(title(r), [
    {icon:'ph-notebook', label:'open', run:()=>openRow(id)},
    {icon:'ph-pencil-simple-line', label:'rename', k:mqFine.matches?'F2':'', run:()=>renameSheet(id)},
    {icon:r.pinned?'ph-push-pin-slash':'ph-push-pin', label:r.pinned?'unpin':'pin to top', run:()=>pin([id], !r.pinned)},
    {icon:'ph-folder-simple', label:r.folder?'move to another folder':'move to folder', run:()=>moveSheet([id])},
    {icon:'ph-copy', label:'duplicate', run:()=>duplicate(id)},
    {icon:'ph-file-arrow-down', label:'export', k:'json', run:()=>exportNotes([id])},
    {icon:'ph-check-circle', label:'select', run:()=>startSelect(id)},
    '-',
    {icon:'ph-trash', label:'move to trash', k:mqFine.matches?'del':'', danger:true, run:()=>trash([id])},
  ], anchor);
}
$('#lib-menu').onclick = e=>{
  const by = prefs().sort || 'updated', mark = v=>by === v ? 'ph-check' : 'ph-circle';
  const sortBy = v=>{ setPref('sort', v); if(L.query) runSearch(L.query); else paint(); };
  const folder = L.view.startsWith('f:') ? L.view.slice(2) : '';
  menu('notes', [
    {icon:mark('updated'), label:'sort by last edited', run:()=>sortBy('updated')},
    {icon:mark('created'), label:'sort by date created', run:()=>sortBy('created')},
    {icon:mark('name'), label:'sort by name', run:()=>sortBy('name')},
    '-',
    L.rows.length && {icon:'ph-list-checks', label:'select notes', run:()=>startSelect(null)},
    folder && {icon:'ph-pencil-simple-line', label:'rename this folder', run:()=>renameFolderSheet(folder)},
    folder && {icon:'ph-folder-simple', label:'remove this folder', run:()=>removeFolderSheet(folder)},
    L.view === 'trash' && L.rows.length && {icon:'ph-trash', label:'empty trash', danger:true, run:()=>purgeSheet(L.rows.map(r=>r.id))},
    {icon:'ph-download-simple', label:'back up all notes', k:'json', run:()=>exportNotes(L.ix.filter(r=>!r.trashed).map(r=>r.id), true)},
    {icon:'ph-upload-simple', label:'import notes', k:'json', run:importPick},
  ], e.currentTarget);
};

/* ---- sheets for the choices that need a word or a confirmation ---- */
function formSheet(titleText, label, value, cta, done){
  const box = N.ui.openSheet('<h2>'+esc(titleText)+'</h2>' +
    '<form class="lib-form"><input class="keyin" aria-label="'+esc(label)+'" placeholder="'+esc(label)+'" value="'+esc(value)+'" autocomplete="off" enterkeyhint="done" maxlength="120">' +
    '<div class="sheet-act"><button class="sheet-cta" type="submit">'+esc(cta)+'</button></div></form>', {fit:true});
  const input = box.querySelector('input');
  box.querySelector('form').onsubmit = e=>{ e.preventDefault(); const v = input.value.trim(); N.ui.closeSheet(); done(v); };
  setTimeout(()=>{ input.focus(); input.select(); }, 30);
}
function confirmSheet(titleText, text, cta, done){
  const box = N.ui.openSheet('<h2>'+esc(titleText)+'</h2><p class="lib-confirm">'+esc(text)+'</p>' +
    '<div class="sheet-act"><button class="lib-cancel" type="button">cancel</button><button class="sheet-cta danger" type="button">'+esc(cta)+'</button></div>', {fit:true});
  box.querySelector('.lib-cancel').onclick = ()=>N.ui.closeSheet();
  box.querySelector('.sheet-cta').onclick = ()=>{ N.ui.closeSheet(); done(); };
}
function renameSheet(id){
  const r = L.ix.find(x=>x.id===id); if(!r) return;
  formSheet('rename note', 'note name', r.title && r.title !== 'untitled' ? r.title : '', 'rename', v=>rename(id, v || 'untitled'));
}
function newFolderSheet(then){
  formSheet('new folder', 'folder name', '', 'create', async v=>{
    const f = cleanFolder(v); if(!f) return;
    await saveFolders([...L.folders, f]);
    if(then) await then(f); else { L.view = 'f:'+f; }
    await refresh(); broadcast();
  });
}
function moveSheet(ids){
  const one = ids.length === 1 ? L.ix.find(r=>r.id===ids[0]) : null, cur = one ? one.folder||'' : null;
  const opt = (f, label, icon)=>'<button type="button" class="mi" data-f="'+esc(f)+'"'+(cur===f?' aria-current="true"':'')+'><i class="ph '+icon+'"></i>'+esc(label)+(cur===f?'<span class="k">here now</span>':'')+'</button>';
  const box = N.ui.openSheet('<h2>'+(ids.length > 1 ? 'move '+ids.length+' notes' : 'move to folder')+'</h2>' +
    opt('', 'no folder', 'ph-notebook') + L.folders.map(f=>opt(f, f, 'ph-folder-simple')).join('') +
    '<button type="button" class="mi" data-new="1"><i class="ph ph-folder-simple-plus"></i>new folder</button>', {fit:true});
  box.querySelectorAll('[data-f]').forEach(b=>b.onclick = ()=>{ N.ui.closeSheet(); move(ids, b.dataset.f); });
  box.querySelector('[data-new]').onclick = ()=>newFolderSheet(f=>move(ids, f, true));
}
function renameFolderSheet(old){
  formSheet('rename folder', 'folder name', old, 'rename', async v=>{
    const f = cleanFolder(v); if(!f || f === old) return;
    const ids = L.ix.filter(r=>r.folder===old).map(r=>r.id);
    await C.patchIndexRows(ids, ()=>({folder:f}));
    await saveFolders(L.folders.map(x=>x===old ? f : x));
    L.view = 'f:'+f; await refresh();
  });
}
function removeFolderSheet(f){
  confirmSheet('remove folder', 'remove "'+f+'"? the notes in it stay, in all notes.', 'remove', async ()=>{
    const ids = L.ix.filter(r=>r.folder===f).map(r=>r.id);
    await C.patchIndexRows(ids, ()=>({folder:undefined}));
    await saveFolders(L.folders.filter(x=>x!==f));
    L.view = 'all'; await refresh();
  });
}
function purgeSheet(ids){
  confirmSheet(ids.length > 1 ? 'delete '+ids.length+' notes' : 'delete note',
    (ids.length > 1 ? 'these notes' : 'this note')+' will be gone for good. this cannot be undone.', 'delete forever', async ()=>{
      let failed = 0;
      for(const id of ids) if(!await C.deleteStoredNote(id)) failed++;
      ids.forEach(id=>{ thumbs.delete(id); L.docs.delete(id); });
      endSelect(); await refresh();
      if(failed) C.toast('could not delete '+failed+' of those notes.');
    });
}

/* ---- the edits themselves ---- */
function broadcast(){ try{ chan && chan.postMessage({index:true}); }catch(e){} }
async function move(ids, folder, fresh){
  await C.patchIndexRows(ids, ()=>({folder:folder || undefined}));
  if(folder && !L.folders.includes(folder)) await saveFolders([...L.folders, folder]);
  endSelect(); await refresh();
  C.toast(ids.length > 1 ? 'moved '+ids.length+' notes'+(folder ? ' to '+folder : ' out of their folders')+'.' : (folder ? 'moved to '+folder+'.' : 'moved out of its folder.'));
}
async function pin(ids, on){
  await C.patchIndexRows(ids, ()=>({pinned:on ? true : undefined}));
  await refresh();
}
async function rename(id, name){
  if(id === S.id){
    S.title = name; C.markDirty(); N.ui.refreshTitle(); await C.save();
  } else {
    const ok = await C.withNoteLock(id, async()=>{
      const doc = await C.Store.get('notas.note.'+id); if(!doc) return false;
      doc.title = name; doc.rev = (doc.rev||0) + 1;
      if(!await C.Store.set('notas.note.'+id, doc)) return false;
      const ix = await C.Store.index(), at = ix.findIndex(r=>r.id===id);
      if(at >= 0){ ix[at] = {...ix[at], title:name}; await C.Store.putIndex(ix); }
      chan && chan.postMessage({id, rev:doc.rev});
      return true;
    });
    if(!ok) C.toast('could not rename that note.');
    L.docs.delete(id);
  }
  await refresh();
}
async function trash(ids){
  ids = ids.filter(id=>L.ix.some(r=>r.id===id && !r.trashed));
  if(!ids.length) return;
  if(ids.includes(S.id)) await C.save();
  const now = Date.now();
  if(!await C.patchIndexRows(ids, ()=>({trashed:now}))) C.toast('could not move that to the trash.');
  endSelect();
  /* the open note went to the trash: the page moves on to the next note */
  if(ids.includes(S.id)){
    const next = (await C.Store.index()).filter(r=>!r.trashed && !ids.includes(r.id)).sort((a,b)=>(b.updated||0)-(a.updated||0))[0];
    if(next) await N.ui.openNote(next.id); else await N.ui.newNote();
  }
  await refresh();
  offerUndo(ids.length > 1 ? ids.length+' notes moved to the trash.' : 'moved to the trash.', async()=>{
    await C.patchIndexRows(ids, ()=>({trashed:undefined})); await refresh();
  });
}
async function restore(ids){
  await C.patchIndexRows(ids, ()=>({trashed:undefined}));
  endSelect(); await refresh();
  C.toast(ids.length > 1 ? 'restored '+ids.length+' notes.' : 'restored.');
}
async function duplicate(id){
  if(id === S.id) await C.save();
  const doc = id === S.id ? C.serialize() : await C.Store.get('notas.note.'+id);
  const row = L.ix.find(r=>r.id===id);
  if(!doc) return C.toast('could not copy that note.');
  const nid = C.uid(), now = Date.now();
  const copy = {...JSON.parse(JSON.stringify(doc)), id:nid, title:C.displayTitle(doc.title, doc.lines)+' copy', created:now, updated:now, rev:1};
  const ok = await C.withNoteLock(nid, async()=>{
    if(!await C.Store.set('notas.note.'+nid, copy)) return false;
    const ix = await C.Store.index(), at = ix.findIndex(r=>r.id===id);
    const fresh = {id:nid, title:copy.title, updated:now, created:now, preview:C.firstLine(copy.lines), ...(row && row.folder ? {folder:row.folder} : {})};
    ix.splice(at < 0 ? 0 : at, 0, fresh);
    return await C.Store.putIndex(ix);
  });
  if(!ok) return C.toast('could not copy that note.');
  const t = await thumbOf(id); if(t) await storeThumb(nid, {...t, at:now});
  broadcast(); await refresh();
  C.toast('copied.');
}
/* one note is the same file export always made; several (or a backup) are one
   bundle that import unpacks back into the library, folders and all */
async function exportNotes(ids, backup){
  if(ids.includes(S.id)) await C.save();
  const docs = [];
  for(const id of ids){
    const doc = id === S.id ? C.serialize() : await C.Store.get('notas.note.'+id);
    const row = L.ix.find(r=>r.id===id);
    if(doc) docs.push(row && row.folder ? {...doc, folder:row.folder} : doc);
  }
  if(!docs.length) return C.toast('nothing to export.');
  const day = new Date().toISOString().slice(0,10);
  let name, body;
  if(docs.length === 1 && !backup){ name = (C.displayTitle(docs[0].title, docs[0].lines)||'notas')+'.notas.json'; body = docs[0]; }
  else { name = (backup ? 'notas backup ' : 'notas '+docs.length+' notes ')+day+'.notas.json'; body = {notasBundle:1, exported:new Date().toISOString(), notes:docs}; }
  const blob = new Blob([JSON.stringify(body, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  N.ui.download(name.replace(/[\\/:*?"<>|]+/g,' '), url);
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  endSelect();
}
function importPick(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,.notas.json,application/json'; input.multiple = true; input.hidden = true;
  input.onchange = async()=>{
    const files = [...(input.files||[])]; input.remove();
    const notes = [];
    for(const f of files){
      try{
        if(f.size > 200*1024*1024) throw new Error('too large');
        const raw = JSON.parse(await f.text());
        if(raw && raw.notasBundle && Array.isArray(raw.notes)) notes.push(...raw.notes); else notes.push(raw);
      }catch(e){ C.toast('could not read '+f.name+'.', 5000); }
    }
    if(notes.length) await importBundle({notasBundle:1, notes}, L.view.startsWith('f:') ? L.view.slice(2) : '');
  };
  document.body.appendChild(input); input.click();
}
async function importBundle(raw, intoFolder){
  const rows = [], folders = new Set();
  let bad = 0;
  for(const note of raw.notes){
    try{
      const v = N.ui.validateImportedNote(note);
      const id = C.uid(), now = Date.now();
      const created = Number.isFinite(Number(note.created)) && note.created > 0 ? Number(note.created) : now;
      const updated = Number.isFinite(Number(note.updated)) && note.updated > 0 ? Math.min(now, Number(note.updated)) : now;
      if(!v.lines.length) v.lines.push({id:C.uid(), y:120, text:'', h:C.LINE_H});
      const doc = {id, title:v.title.trim()||'untitled', created, updated, rev:1, settings:v.settings, docH:v.docH, view:{scrollTop:0, scrollLeft:0},
        strokes:v.strokes, lines:v.lines, images:v.images, localVersion:2, answers:v.answers, transcripts:v.transcripts, textTranscripts:v.textTranscripts};
      if(!await C.Store.set('notas.note.'+id, doc)){ bad++; continue; }
      const folder = cleanFolder(intoFolder || note.folder);
      if(folder) folders.add(folder);
      rows.push({id, title:doc.title, updated, created, preview:C.firstLine(doc.lines), ...(folder ? {folder} : {})});
    }catch(e){ bad++; }
  }
  if(rows.length){
    const ix = await C.Store.index();
    await C.Store.putIndex([...rows, ...ix]);
    if(folders.size) await saveFolders([...(await C.Store.get('notas.folders')||[]), ...folders]);
    broadcast();
  }
  if(L.open) await refresh();
  C.toast(rows.length ? 'imported '+rows.length+' note'+(rows.length>1?'s':'')+(bad ? ', '+bad+' could not be read.' : '.') : 'no notes could be imported from that file.', 6000);
  return rows.length > 0;
}

/* ---- undo for the trash: a moment to take it back ---- */
let undoTimer = null;
function offerUndo(text, undo){
  undoBar.querySelector('span').textContent = text;
  undoBar.hidden = false; void undoBar.offsetWidth; undoBar.classList.add('in');
  const b = undoBar.querySelector('button');
  b.onclick = async()=>{ hideUndo(); await undo(); };
  clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 7000);
}
C.swipeAway(undoBar, ()=>hideUndo(), on=>{ clearTimeout(undoTimer); if(!on && undoBar.classList.contains('in')) undoTimer = setTimeout(hideUndo, 2500); });
function hideUndo(){ clearTimeout(undoTimer); undoBar.classList.remove('in'); setTimeout(()=>{ if(!undoBar.classList.contains('in')) undoBar.hidden = true; }, 240); }

/* ---- other tabs, and this tab's own saves ---- */
const chan = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('notas-sync-v1') : null;
let refreshTimer = null;
if(chan) chan.onmessage = e=>{
  const m = e.data || {};
  if(m.id){ L.docs.delete(m.id); if(m.deleted) thumbs.delete(m.id); }
  if(m.id && m.id === S.id && !m.deleted){
    L.lastEdit = Date.now();
    /* the docked list is on screen while you write: its picture of this note
       catches up every half minute, in an idle moment */
    if(L.open && Date.now() - (lastThumb.get(S.id)||0) > THUMB_EVERY){
      lastThumb.set(S.id, Date.now());
      (window.requestIdleCallback||setTimeout)(()=>pictureCurrent(), {timeout:2000});
    }
  }
  if(!L.open) return;
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(()=>{ if(!swipe && !pop) refresh(); }, 250);
};

/* a docked sidebar left open last time is open again, once the first note is */
function boot(){ if(shape() === 'dock' && prefs().docked) open(); }
/* another note is on the page: the list says which */
function changed(){ if(L.open){ markCurrent(); refresh(); } }

N.library = { open, close, toggle, refresh, leaving, changed, boot, importBundle, renderThumb,
              get isOpen(){ return L.open; }, get mode(){ return L.open ? el.dataset.mode : ''; },
              get modal(){ return L.open && el.dataset.mode !== 'dock'; } };
})();
</script>

<script>
/* =========================================================================
   TUTORIAL - a coach's card beside the line it is about.
   Never modal, never dims the page, always skippable. The card lives inside
   the column so it scrolls and zooms with the paper; a red mark in the
   gutter shows which line to write on, and the card moves on as each step
   is done.
   ========================================================================= */
(function(){
'use strict';
const C = N.core, S = C.S, M = C.M, $ = C.$;
/* tags left on the ink layer by the older red-pen tutorial; still cleared */
const TAG = 'tutorial', TICK = 'tutorial-tick';
let on = false, step = 0, total = 2, startStrokes = 0, idle = null, idleHint = false;
/* what the note already said when the lesson began: only maths written since
   then counts, so a note that already holds answers cannot finish the lesson
   before the student has typed a thing */
let before = new Map();
function fresh(n){ return n.kind === 'cluster' ? !before.has(n.id) : before.get(n.id) !== n.src; }
let card = null, mark = null, anchor = { y:120, h:C.LINE_H }, watch = null;

function done(){ try{ return localStorage.getItem('notas.tut') === 'done'; }catch(e){ return false; } }
function setDone(){ try{ localStorage.setItem('notas.tut','done'); }catch(e){} }
function clearInk(){
  const n = S.annos.length;
  S.annos = S.annos.filter(a=> a.tag !== TAG && a.tag !== TICK);
  if(S.annos.length !== n) N.ink.renderAI();
}

const STEPS = [
  { say:'type this on the line', code:'12 x 7',
    a11y:'type 12 x 7 on the first line. if you write it with the pen instead, finish with an equals sign for the answer.' },
  { say:'name a value, then use it below', code:'pens = 3\npens x 4',
    a11y:'type pens equals 3, then on the line below type pens times 4.' },
  { say:'stuck on a step? ask for a hint with the button at the bottom right.', code:'',
    a11y:'if you are stuck, open the hint helper at the bottom right.' }
];

/* ---- the card ---- */
function build(){
  if(card) return;
  const col = $('#col');
  mark = document.createElement('div');
  mark.className = 'tut-mark'; mark.setAttribute('aria-hidden','true');
  card = document.createElement('div');
  card.className = 'tut';
  card.innerHTML =
    '<p class="tut-say"></p>' +
    '<pre class="tut-do"></pre>' +
    '<p class="tut-hint"></p>' +
    '<div class="tut-foot">' +
      '<div class="tut-steps" aria-hidden="true"></div>' +
      '<span class="tut-ok" aria-hidden="true"><i class="ph ph-check"></i><span class="fb">&#10003;</span></span>' +
      '<button class="tut-skip" type="button">skip</button>' +
    '</div>';
  card.querySelector('.tut-skip').onclick = ()=>finish(false);
  col.appendChild(mark); col.appendChild(card);
}
function tear(){
  clearTimeout(idle);
  if(watch){ watch.disconnect(); watch = null; }
  window.removeEventListener('resize', place);
  if(card){ card.remove(); card = null; }
  if(mark){ mark.remove(); mark = null; }
}
function hide(){
  if(!card) return;
  card.classList.add('leave'); mark.classList.add('leave');
  setTimeout(tear, 220);
}

/* where the step happens, in column coordinates */
function spot(){
  const ls = S.lines.slice().sort((a,b)=>a.y-b.y);
  if(step < 2){
    /* the next free line: the slot after the last written line, or an empty
       line already waiting there */
    const last = ls[ls.length-1], h = step === 0 ? C.LINE_H : C.LINE_H*2;
    if(!last) return { y:120, h };
    const y = last.text ? last.y + Math.max(C.LINE_H, last.h||C.LINE_H) : last.y;
    return { y, h };
  }
  const sc = $('#scroller');
  return { y: Math.max(120, (sc.scrollTop + M.vh)/M.zoom - 170), h:0 };
}
/* under the marked line, aligned with the text, so mark and card read as one */
function place(){
  if(!card) return;
  const t = anchor;
  if(t.h){
    mark.hidden = false;
    mark.style.left = (M.colLeft > 24 ? -14 : -8)+'px';
    mark.style.top = (t.y + 5)+'px';
    mark.style.height = (t.h - 10)+'px';
  } else mark.hidden = true;
  card.style.left = '0px';
  card.style.top = (t.y + (t.h || 0) + 12)+'px';
}
function hintFor(){
  const touch = matchMedia('(pointer:coarse)').matches;
  const typeIt = touch ? 'tap T in the toolbar' : 'press T';
  const typing = document.body.dataset.tool === 'text';
  const drew = S.strokes.length > startStrokes;
  if(step === 0 && !typing && !drew) return typeIt+' to type, or write it with the pen.';
  if(step === 0 && drew && !N.ai.enabled()) return 'check the reading, or '+typeIt+' to type.';
  if(idleHint) return 'no rush. skip whenever you like.';
  return '';
}
function render(st){
  const steps = card.querySelector('.tut-steps');
  steps.innerHTML = Array.from({length:total}, (_,i)=>'<i'+(i < step ? ' class="on"' : '')+'></i>').join('');
  card.querySelector('.tut-say').textContent = st.say;
  card.querySelector('.tut-do').textContent = st.code || '';
  card.querySelector('.tut-hint').textContent = hintFor();
  card.classList.remove('done');
}
function refreshHint(){ if(card && on) card.querySelector('.tut-hint').textContent = hintFor(); }

function start(force){
  if(done() && !force) return;
  tear();
  on = true; step = 0; idleHint = false;
  startStrokes = S.strokes.length;
  /* read from the lines and ink directly: the maths may not have run yet */
  before = new Map();
  for(const ln of S.lines) before.set(ln.id, ln.text);
  for(const cl of S.clusters) before.set(cl.id, true);
  const dot = $('#ask-dot');
  total = (dot && !dot.hidden) ? 3 : 2;
  clearInk(); build();
  /* the hint follows the tool in hand, so it says "press T" only while that is true */
  watch = new MutationObserver(refreshHint);
  watch.observe(document.body, { attributes:true, attributeFilter:['data-tool'] });
  window.addEventListener('resize', place);
  draw();
}
function maybeStart(){ if(!done()) start(false); }

function draw(){
  if(!card) return;
  const st = STEPS[step];
  anchor = spot();
  render(st); place();
  const a11y = $('#tutorial-text');
  if(a11y) a11y.textContent = 'tutorial step '+(step+1)+' of '+total+'. '+st.a11y;
  /* the bar may already be open, and then the step is done the moment it appears */
  if(step === 2 && !$('#askbar').hidden) setTimeout(()=>check('ask'), 500);
  armIdle();
}
function armIdle(){
  clearTimeout(idle); idleHint = false;
  idle = setTimeout(()=>{ if(!on) return; idleHint = true; refreshHint(); }, 15000);
}
/* fade out, change, fade back in the new place */
function swap(fn){
  if(!card) return fn();
  card.classList.add('leave');
  setTimeout(()=>{ if(!card) return; fn(); card.classList.remove('leave'); }, 200);
}
function advance(){
  clearTimeout(idle);
  step++;
  if(card){
    card.classList.add('done');
    const seg = card.querySelector('.tut-steps').children[step-1];
    if(seg) seg.classList.add('on');
    card.querySelector('.tut-hint').textContent = '';
  }
  const a11y = $('#tutorial-text');
  if(a11y) a11y.textContent = 'step done.';
  setTimeout(()=>{
    if(!on) return;
    if(step >= total) return finish(true);
    swap(draw);
  }, 750);
}

function usesEarlier(){
  const ns = (S.nodes || []).filter(n=>n.src && n.src.trim());
  for(let i=0;i<ns.length;i++){
    const p = ns[i].provides; if(!p) continue;
    for(let j=i+1;j<ns.length;j++){
      if(!fresh(ns[j])) continue;
      const vars = N.mathcore.freeVars(N.mathcore.normalize(ns[j].src));
      if(vars.includes(p)) return [ns[i], ns[j]];
    }
  }
  return null;
}
function check(kind){
  if(!on) return;
  if(step === 0){
    /* ignored the tutorial and just started working: retire quietly */
    if(S.strokes.length - startStrokes > 10) return finish(false);
    refreshHint();
    if((S.nodes || []).find(n=>n.result && !n.error && fresh(n))) advance();
    return;
  }
  if(step === 1){
    if(usesEarlier()) advance();
    return;
  }
  if(step === 2 && kind === 'ask') advance();
}
function finish(complete){
  clearTimeout(idle);
  const a11y = $('#tutorial-text'); if(a11y) a11y.textContent = complete ? 'tutorial complete.' : '';
  if(!on){ tear(); return; }
  on = false; setDone(); clearInk();
  if(complete && card){
    /* the card ends where it stands: every segment on, one closing line, then it goes */
    swap(()=>{
      render({ say:'that is the whole idea. write maths, and the answer follows. more is in the menu, top right.', code:'' });
      card.classList.add('done');
      for(const i of card.querySelectorAll('.tut-steps i')) i.classList.add('on');
      mark.classList.add('leave');
    });
    setTimeout(hide, 2400);
  } else hide();
}

N.tutorial = { start, maybeStart, check, finish, get running(){ return on; } };
})();
</script>

<script>
/* =========================================================================
   SELF TEST - ?selftest=1 runs the parser, the variable order and the solver
   ========================================================================= */
(function(){
'use strict';
function run(){
  const C = N.core, S = C.S;
  const out = [];
  const ok = (name, cond, got) => out.push({name, pass:!!cond, got});
  const mc = N.mathcore;
  mc.harden();

  const ev = (src, scope) => { try{ return mc.fmt(mc.evalRaw(mc.normalize(src), scope || mc.baseScope())); }catch(e){ return 'ERR '+e.message; } };

  ok('arithmetic', ev('2+2') === '4', ev('2+2'));
  ok('no float dust', ev('0.1+0.2') === '0.3', ev('0.1+0.2'));
  ok('typed x means times', mc.normalize('12 x 7') === '12*7', mc.normalize('12 x 7'));
  ok('x means times after a name', mc.normalize('pens x 4') === 'pens*4', mc.normalize('pens x 4'));
  ok('x stays a variable', mc.normalize('2*x + 1') === '2*x + 1', mc.normalize('2*x + 1'));
  ok('x stays a variable before a bracket', mc.normalize('3 x (x+2)') === '3 x (x+2)', mc.normalize('3 x (x+2)'));
  ok('x stays a variable when assigned', mc.normalize('x = 5') === 'x = 5', mc.normalize('x = 5'));
  ok('latex fraction', mc.latexToMath('\\frac{3}{4}') === '((3)/(4))', mc.latexToMath('\\frac{3}{4}'));
  ok('latex sqrt', mc.latexToMath('\\sqrt{9}') === 'sqrt((9))', mc.latexToMath('\\sqrt{9}'));
  ok('latex times', ev('12 \\times 7') === '84', ev('12 \\times 7'));

  S.settings.angle = 'deg';
  ok('degrees', Math.abs(Number(mc.evalRaw('sin(30)', mc.baseScope())) - 0.5) < 1e-9, ev('sin(30)'));
  S.settings.angle = 'rad';
  ok('radians', Math.abs(Number(mc.evalRaw('sin(pi/2)', mc.baseScope())) - 1) < 1e-9, ev('sin(pi/2)'));
  S.settings.angle = 'deg';

  ok('units survive a unit that shares a function name', /km/.test(ev('3 km / 20 min')) && !/ERR/.test(ev('3 km / 20 min')), ev('3 km / 20 min'));
  ok('units add', ev('5 cm + 3 cm') === '8 cm', ev('5 cm + 3 cm'));

  const sp = mc.baseScope();
  mc.evalRaw('pens = 3', sp);
  ok('variables carry down', mc.fmt(mc.evalRaw('pens * 4', sp)) === '12', mc.fmt(mc.evalRaw('pens*4', sp)));

  ok('free variables', mc.freeVars('k*x^2 + c').sort().join(',') === 'c,k,x', mc.freeVars('k*x^2 + c').sort().join(','));
  ok('function names are not graph parameters', mc.freeVars('sin(x)').join(',') === 'x', mc.freeVars('sin(x)').join(','));
  ok('prose is left alone', mc.looksLikeMath('remember to revise chapter four') === false, '');
  ok('math is detected', mc.looksLikeMath('3x + 1 = 10') === true, '');
  ok('names only expression is maths', mc.looksLikeMath('y * x') === true, '');
  const sp2 = mc.baseScope();
  mc.evalRaw('x = 6', sp2); mc.evalRaw('y = 92', sp2);
  ok('names only expression evaluates', mc.fmt(mc.evalRaw(mc.normalize('y * x'), sp2)) === '552',
     mc.fmt(mc.evalRaw(mc.normalize('y * x'), sp2)));

  const badStep = N.tutor.verifyPair('2x + 4 = 10', '2x = 8');
  const goodStep = N.tutor.verifyPair('2x + 4 = 10', '2x = 6');
  ok('step check catches a wrong step', badStep === false, String(badStep));
  ok('step check accepts a right step', goodStep === true, String(goodStep));

  const set = new Set(['10,10']);
  const spot = N.tutor.findSpace(set, 32, 32, [100,100,160,130]);
  ok('placement returns a free spot', Array.isArray(spot) && spot.length === 4, JSON.stringify(spot));

  ok('Unicode search keeps CJK', N.ui.searchText('東京 ノート') === '東京 ノート', N.ui.searchText('東京 ノート'));
  ok('single character search works', !!N.ui.searchHit({title:'猫',lines:[],textTranscripts:[],transcripts:[]},'猫'), '猫');
  ok('space-less fuzzy search tolerates one character', !!N.ui.fuzzyHandwriting('東京','東景'), '東京 / 東景');
  ok('OCR confidence gate accepts Han above threshold', N.recog.validText('東京',.9) === true, String(N.recog.textConfidenceMin));
  ok('OCR confidence gate rejects low confidence', N.recog.validText('hello',.4) === false, String(N.recog.textConfidenceMin));

  const doc = document.createElement('div');
  doc.id = 'selftest';
  const pass = out.filter(o=>o.pass).length;
  doc.innerHTML = '<h2 style="font:600 20px var(--ui)">self test</h2>' +
    '<p style="font:400 14px var(--ui)">' + pass + ' of ' + out.length + ' passed.</p>' +
    out.map(o=>'<div class="'+(o.pass?'p':'f')+'">'+(o.pass?'pass  ':'FAIL  ')+o.name+
      (o.pass?'':'   got: '+String(o.got))+'</div>').join('') +
    '<p style="font:400 14px var(--ui);margin-top:16px"><a href="?" style="color:var(--blue)">back to notas</a></p>';
  document.body.innerHTML = '';
  document.body.appendChild(doc);
}
N.selftest = { run };
})();
</script>

<script>
/* =========================================================================
   BOOT - load libraries (cached in IndexedDB so a second visit works offline)
   ========================================================================= */
(function(){
'use strict';
const C = N.core;
/* The notebook needs four libraries to open. The computer algebra system is
   four more and over a megabyte; it loads in the background and is only
   waited for by the first line that needs it. */
const CORE_LIBS=['idb','math','katex','rough'], CAS_LIBS=['nerdamer','algebra','calculus','solve'];
const preparing=document.getElementById('preparing');
let appReady=false;
let casLoad=null;
function loadCAS(){
  if(!casLoad){
    N.downloads&&N.downloads.set('cas','loading');
    casLoad=(async()=>{
      /* the add-ons register themselves on the core, so these stay in order */
      for(const name of CAS_LIBS) if(!await loadLib(name)) return false;
      return true;
    })().then(ok=>{
      if(ok)N.downloads&&N.downloads.set('cas','ready');
      else{ casLoad=null; N.downloads&&N.downloads.set('cas','error','',loadCAS); }
      return ok;
    });
  }
  return casLoad;
}
N.boot={loadLib,loadCAS};

function finishPreparing(){
  if(!preparing||preparing.classList.contains('done'))return;
  preparing.classList.add('done');
  const remove=()=>{if(preparing.classList.contains('done'))preparing.hidden=true;};
  preparing.addEventListener('transitionend',remove,{once:true});
  setTimeout(remove,320);
}
/* The notebook opens as soon as it can be written in. The handwriting
   reader used to hold this screen until it had finished setting up, which on
   a first visit meant an 89 MB download, and on every visit meant loading
   that model before a single line could be written. Its progress and retry
   control live on the status line at the bottom instead. */
/* The readers download behind the page from the first visit: the launch
   screen used to hold until the stroke reader had arrived, and now lets go
   as soon as the note is open. The downloads button in the bar carries the
   progress instead. */
function beginLaunchReading(){
  if(C.S.settings.aiOn===false)return Promise.resolve();
  return N.ai.setup();
}
function loadLib(name){
  return new Promise(resolve=>{
    const script=document.createElement('script');
    script.src='./assets/'+name+'.js';
    script.onload=()=>resolve(true);script.onerror=()=>resolve(false);
    document.head.appendChild(script);
  });
}
async function prepareOffline(){
  const el=document.getElementById('offline-status');
  const tell=(phase,detail)=>N.downloads&&N.downloads.set('offline',phase,detail,prepareOffline);
  if(!('serviceWorker' in navigator)||!window.isSecureContext){el.textContent='offline setup needs https or localhost.';tell('unavailable','needs https or localhost.');return;}
  /* the pill stays down while this works; it only stands up to offer a retry */
  el.textContent='preparing offline access.';el.disabled=true;tell('preparing');
  const failed=()=>{el.textContent='offline setup interrupted, retry.';el.disabled=false;tell('error','interrupted. connect, then retry.');};
  const done=()=>{el.textContent='available offline.';el.disabled=true;tell('ready');};
  try{
    const registration=await navigator.serviceWorker.register('./sw.js');
    const worker=registration.installing||registration.waiting||registration.active;
    if(worker?.state==='activated'){done();return;}
    if(worker)worker.addEventListener('statechange',()=>{
      if(worker.state==='activated')done();
      if(worker.state==='redundant')failed();
    });
  }catch{failed();}
}
async function boot(){
  await Promise.all(CORE_LIBS.map(loadLib));

  if(!window.math){
    C.toast('the maths engine could not load. connect once, then it works offline.', 9000);
  }
  N.mathcore.harden();
  N.ui.checkIcons();

  if(/[?&]selftest=1/.test(location.search)){ N.selftest.run(); return; }

  C.layout();
  if(!(N.collab && await N.collab.openLink())){
    const ix = (await C.Store.index()).filter(r=>!r.trashed).sort((a,b)=>(b.updated||0)-(a.updated||0));
    const active=C.getActive();
    const target=(active&&ix.find(r=>r.id===active))||ix[0];
    if(target&&target.id) await N.ui.openNote(target.id);
    else await N.ui.newNote();
  }
  N.library && N.library.boot();

  N.ui.applyTheme();
  if(!N.tutor.hasVoice) document.getElementById('ask-mic').hidden = true;
  document.getElementById('ask-spk').setAttribute('aria-pressed', String(C.S.settings.voice));
  N.ink.setTool('text');
  N.tutorial.maybeStart();
  N.ai.toggle();
  const offline=document.getElementById('offline-status');offline.onclick=prepareOffline;
  const launchReading=beginLaunchReading();
  appReady=true;
  finishPreparing();
  /* The stroke reader is the largest first-run transfer. Avoid competing with
     it for bandwidth and memory on a tablet; offline setup begins as soon as
     it settles. The algebra system is small enough to fetch
     in the first quiet moment so the first solve rarely has to wait. */
  launchReading.catch(()=>{}).finally(prepareOffline);
  /* the text reader used to wait for the first handwriting; it is fetched
     in the same quiet moment now, so search is ready before it is needed */
  launchReading.catch(()=>{}).finally(()=>{ if(N.ai.enabled()&&N.ai.setupText)(window.requestIdleCallback||setTimeout)(()=>{ N.ai.setupText().catch(()=>{}); }); });
  if(window.requestIdleCallback) requestIdleCallback(()=>loadCAS(),{timeout:4000}); else setTimeout(()=>loadCAS(),1500);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
