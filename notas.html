html.library-transition::view-transition-group(notebook){animation-duration:.62s;animation-timing-function:cubic-bezier(.22,1,.36,1);z-index:2}
/* Capture the completed library layout. Capturing its separate entrance
   fade halfway through leaves a translucent snapshot that jumps at the end. */
html.library-transition #library[data-mode="overview"] .lib-panel{transition:none}
html.library-transition::view-transition-old(notebook),
html.library-transition::view-transition-new(notebook){
  height:100%;object-fit:contain;animation-duration:.62s;animation-timing-function:cubic-bezier(.4,0,.2,1);
  animation-fill-mode:both;mix-blend-mode:normal;
}
/* Keep the departing ink visible as it moves, then blend into the preview.
   The surrounding scene fades too, rather than switching at the first frame. */
html.library-transition::view-transition-old(notebook){animation-name:notebook-fade-out}
html.library-transition::view-transition-new(notebook){animation-name:notebook-fade-in}
html.library-transition::view-transition-old(root){animation:library-scene-out .62s cubic-bezier(.4,0,.2,1) both}
html.library-transition::view-transition-new(root){animation:library-scene-in .62s cubic-bezier(.4,0,.2,1) both}
@keyframes notebook-fade-out{0%,30%{opacity:1}100%{opacity:0}}
@keyframes notebook-fade-in{0%,30%{opacity:0}100%{opacity:1}}
@keyframes library-scene-out{from{opacity:1}to{opacity:0}}
@keyframes library-scene-in{from{opacity:0}to{opacity:1}}
/* Opening a card animates the freshly rendered, complete notebook snapshot
   from that card's bounds. The thumbnail bitmap never becomes full screen. */
html.library-transition.library-expand::view-transition-old(root){animation-duration:.3s}
html.library-transition.library-expand::view-transition-new(root){
  transform-origin:0 0;animation:real-note-expand .62s cubic-bezier(.22,1,.36,1) both;
  opacity:1;mix-blend-mode:normal;
}
@keyframes real-note-expand{
  from{
    transform:translate(var(--note-from-x),var(--note-from-y)) scale(var(--note-from-sx),var(--note-from-sy));
    border-radius:18px;box-shadow:0 8px 40px rgba(28,28,30,.10);
  }
  to{transform:translate(0,0) scale(1,1);border-radius:0;box-shadow:none}
}

#quick-maths{display:flex;align-items:center;flex:1 1 auto;min-width:110px;position:relative;margin:0 12px}
#quick-expression{width:100%;min-width:0;flex:1;border:0;background:var(--tint);border-radius:var(--r-pill);padding:9px 14px;font:400 15px var(--mono);outline:none}

<script>
/* Namespace and error guard. Each subsystem below lives in its own script tag
   so that a syntax error in one cannot take the whole app down. */
window.N = { ready:{}, libs:{} };
/* This banner had no timer, so the one thing every user saw after any error
   was a permanent "Something broke" that nothing could dismiss - including for
   failures the app had already recovered from by itself. It now clears like
   every other message, and says what actually went wrong. */
var brokeTimer = null;
window.addEventListener('error', function(e){
  try{
    var t = document.getElementById('toast');
    var why = (e && e.message) ? String(e.message).replace(/^Uncaught\s+/,'') : '';
    t.textContent = why
      ? 'something broke, ' + why + '. your notes are safe.'
      : 'something broke. your notes are safe, export them from the menu.';
    t.classList.add('in');
    clearTimeout(brokeTimer);
    brokeTimer = setTimeout(function(){ t.classList.remove('in'); }, 8000);
  }catch(_){}
  console.error(e.error || e.message);
});
</script>

<script>
/* =========================================================================
   CORE - state, storage, layout metrics, undo, toast
   ========================================================================= */
(function(){
'use strict';

/* Optional school feedback link. Recognition runs on this device. */
const FEEDBACK_URL = '';

const CONTENT_MAX = 720, MARGIN_MAX = 220, LINE_H = 30;
/* A phone is narrower than the sheet. Rather than let every line run off the
   right edge, both columns give up width together down to these floors: a
   text column still wide enough to read a sentence in, and a margin still
   wide enough for an answer chip. */
const CONTENT_MIN = 200, MARGIN_MIN = 96, COL_GUTTER = 12;

const S = {
  id:null, title:'untitled', created:0, updated:0,
  strokes:[], lines:[], images:[], annos:[],
  clusters:[], nodes:[], textTranscripts:[],
  tool:'text', lastTool:'pen',
  settings:{ angle:'deg', fractions:false, aiOn:true, theme:'auto', voice:false, recognizer:'ink', touchDraw:true, animations:true, paper:'default', textColor:'', notaColor:'', notaFont:'' },
  docH:1600, dirty:false, selection:[], imageSelection:null, savedRev:0, remoteRev:0
};

/* zoom is a view property like scroll position: it scales the column, the ink
   and the text together, and is remembered per note alongside the scroll */
const M = { colW:940, contentW:720, marginW:220, colLeft:0, vw:0, vh:0, dpr:1, zoom:1 };
const ZOOM_MIN = 0.5, ZOOM_MAX = 3;

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const $ = s => document.querySelector(s);

/* S.strokes is searched by id from a dozen places, several of them inside
   loops over the strokes themselves. The map is rebuilt lazily whenever the
   array is replaced or grows, so callers never have to keep it in step. */
let strokeMap = null, strokeMapFor = null, strokeMapLen = -1;
function strokeById(id){
  if(strokeMapFor !== S.strokes || strokeMapLen !== S.strokes.length){
    strokeMap = new Map(); for(const s of S.strokes) strokeMap.set(s.id, s);
    strokeMapFor = S.strokes; strokeMapLen = S.strokes.length;
  }
  return strokeMap.get(id);
}
const reducedMotion = () => { if(S.settings.animations===false) return true; try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };

const APP_PREF_KEYS = ['theme','touchDraw','voice','recognizer','animations','paper','textColor','notaColor','notaFont'];
function appPrefs(){
  try{ return JSON.parse(localStorage.getItem('notas.prefs')||'{}')||{}; }catch(e){ return {}; }
}
function savePrefs(){
  const out={};for(const k of APP_PREF_KEYS)out[k]=S.settings[k];
  try{ localStorage.setItem('notas.prefs',JSON.stringify(out)); }catch(e){}
}
/* read back with only the settings this version has: one a past version
   stored and this one no longer offers is dropped from storage as well */
function applyPrefs(){
  const stored=appPrefs(),kept={};
  for(const k of APP_PREF_KEYS)if(k in stored)kept[k]=stored[k];
  Object.assign(S.settings,kept);
  document.documentElement.dataset.motion=S.settings.animations===false?'off':'on';
  if(Object.keys(stored).some(k=>!APP_PREF_KEYS.includes(k)))try{ localStorage.setItem('notas.prefs',JSON.stringify(kept)); }catch(e){}
}
function noteSettings(){
  const out={};for(const [k,v] of Object.entries(S.settings))if(!APP_PREF_KEYS.includes(k))out[k]=v;
  return out;
}
/* The device remembers the last note for the next visit; this tab remembers
   its own, so reloading here does not jump to whatever another tab opened. */
function setActive(id){
  try{ id?localStorage.setItem('notas.active',id):localStorage.removeItem('notas.active'); }catch(e){}
  try{ id?sessionStorage.setItem('notas.active',id):sessionStorage.removeItem('notas.active'); }catch(e){}
}
function getActive(){
  try{ const own=sessionStorage.getItem('notas.active'); if(own) return own; }catch(e){}
  try{ return localStorage.getItem('notas.active')||''; }catch(e){ return ''; }
}
/* localStorage writes are synchronous. The scroll position used to be written
   on every scroll event, which is exactly when the main thread can least
   afford it; it is now coalesced and written once the view settles. */
let viewTimer = null, viewPending = null;
function saveView(id,top,left,zoom){
  if(!id) return;
  viewPending = {id, view:{scrollTop:top||0, scrollLeft:left||0, zoom:zoom||M.zoom||1}};
  if(viewTimer) return;
  viewTimer = setTimeout(flushView, 250);
}
function flushView(){
  clearTimeout(viewTimer); viewTimer = null;
  const p = viewPending; viewPending = null;
  if(!p) return;
  try{ localStorage.setItem('notas.view.'+p.id, JSON.stringify(p.view)); }catch(e){}
}
function getView(id){ flushView(); try{ return JSON.parse(localStorage.getItem('notas.view.'+id)||'null'); }catch(e){ return null; } }

/* ---- storage: idb-keyval when present, localStorage as the safety net ----
   A read that fails is not a read that found nothing. The list of notes used
   to come back empty when IndexedDB failed for a moment (Safari drops its
   connection after the app has been in the background), and the next save
   wrote that empty list back with one row in it: every other note was still
   stored, and nothing could reach it. read() throws instead, and everything
   that rewrites the list reads it that way. */
const IDB_USED = 'notas.idb';
const Store = {
  /* no IndexedDB on this device, ever: localStorage is all there is */
  lsOnly: false,
  async read(k){
    // A fallback copy is authoritative, including a null deletion tombstone.
    let v = null;
    try{ v = localStorage.getItem(k); }catch(e){}
    if(v !== null){ try{ return JSON.parse(v) ?? undefined; }catch(e){} }
    if(Store.lsOnly) return undefined;
    if(!window.idbKeyval) throw new Error('storage is not available');
    return await idbKeyval.get(k);
  },
  async get(k){ try{ return await Store.read(k); }catch(e){ return undefined; } },
  async set(k,v){
    let fallback = false;
    try{ fallback = localStorage.getItem(k) !== null; }catch(e){}
    if(!Store.lsOnly && window.idbKeyval){
      try{
        await idbKeyval.set(k,v);
        /* a copy kept here while IndexedDB was failing is superseded now.
           It used to take every later write of its key for good, so a note
           that fell back once could never grow past localStorage's few MB */
        if(fallback){
          try{ localStorage.removeItem(k); }
          catch(e){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e2){ return false; } }
        }
        try{ localStorage.setItem(IDB_USED, '1'); }catch(e){}
        return true;
      }catch(e){}
    }
    try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; }
  },
  async del(k){
    if(!Store.lsOnly && window.idbKeyval){
      try{ await idbKeyval.del(k); }
      catch(e){
        try{ localStorage.setItem(k, 'null'); return true; }catch(e){ return false; }
      }
    }
    try{ localStorage.removeItem(k); return true; }catch(e){ return false; }
  },
  /* every stored key under a prefix, wherever it is kept; a tombstone here
     means the key is gone */
  async keys(prefix){
    const out = new Set();
    if(!Store.lsOnly){
      if(!window.idbKeyval) throw new Error('storage is not available');
      for(const k of await idbKeyval.keys()) if(typeof k === 'string' && k.startsWith(prefix)) out.add(k);
    }
    try{
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(!k || !k.startsWith(prefix)) continue;
        if(localStorage.getItem(k) === 'null') out.delete(k); else out.add(k);
      }
    }catch(e){}
    return [...out];
  },
  /* Checked once at launch. IndexedDB that fails on a device that has used
     it before holds notes that must not be written over; one that has never
     worked here (an old private window) leaves localStorage to carry them.
     A device from before this check has no mark yet, so any sign of notas
     having run here, or of its database existing, counts as used. */
  async probe(){
    if(!window.idbKeyval) throw new Error('storage is not available');
    try{
      await idbKeyval.get('notas.index'); Store.lsOnly = false;
      try{ localStorage.setItem(IDB_USED, '1'); }catch(e){}
    }catch(e){
      let used = false;
      try{
        used = localStorage.getItem(IDB_USED) === '1' || localStorage.getItem('notas.active') !== null || localStorage.getItem('notas.prefs') !== null;
      }catch(e2){}
      if(!used) try{ used = !!(indexedDB.databases && (await indexedDB.databases()).some(d=>d && d.name === 'keyval-store')); }catch(e2){}
      if(used) throw e;
      Store.lsOnly = true;
    }
  },
  /* the list of notes; throws when it cannot be read */
  async index(){ const ix = await Store.read('notas.index'); return Array.isArray(ix) ? oneRowEach(ix) : []; },
  async putIndex(ix){ return await Store.set('notas.index', oneRowEach(ix)); }
};
/* One row per note. A note is stored before its row is written, so a list
   put back together in between (another tab opening while a backup was
   imported) and the row that followed both named it. The first row wins,
   filled in with anything only the other one had (its folder, say). */
function oneRowEach(ix){
  const at = new Map(), out = [];
  for(const r of ix){
    if(!r || !r.id) continue;
    const i = at.get(r.id);
    if(i === undefined){ at.set(r.id, out.length); out.push(r); }
    else out[i] = {...r, ...out[i]};
  }
  return out;
}

/* Automatic recovery labels describe storage, not the note's content. */
function cleanTitle(title){
  return String(title||'').replace(/(?:\s+\((?:before a big change|edits from another tab|conflict copy|recovered copy)\))+$/i,'').trim();
}
/* The first user-written row, typed or recognized ink, in page order. */
function firstLine(lines, textTranscripts=[], transcripts=[]){
  const rows=(lines||[]).filter(l=>!l.tutor&&!l.wait&&l.text?.trim()).map(l=>({y:l.y,x:l.x||0,text:l.text}));
  for(const t of textTranscripts||[]){
    if(!t.text?.trim())continue;
    const box=t.bbox || (lines===S.lines ? N.recog?.textGroups?.().find(g=>g.hash===t.hash)?.bbox : null);
    rows.push({y:box?.[1]??Infinity,x:box?.[0]??0,text:t.text});
  }
  for(const t of transcripts||[]){
    if(t.dismissed||t.needsConfirmation||!(t.ascii||t.latex)?.trim())continue;
    if((textTranscripts||[]).some(p=>p.bbox&&t.bbox&&Math.abs(p.bbox[1]-t.bbox[1])<24))continue;
    rows.push({y:t.bbox?.[1]??Infinity,x:t.bbox?.[0]??0,text:t.ascii||t.latex});
  }
  rows.sort((a,b)=>(a.y-b.y)||(a.x-b.x));
  return rows[0]?.text.trim().replace(/\s+/g,' ').slice(0,60)||'';
}
function displayTitle(title, lines, textTranscripts, transcripts){
  const name=cleanTitle(title);
  return name&&name!=='untitled' ? name : (firstLine(lines,textTranscripts??(lines===S.lines?S.textTranscripts:[]),transcripts??(lines===S.lines?S.clusters:[]))||'untitled');
}
/* a page with nothing on it and no name: not yet a note */
function isBlank(){
  return !S.strokes.length && !S.images.length && (!S.title || S.title === 'untitled') && S.lines.every(l=>!l.text);
}
/* "today", "yesterday", then the date, so a list of notes reads as a diary */
function whenLabel(t){
  const d = new Date(t || 0), now = new Date();
  if(!Number.isFinite(d.getTime()))return 'unknown date';
  const day = x=>new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  if(diff === 0) return 'today';
  if(diff === 1) return 'yesterday';
  if(diff >= 0 && diff < 7) return d.toLocaleDateString(undefined, {weekday:'long'});
  return d.toLocaleDateString(undefined, d.getFullYear() === now.getFullYear() ? {day:'numeric', month:'short'} : {day:'numeric', month:'short', year:'numeric'});
}
function serialize(){
  const sc=$('#scroller');
  return {
    id:S.id, title:S.title, created:S.created, updated:Date.now(),
    rev:S.savedRev||0, settings:noteSettings(), docH:S.docH,
    view:{scrollTop:sc?sc.scrollTop:0,scrollLeft:sc?sc.scrollLeft:0},
    /* a stroke nota is still writing is saved whole: the reveal is not ink */
    strokes:S.strokes.map(st=>st._show===undefined?st:(({_show,...rest})=>rest)(st)),
    /* a reply line still waiting for its first word is saved as plain text */
    lines:S.lines.filter(l=>!l.wait), images:S.images,
    /* transcriptions are persisted so search can reach handwriting offline */
    localVersion:2,
    answers:N.mathcore ? N.mathcore.savedAnswers() : (S.savedAnswers||[]),
    transcripts:S.clusters.filter(c=>c.latex||c.ascii||c.asked).map(c=>({hash:c.hash, bbox:c.bbox, latex:c.latex, ascii:c.ascii, kind:c.kind, modelVersion:c.modelVersion, alternatives:c.alternatives||[], confirmed:!!c.confirmed, needsConfirmation:!!c.needsConfirmation, confidence:c.confidence||0, asked:!!c.asked, ...(c.dismissed?{dismissed:true}:{}), plotVals:c._plotVals||null})),
    /* PP-OCRv6 prose readings are hidden search metadata. They never replace
       ink or feed the maths evaluator, and the raw reading is kept so search
       can show exactly what the text recogniser saw. */
    textTranscripts:(S.textTranscripts||[]).map(t=>({hash:t.hash,text:t.text,confidence:t.confidence||0,modelVersion:t.modelVersion,...(t.bbox?{bbox:t.bbox.slice()}:{}),...(t.asked?{asked:true}:{})}))
  };
}

/* an export file: laid out for reading when small, compact when large. The
   layout puts every number on a line of its own, which could carry a big
   note past what import takes back */
function exportText(v){ const flat=JSON.stringify(v); const pretty=flat.length<8*1024*1024?JSON.stringify(v,null,1):flat;return new Blob([pretty]).size<200*1024*1024?pretty:flat; }
let saveTimer = null, saveIdle = false, saveQueue = Promise.resolve(), revision = 0;
const locallyWrittenRevs=new Map();
const rescueOwner=uid(), rescueKey='notas.rescue.'+rescueOwner;
function rescueSave(){
  if(!S.id||!S.dirty)return;
  try{localStorage.setItem(rescueKey,JSON.stringify(serialize()));}catch(e){setSaveError();}
}
function clearRescue(){try{localStorage.removeItem(rescueKey);}catch(e){}}
async function recoverRescues(){
  let keys=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('notas.rescue.'))keys.push(k);}}catch(e){return;}
  for(const key of keys){
    try{
      const raw=localStorage.getItem(key),doc=JSON.parse(raw);if(!doc?.id)continue;
      await withNoteLock(doc.id,async()=>{
        const current=await Store.read('notas.note.'+doc.id);
        const content=d=>JSON.stringify([d.title,d.strokes,d.lines,d.images,d.transcripts,d.textTranscripts,d.answers,d.settings]);
        if(!current||content(current)!==content(doc))await writeCopy(doc,(doc.title||'untitled')+' (recovered copy)');
        if(localStorage.getItem(key)===raw)localStorage.removeItem(key);
      });
    }catch(e){}
  }
}
/* Web Locks is the simplest cross-tab mutex. Browsers without it still have
   IndexedDB, so idb-keyval's atomic update() gives us a small lease record that
   serializes the same critical section across tabs. This is materially different

/* ---- undo: one stack across ink, text and tutor ink ---- */
const Undo = { back:[], fwd:[], typing:null };

   shared note never takes back someone else's line with it. */

    const top = Undo.back[Undo.back.length-1];

    Undo.fwd.length = 0;

     arrives from someone else afterwards is not part of the run */
  const run = Undo.typing.get(ln.id);

     typing makes it nota's again, so undoing the reply takes it out too */

     is: putting back this run's text would take their words with it */
  const put = key=>{ const from = key === 'was' ? 'now' : 'was'; for(const c of changes){ const ln = S.lines.find(l=>l.id===c.id); if(ln && (ln.text||'') === c[from]){ ln.text = c[key]; if(c.tutor){ if(key === 'was') ln.tutor = true; else { delete ln.tutor; delete ln.wait; } } } } };

/* ---- layout ---- */
function layout(){
  const sc = $('#scroller'); const r = sc.getBoundingClientRect();

     - a phone, a split window - it narrows to the screen instead, because a
     line you have to pan sideways to finish reading is not a line. The two
     columns shrink together so the answers stay beside the working. */

  const room = Math.round(M.vw) - COL_GUTTER*2;
  if(room >= CONTENT_MAX + MARGIN_MAX){ M.contentW = CONTENT_MAX; M.marginW = MARGIN_MAX; }
  else {
    M.marginW = clamp(Math.round(room*0.3), MARGIN_MIN, MARGIN_MAX);
    M.contentW = Math.max(CONTENT_MIN, room - M.marginW);
  }
  M.colW = M.contentW + M.marginW;

     so the text layer, chips and plots all follow the zoom for free; the ink
     canvases apply the same scale in their own transform */
  const col = $('#col');
  col.style.marginLeft = M.colLeft+'px';
  col.style.transform = z === 1 ? '' : 'scale('+z+')';
  $('#doc').style.height = Math.round(S.docH*z)+'px';
  /* #col is scaled, so it takes the unscaled height. Its children are all
     absolutely placed, so without this it is zero high, and iPadOS hides the
     caret, the selection handles and the edit menu in an editing host whose
     visible box is empty (#lines fills #col). Not height:100% in CSS: #doc is
     already zoomed, and the scale would apply twice. */
  col.style.height = S.docH+'px';

     paper stays as wide as its furthest ink or picture, so old coordinates
     are still reachable by panning even though new lines wrap before them. */

   with its own id, or null when the eraser missed it. The stroke is walked
   at about a pixel a step so a fast, sparse line is cut where it was
   touched and not at its nearest recorded points. */
function cutStroke(stroke,touched){
  const p=stroke.pts,times=Array.isArray(stroke.times)&&stroke.times.length===p.length/3?stroke.times:null;
  const walk=[];   /* x, y, pressure, time, erased */
  const push=(x,y,pr,t)=>walk.push([x,y,pr,t,touched(x,y)]);
  push(p[0],p[1],p[2],times?times[0]:0);
  for(let i=3;i<p.length;i+=3){
    const n=Math.max(1,Math.ceil(Math.hypot(p[i]-p[i-3],p[i+1]-p[i-2])/1.2));
    for(let k=1;k<=n;k++){
      const f=k/n;
      push(p[i-3]+(p[i]-p[i-3])*f,p[i-2]+(p[i+1]-p[i-2])*f,p[i-1]+(p[i+2]-p[i-1])*f,times?times[i/3-1]+(times[i/3]-times[i/3-1])*f:0);
    }
  }
  if(!walk.some(v=>v[4]))return null;
  const runs=[];let run=[];
  for(const v of walk){ if(v[4]){ if(run.length)runs.push(run); run=[]; } else run.push(v); }
  if(run.length)runs.push(run);
  const pieces=[];
  for(const r of runs){
    let len=0;for(let i=1;i<r.length;i++)len+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);
    if(r.length<2||len<Math.max(1.5,stroke.w*0.6))continue;
    /* the walk's in-between points go again where the line is straight */
    const kept=[r[0]];
    for(let i=1;i<r.length-1;i++){
      const a=kept[kept.length-1],b=r[i],c=r[i+1];
      const cross=Math.abs((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]));
      if(cross>0.6||Math.hypot(b[0]-a[0],b[1]-a[1])>6)kept.push(b);
    }
    kept.push(r[r.length-1]);
    const {id,pts,times:_t,bbox,drawn,_show,quickGroup,quickCount,quickMath,notaGroup,notaCount,notaText,...rest}=stroke;
    const piece={...rest,id:C.uid(),pts:kept.flatMap(v=>[v[0],v[1],v[2]]),bbox:null};
    if(times)piece.times=kept.map(v=>v[3]);
    piece.bbox=bboxOf(piece.pts);
    pieces.push(piece);
  }
  return pieces;
}

/* ---- the ink clock ----
   Strokes are stamped from a clock that stops while the pen cannot write:
   the text or select tool is up, or the tab is in the background. The
   reader groups ink into expressions partly by the pauses between strokes,
   and a detour to type a note in the middle of an equation looked like a
   long pause, so the half written before it and the half after were read as
   two expressions. Time spent typing is not time spent thinking about the
   ink, so it is simply left out. Only new strokes are stamped this way: the
   offset grows monotonically, so order is kept against everything already
   on the page, and the hash a reading is cached under never looks at time. */
let awayTotal = 0, awaySince = 0;
function inkNow(){ return Date.now() - awayTotal - (awaySince ? Date.now() - awaySince : 0); }
function penAway(){
  const away = document.hidden || !(S.tool === 'pen' || S.tool === 'eraser');
  if(away && !awaySince) awaySince = Date.now();
  else if(!away && awaySince){ awayTotal += Date.now() - awaySince; awaySince = 0; }
}
document.addEventListener('visibilitychange', penAway);

/* ---- tools ---- */
function setTool(t){

}

/* ---- selection ---- */
function selectedLineBox(ln){
  const node=(S.nodes||[]).find(n=>n.id===ln.id),extra=node?.result?node.result.length*11+48:24;
  return [ln.x||0,ln.y,Math.min(M.contentW,(ln.x||0)+Math.max(80,ln.text.length*10+extra)),ln.y+Math.max(C.LINE_H,ln.h||0)];
}
function selectionBox(){
  if(cropping && cropping.id === S.imageSelection){
    const F = cropping.F, f = frameOf(F), hw = F.w/2, hh = F.h/2;
    const ps = [[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]].map(([a,c])=>framePoint(f,a,c));
    return [Math.min(...ps.map(q=>q.x)), Math.min(...ps.map(q=>q.y)), Math.max(...ps.map(q=>q.x)), Math.max(...ps.map(q=>q.y))];

    const im=S.images.find(i=>i.id===S.imageSelection);
    if(im)return [im.x,im.y,im.x+im.w,im.y+im.h];
  }
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const ln of S.lines)if(S.selection.includes(ln.id)){const q=selectedLineBox(ln);a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3]);}
  for(const id of S.selection){
    const st = C.strokeById(id); if(!st) continue;
    a=Math.min(a,st.bbox[0]); b=Math.min(b,st.bbox[1]);

/* Inside the selection means grab it; outside starts a new lasso. The padding

function hitSelection(x, y){
  if(!S.selection.length&&!S.imageSelection) return false;

function imageAt(x,y){
  for(let i=S.images.length-1;i>=0;i--){const im=S.images[i];if(inImage(x,y,im))return im;}

/* ---- the frame round whatever is selected ----

  if(!S.selection.length) return null;

  const hw=f.w/2, hh=f.h/2;
  return [{k:'nw',...framePoint(f,-hw,-hh)},{k:'ne',...framePoint(f,hw,-hh)},{k:'sw',...framePoint(f,-hw,hh)},{k:'se',...framePoint(f,hw,hh)},

function resizedBox(b,k,x,y){

/* select a picture where it is, without changing tools: a tap on it does this */
function pickImage(id){
  if(!S.images.some(i=>i.id===id))return false;
  S.selection=[];S.imageSelection=id;render();showSelBar();return true;
}
function moveStrokes(ids, dx, dy){
  for(const ln of S.lines)if(ids.includes(ln.id)){ln.x=(ln.x||0)+dx;ln.y+=dy;}
  N.text.render();
  carryReadings(()=>{
    for(const id of ids){
      const st = C.strokeById(id); if(!st) continue;
      for(let i=0;i<st.pts.length;i+=3){ st.pts[i]+=dx; st.pts[i+1]+=dy; }
      st.bbox = bboxOf(st.pts); st.rev = (st.rev||0) + 1;   /* the reading cache keys on the points */
    }

/* ---- turning and scaling ----
   Both are previewed on the ink itself: every move lays the original points
   down again through the new transform, so nothing drifts, and the lift
   records one undo step from the originals to the result. A picture keeps
   its angle as a number and is drawn turned. */
function grabStrokes(ids){
  const m = new Map();
  for(const id of ids){ const st = C.strokeById(id); if(st) m.set(id, {pts:st.pts.slice(), bbox:st.bbox.slice(), w:st.w}); }
  return m;
}
function layStrokes(orig, map, wf){

    const p = o.pts.slice();
    for(let i=0;i<p.length;i+=3){ const q = map(p[i], p[i+1]); p[i] = q[0]; p[i+1] = q[1]; }

  });

/* ---- background removal ---- */

/* ---- reading order: y band first, then x ---- */
function medianHeight(){
  const hs = S.strokes.filter(s=>s.author==='user').map(s=>s.bbox[3]-s.bbox[1]).sort((a,b)=>a-b);
  return hs.length ? Math.max(18, hs[hs.length>>1]) : C.LINE_H;

function collect(){
  const band = Math.max(C.LINE_H, medianHeight()*1.2);

    if(ln.tutor) continue;              /* nota's red lines are never calculated */

               right: (ln.x||0)+textWidth(ln.text) + 4, mid: ln.y + C.LINE_H/2, src:ln.text, ref:ln });

  for(const cl of S.clusters){
    out.push({ kind:'cluster', id:cl.id, y:cl.bbox[1], x:cl.bbox[0],

/* ---- evaluation ---- */
const RE_FN  = /^\s*([A-Za-z_]\w*)\s*\(\s*([A-Za-z_]\w*(?:\s*,\s*[A-Za-z_]\w*)*)\s*\)\s*=\s*([^=].*)$/;

/* Every keystroke anywhere on the page re-runs every line. A line whose

const evalMemo = new Map();

  if(!window.math)return S.savedAnswers||[];

}
function restoreAnswers(entries){
  savedMemo.clear();

const provSrc = new Map();
function memoKey(src, defined){

function evalNode(node, scope, defined){

/* Handwriting is only calculated once the student writes '=' and asks for an

   of producing a confident answer to something nobody wrote. Typed lines and
   readings the student has confirmed are calculated as before. */
/* A run of three or more letters is a word, not algebra. A model trained only
   on formulae will read "hello" as some equation, sometimes one containing an

   calculate" chip sat under the question, where the answer is written */

function offersSolve(n){
  if(n.kind !== 'cluster' || !n.src || n.pending || n.ref?.review) return false;

function requestSolve(id){
  const live = S.clusters.find(c=>c.id===id); if(!live) return;

  for(const [id, el] of chips){
    if(!el.classList.contains('offer')) continue;
    const cl = S.clusters.find(c=>c.id===id); if(!cl || cl.dismissed || cl.asked) continue;
    if(!fresh.some(s=>grouped.get(s) !== cl)) continue;

  if(evalMemo.size > nodes.length + 50){ const live = new Set(nodes.map(n=>n.id)); for(const id of [...evalMemo.keys()]) if(!live.has(id)) evalMemo.delete(id); }

/* ---- chips in the margin ---- */
/* ---- what the dots are waiting for ---- */
/* The first time, the reader has to be fetched (tens of megabytes), then
   started, and on a slow connection the dots beside a sum sat there saying
   nothing. Read as "the maths is slow", the notebook was put down. The chip
   the student is looking at - the one beside the ink written last - now says
   what it is waiting for, and that it is once. */
function waitText(){
  const p = N.ai && N.ai.setupState ? N.ai.setupState() : null;
  if(!p) return '';
  if(p.phase === 'download') return 'getting the handwriting reader' + (p.detail ? ', ' + p.detail : '') + '. first time only.';
  if(p.phase === 'starting') return 'starting the handwriting reader. a moment.';
  return '';

function waitCaption(){

}

  for(const n of nodes){

    let last = 0; for(const id of n.ref.strokeIds){ const st = C.strokeById(id); if(st) last = Math.max(last, Number(st.t1)||Number(st.t0)||0); }

function refreshWaiting(){
  if(!S.nodes.some(n=>n.pending)) return;

  let replace = false;
  for(const [id, el] of chips){
    const n = S.nodes.find(o=>o.id === id);
    if(!n || !n.pending) continue;
    const html = pendingHTML(n, waitOn);
    if(el.dataset.html === html) continue;
    /* the count changing is the usual case: the words are swapped inside the
       line that is already there, so it does not fade in again every megabyte */
    const wait = el.querySelector('.wait'), text = n.id === waitOn ? waitText() : '';
    if(wait && text){ wait.textContent = text; el.dataset.html = html; continue; }
    /* a line appearing or going changes the chip's height, so it is placed again */

const SETTLE_MS = 1500;

function paint(nodes){
  const seen = new Set(), plotted = new Set(), place = [], waitOn = latestPending(nodes);
  let plotBottom = 0, deepest = 0, settleAt = 0;
  clearTimeout(settleTimer); settleTimer = 0;
  for(const n of nodes){
    deepest = Math.max(deepest, n.mid || n.y);
    /* graphs are too big to sit inline, so they keep the right hand band */
    if(n.plot && N.plot){
      plotted.add(n.id);
      const top = Math.max(n.y - 4, plotBottom + 8);
      const p = N.plot.card(n, top);
      if(p) plotBottom = top + p.offsetHeight;
    }
    /* Completed typed expressions surface evaluator/parser feedback instead of
       failing silently. Handwriting that has not asked for an answer stays quiet. */
    /* Handwriting that does not ask for an answer gets no chip at all. Writing
       a word is not a failed sum, and a model that only knows formulae will
       always read one, so the quiet default is to leave prose alone. */
    // Background prose, uncertain ink and failed reads never become math UI.
    // Explicit Solve still surfaces its reading or a useful failure.
    if(n.kind==='cluster'&&!n.ref?.asked&&!n.ref?.confirmed&&(N.recog?.handwritingKind(n.ref)!=='math'||n.ref?.review))continue;
    const editingError=n.kind==='line'&&n.error&&N.text&&N.text.isFocused&&N.text.isFocused(n.id);
    /* a typed line that reads as words and never asks with '=' is a note, not
       a failed sum: "homework 12 sep" gets no chip */
    const proseLine=n.kind==='line'&&n.error&&!/=/.test(n.src||'')&&readsAsProse(n.src);
    const visibleError=(editingError||proseLine)?'':n.error;
    const offer = offersSolve(n);
    /* A trailing equals sign previews the answer; Space accepts it into the editable line.
       Completed answers need no extra chip; extended answers evaluate their tail. */
    if(n.kind==='line' && N.text && N.text.setGhost){
      const ghost = n.result && !n.error && !n.plot && !n.provides && /=\s*$/.test(n.src||'') ? n.result : '';
      N.text.setGhost(n.id, ghost);
      if(ghost || n.stated) continue;
    }
    /* The graph card is the answer. Leave its old scalar chip unseen so
       cleanup removes it, rather than labelling a valid reading unreadable. */
    if(n.plot && N.plot) continue;
    const show = n.pending || n.result || visibleError || n.ref?.review || offer || (n.kind==='cluster' && n.src && asksForAnswer(n));
    if(!show || (n.kind==='cluster' && n.ref?.dismissed) || callInk(n)) continue;
    /* Ink still warm from the pen gets no chip yet. The chip lands right after
       the working, where the next symbol goes, and a reading that arrived in
       the middle of writing was a thing in the way. It waits for the pen to
       lift and for a short quiet moment after the last stroke of that ink; a
       run is booked for then. A chip already on the page stays, and the
       student's own Solve is never held. */
    if(n.kind==='cluster' && n.ref?.source==='ink' && !n.ref.asked && !chips.has(n.id) && N.ink && N.ink.now){
      let last = 0; for(const id of n.ref.strokeIds){ const st = C.strokeById(id); if(st) last = Math.max(last, Number(st.t1)||Number(st.t0)||0); }
      const wait = N.ink.drawing() ? SETTLE_MS : Math.min(SETTLE_MS, SETTLE_MS - (N.ink.now() - last));
      if(wait > 0){ settleAt = settleAt ? Math.min(settleAt, wait) : wait; continue; }
    }
    seen.add(n.id);
    let el = chips.get(n.id);
    if(!el){
      el = document.createElement('div'); el.className = 'chip';
      /* the answer is read where it stands; only Solve is pressed */
      el.addEventListener('click', e=>{
        if(!e.target.closest('.solve')) return;
        e.stopPropagation(); requestSolve(el.dataset.node);
      });
      marginEl.appendChild(el); chips.set(n.id, el);
    }
    el.classList.remove('yield');           /* stepped aside for the pen; the paint puts it back */
    el.dataset.node=n.id;
    /* Match a generated handwritten answer to the height of the expression
       that produced it. This is measured from the actual recognition bbox,
       so large and small handwriting scale naturally instead of using a
       fixed answer font size. Typed-line answers keep the normal chip size. */
    const handwritingHeight=n.kind==='cluster'&&(n.result||n.pending)&&n.ref?.bbox
      ? Math.max(1,n.ref.bbox[3]-n.ref.bbox[1]) : 0;
    el.style.fontSize=handwritingHeight?handwritingHeight+'px':'';
    el.classList.toggle('error',!!visibleError);
    el.classList.toggle('offer',offer);
    el.classList.toggle('typed', n.kind === 'line' && !offer && !visibleError && !n.pending);
    let html;
    if(offer){
      el.setAttribute('aria-label','handwriting read as '+n.src+'.');
      html = '<span class="reading">'+readingHTML(n.ref)+'</span>'+
        '<button class="solve" type="button" aria-label="solve '+escape(n.src)+'"><i class="ph ph-equals" aria-hidden="true"></i>solve</button>';
    }else{
      el.removeAttribute('aria-label');
      html = n.pending
        ? pendingHTML(n, waitOn)
        : escape(visibleError ? 'cannot calculate, '+visibleError : (n.result || 'could not read this'));
    }
    /* Rewritten only when it changes. A blur on a typed line re-runs the
       maths at once, and replacing the Solve button between the press and
       the release of a tap on it swallowed the tap. */
    if(el.dataset.html !== html){ el.innerHTML = html; el.dataset.html = html; }
    /* right after the working. The paper, not the column, is the limit - the
       same freedom a drag has - so an equation moved into the margin keeps its
       answer beside it instead of pinned at the column edge. When the paper
       ends, the chip falls below the working rather than covering it. */
    const zc=M.zoom, docW=$('#doc').offsetWidth||M.vw;
    const paperL=-M.colLeft/zc, paperR=(docW-M.colLeft)/zc;
    const bb=n.kind==='cluster'&&n.ref&&n.ref.bbox?n.ref.bbox:null;
    const MIN_PILL=90, PILL_ROOM=140;
    const floor=(n.right||0)>M.contentW?paperL+2:44;
    let left=Math.max(floor,(n.right||0)+18);
    /* no room beside: the chip falls below the working, left-aligned with it
       but pulled inside the paper so it keeps a real pill width - a short
       answer must never wrap into a tall column of characters */
    const below=()=>{
      const belowMid=bb?bb[3]+14:(n.mid||n.y)+C.LINE_H/2+14;
      const l=Math.min(Math.max(paperL+2,bb?bb[0]:(n.x||0)), Math.max(paperL+2,paperR-6-MIN_PILL));
      el.style.left=l+'px';
      el.style.maxWidth=Math.max(MIN_PILL,paperR-6-l)+'px';
      el.style.top=Math.round(belowMid)+'px';
      /* the paper grows to keep a dropped answer on it */
      deepest=Math.max(deepest, belowMid+(handwritingHeight?handwritingHeight*1.3:C.LINE_H));
    };
    if(left+PILL_ROOM>paperR-6){
      below();
      place.push(null);
    }else{
      el.style.left=left+'px';
      el.style.maxWidth=Math.max(MIN_PILL,paperR-6-left)+'px';
      /* the height one line of this answer takes; a handwritten answer is
         set at the handwriting's height, so the fixed room check above
         cannot know whether it will fit beside. Offers and errors are
         more than one line by design and are left where they are. */
      const plain=!offer&&!visibleError;
      const lineH=!plain?0:handwritingHeight?handwritingHeight*1.15:(n.kind==='line'?16*1.4:21*1.15);
      place.push([el,n.mid||n.y,lineH,below]);
    }
  }
  /* heights are read only after every chip has been written: interleaving
     the two forced a layout per chip. A null entry placed itself below the
     working, where there was no room beside. A chip that turned out taller
     than one line wrapped beside the working: it goes below instead, where
     the whole paper width is its own, rather than climbing off the screen
     as a column of digits centred on the working. */
  for(const p of place){
    if(!p) continue;
    const [el,mid,lineH,below]=p;
    if(lineH&&el.offsetHeight>lineH*1.6+12){ below(); continue; }
    el.style.top = Math.round(mid - el.offsetHeight/2) + 'px';
  }
  for(const [id, el] of chips){
    if(!seen.has(id)){ el.remove(); chips.delete(id); }
  }
  if(settleAt) settleTimer = setTimeout(run, settleAt + 30);
  N.plot && N.plot.keep(plotted);
  C.growDoc(Math.max(plotBottom, deepest) + 160);
}
function escape(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* the reading typeset when KaTeX and a LaTeX form are both there, plain text otherwise */
function readingHTML(ref){
  if(!ref) return '';
  if(window.katex && ref.latex){
    try{ return katex.renderToString(ref.latex, {throwOnError:false, displayMode:false}); }catch(e){}
  }
  return escape(ref.ascii || latexToMath(ref.latex || ''));
}
function reset(){ for(const [,el] of chips) el.remove(); chips.clear(); evalMemo.clear(); savedMemo.clear(); }

/* a graph evaluates its expression a few hundred times per redraw; parsing
   it once and evaluating the compiled form is what makes a slider keep up */
const compiled = new Map();
function compileRaw(expr){
  let c = compiled.get(expr);
  if(!c){ c = rawParse(expr).compile(); if(compiled.size > 200) compiled.clear(); compiled.set(expr, c); }
  return c;
}
async function quickMath(source){
  if(!harden()) throw new Error('maths is still loading. try again in a moment.');
  const src=normalize(source).replace(/=\s*$/,'').trim();
  if(!src) return '';
  if(src.length>160||/[\[\]{};:"]/.test(src)) throw new Error('try a shorter arithmetic expression or equation.');
  const node={id:'quick',kind:'quick',src,ref:{}};
  evalNodeFresh(node,baseScope(),new Set(),src);
  if(node.pending){
    await ensureCAS();
    node.pending=false; node.error=''; node.result='';
    evalNodeFresh(node,baseScope(),new Set(),src);
  }
  if(node.error||!node.result) throw new Error('check the equation and try again.');
  return node.result;
}
N.mathcore = { quickMath, run, refreshWaiting, normalize, latexToMath, looksLikeMath, readsAsProse, fmt, freeVars, harden, reset, ensureCAS, savedAnswers, restoreAnswers,
               baseScope, evalRaw:(s,sc)=>rawEval(s,sc), parseRaw:s=>rawParse(s), compileRaw, collect, requestSolve, dismiss, inkLanded };
})();
</script>

<script>
/* =========================================================================
   CHROME - the lens in the tool pill. One graphite disc travels to whichever
   tool is pressed instead of each button lighting up on its own. It follows
   aria-pressed, which the ink code already maintains, so nothing else changes.
   ========================================================================= */
(function(){
'use strict';
const strip=document.getElementById('pill-strip'), lens=document.getElementById('pill-lens');
if(!strip||!lens)return;
function place(){
  const on=strip.querySelector('.tool[data-tool][aria-pressed="true"]');
  if(!on){ strip.style.setProperty('--lens-on','0'); return; }
  strip.style.setProperty('--lens-on','1');
  strip.style.setProperty('--lens-x',on.offsetLeft+'px');
}
new MutationObserver(place).observe(strip,{attributes:true,attributeFilter:['aria-pressed'],subtree:true});
addEventListener('resize',place);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
/* the first placement is silent: the lens appears on its tool, it does not slide there */
lens.style.transition='none'; place();
requestAnimationFrame(()=>requestAnimationFrame(()=>{ lens.style.transition=''; }));
})();
</script>

<script>
/* =========================================================================
   TYPING - the caret glides and the chrome steps back while you type.
   The lines are untouched: a mirror of the one the caret is in measures
   where it is, one bar slides there, and blinks only once you pause.
   ========================================================================= */
(function(){
'use strict';
const layer=document.getElementById('textlayer'), root=document.getElementById('lines'), caret=document.getElementById('caret'), mirror=document.getElementById('caret-mirror');
if(!layer||!root||!caret||!mirror)return;
let idleTimer=null, raf=0;
const touch=matchMedia('(hover:none),(pointer:coarse)');
root.classList.add('glide');   /* from the first tap, before anything is measured */
function measure(){
  raf=0;
  const ta=N.text&&N.text.currentText&&N.text.currentText(); if(!ta||!ta.isConnected){ hide(); return; }
  /* on a touch screen a selected range is the native selection's, with its
     handles: the native caret colour comes back and the bar goes */
  const range=ta.selectionStart!==ta.selectionEnd;
  root.classList.toggle('glide',!(touch.matches&&range));
  if(touch.matches&&range){ hide(); return; }
  const line=ta.parentElement;
  mirror.style.width=ta.offsetWidth+'px';
  const at=ta.selectionDirection==='backward'?ta.selectionStart:ta.selectionEnd;
  mirror.textContent=ta.value.slice(0,at);
  const mark=document.createElement('i'); mirror.appendChild(mark);
  /* a trailing newline collapses without something after it */
  mirror.appendChild(document.createTextNode('\u200b'));
  const x=line.offsetLeft+mark.offsetLeft, y=line.offsetTop+mark.offsetTop+1;
  caret.style.transform='translate('+x+'px,'+y+'px)';
  caret.classList.add('on');
}
function schedule(){ if(!raf)raf=requestAnimationFrame(measure); }
function hide(){ caret.classList.remove('on','idle'); }
function typed(){
  /* a moving caret does not blink; it starts again half a second after the last key */
  caret.classList.remove('idle'); clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>caret.classList.add('idle'),500);
}
function focusMode(on){ document.body.classList.toggle('typing',on); }
layer.addEventListener('focusin',e=>{ if(root.contains(e.target)){ typed(); schedule(); } });
layer.addEventListener('focusout',e=>{ if(root.contains(e.target)&&!(e.relatedTarget&&root.contains(e.relatedTarget))){ hide(); focusMode(false); } });
layer.addEventListener('input',e=>{ if(root.contains(e.target)){ typed(); schedule(); } });
layer.addEventListener('keydown',e=>{
  if(!root.contains(e.target))return;
  typed(); schedule();
  /* printable keys and editing keys mean writing; a lone modifier does not */
  const key=e.key||'';   /* Scribble sends key events without a key */
  if(!e.ctrlKey&&!e.metaKey&&(key.length===1||key==='Backspace'||key==='Enter'||key==='Delete'))focusMode(true);
});
layer.addEventListener('keyup',e=>{ if(root.contains(e.target))schedule(); });
layer.addEventListener('pointerup',e=>{ if(root.contains(e.target))schedule(); });
document.addEventListener('selectionchange',()=>{ if(root.contains(document.activeElement))schedule(); });
/* the chrome comes back the moment a hand reaches for it */
addEventListener('pointermove',()=>{ if(document.body.classList.contains('typing'))focusMode(false); },{passive:true});
addEventListener('pointerdown',()=>focusMode(false),{passive:true,capture:true});
addEventListener('resize',schedule);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
N.typing={refresh:schedule};
})();
</script>

<script>
/* =========================================================================
   TUTOR - red ink on the page. Primitives in, hand drawn marks out.
   ========================================================================= */
(function(){
'use strict';
const C = N.core, S = C.S, M = C.M, $ = C.$;
let rc = null, animating = false;

function red(){ return N.ink ? N.ink.colors.red : '#C0392B'; }
function seed(id){ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))|0; return Math.abs(h)%9999; }

/* ---- where a mark can go without covering the student's work ---- */
const CELL = 16;
function occupancy(){
  const set = new Set();
  const mark = (b)=>{
    for(let y=Math.floor(b[1]/CELL); y<=Math.floor(b[3]/CELL); y++)
      for(let x=Math.floor(b[0]/CELL); x<=Math.floor(b[2]/CELL); x++) set.add(x+','+y);
  };
  for(const s of S.strokes) mark(s.bbox);
  for(const l of S.lines) mark([0, l.y, M.contentW, l.y+C.LINE_H]);
  for(const im of S.images) mark([im.x, im.y, im.x+im.w, im.y+im.h]);
  for(const a of S.annos) for(const o of (a.marks||[])) if(o.box) mark(o.box);
  return set;
}
function free(set, b){
  if(b[0] < -8 || b[2] > M.colW) return false;
  for(let y=Math.floor(b[1]/CELL); y<=Math.floor(b[3]/CELL); y++)
    for(let x=Math.floor(b[0]/CELL); x<=Math.floor(b[2]/CELL); x++) if(set.has(x+','+y)) return false;
  return true;
}
function findSpace(set, w, h, near){
  const tries = [];
  /* right margin first, then below, then above */
  for(let dy=0; dy<=160; dy+=CELL){
    tries.push([M.contentW+8, near[1]+dy]);
    if(dy) tries.push([M.contentW+8, near[1]-dy]);
  }
  for(let dy=CELL; dy<=220; dy+=CELL) tries.push([near[0], near[3]+dy]);
  for(let dy=CELL; dy<=160; dy+=CELL) tries.push([near[0], near[1]-h-dy]);
  for(const [x,y] of tries){
    const b = [x, y, x+w, y+h];
    if(b[1] < 8) continue;
    if(free(set, b)) return b;
  }
  return [M.contentW+8, near[3]+CELL, M.contentW+8+w, near[3]+CELL+h];
}
function boxOf(target){
  if(!target) return null;
  const cl = S.clusters.find(c=>c.id === target); if(cl) return cl.bbox.slice();
  const ln = S.lines.find(l=>l.id === target); if(ln) return [0, ln.y, Math.min(M.contentW, 40+ln.text.length*9), ln.y+C.LINE_H];
  const nd = (S.nodes||[]).find(n=>n.id === target);
  if(nd) return [nd.x, nd.y, nd.x+120, nd.y+C.LINE_H];
  return null;
}

/* ---- turn model ops into placed, drawable marks ---- */
function place(ops){
  const set = occupancy();
  const out = [];
  for(const o of ops){
    const b = boxOf(o.target) || [20, lastY()+40, 160, lastY()+70];
    const to = boxOf(o.to);
    if(o.op === 'circle'){
      out.push({k:'ellipse', x:(b[0]+b[2])/2, y:(b[1]+b[3])/2, w:(b[2]-b[0])+22, h:(b[3]-b[1])+18, box:b});
    } else if(o.op === 'underline'){
      out.push({k:'line', x1:b[0]-4, y1:b[3]+6, x2:b[2]+4, y2:b[3]+6, box:[b[0],b[3],b[2],b[3]+8]});
    } else if(o.op === 'strike'){
      out.push({k:'line', x1:b[0]-4, y1:(b[1]+b[3])/2, x2:b[2]+4, y2:(b[1]+b[3])/2, box:b});
    } else if(o.op === 'tick'){
      const p = findSpace(set, 26, 26, b);
      out.push({k:'tick', x:p[0], y:p[1], box:p}); mark(set, p);
    } else if(o.op === 'cross'){
      const p = findSpace(set, 26, 26, b);
      out.push({k:'cross', x:p[0], y:p[1], box:p}); mark(set, p);
    } else if(o.op === 'arrow'){
      const t = to || findSpace(set, 40, 24, b);
      out.push({k:'arrow', x1:(b[0]+b[2])/2, y1:b[3]+4, x2:(t[0]+t[2])/2, y2:t[1]-4, box:null});
    } else if(o.op === 'label' || o.op === 'sticky'){
      const text = String(o.text||'');
      const w = Math.min(Math.max(70, text.length*9.5), M.contentW >= C.CONTENT_MAX ? M.marginW+30 : Math.max(70, M.marginW-8));
      const lines = wrap(text, Math.floor(w/9.5));
      const h = 8 + lines.length*22;
      const p = findSpace(set, w, h, b);
      out.push({k:'text', x:p[0], y:p[1], lines, box:p, boxed:(o.op==='sticky')});
      mark(set, p);
      out.push({k:'arrow', x1:p[0]-6, y1:p[1]+12, x2:b[2]+4, y2:(b[1]+b[3])/2, box:null});
    }
  }
  return out;
}
function mark(set, b){
  for(let y=Math.floor(b[1]/CELL); y<=Math.floor(b[3]/CELL); y++)
    for(let x=Math.floor(b[0]/CELL); x<=Math.floor(b[2]/CELL); x++) set.add(x+','+y);
}
function wrap(t, n){
  const words = t.split(/\s+/), out = []; let cur = '';
  for(const w of words){
    if((cur+' '+w).trim().length > n){ if(cur) out.push(cur); cur = w; } else cur = (cur?cur+' ':'')+w;
  }
  if(cur) out.push(cur);
  return out.slice(0, 5);
}
function lastY(){
  let y = 40;
  for(const s of S.strokes) y = Math.max(y, s.bbox[3]);
  for(const l of S.lines) y = Math.max(y, l.y+C.LINE_H);
  return y;
}

function addAnno(ops, tag){
  const marks = place(ops);
  if(!marks.length) return null;
  const a = { id:C.uid(), tag:tag||'tutor', marks, t0:performance.now() };
  S.annos.push(a);
  animating = true;
  N.ink.renderAI();
  C.markDirty();
  return a;
}
function clearAnnos(tag){
  S.annos = tag ? S.annos.filter(a=>a.tag !== tag) : [];
  N.ink.renderAI(); C.markDirty();
}

/* ---- drawing ---- */
/* rough.js gives the marks a hand drawn edge. If it is unreachable the tutor
   still writes, just with a steadier hand, rather than disappearing. */
function pen(ctx, col){
  if(window.rough){
    if(!rc) rc = rough.canvas($('#c-ai'));
    return {
      line:(a,b,c,d,o)=>rc.line(a,b,c,d,o),
      ellipse:(x,y,w,h,o)=>rc.ellipse(x,y,w,h,o),
      rectangle:(x,y,w,h,o)=>rc.rectangle(x,y,w,h,o),
      linearPath:(pts,o)=>rc.linearPath(pts,o)
    };
  }
  const stroke = ()=>{ ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.lineCap='round'; };
  return {
    line:(a,b,c,d)=>{ stroke(); ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.stroke(); },
    ellipse:(x,y,w,h)=>{ stroke(); ctx.beginPath(); ctx.ellipse(x,y,w/2,h/2,0,0,6.284); ctx.stroke(); },
    rectangle:(x,y,w,h)=>{ stroke(); ctx.strokeRect(x,y,w,h); },
    linearPath:(pts)=>{ stroke(); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
                        for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.stroke(); }
  };
}
/* ---- the tutor's hand: every mark is drawn along its path, not stamped ---- */
const HAND = 0.62;            /* px per ms, roughly the pace of a real hand */
const HAND_FONT = '600 21px "Caveat","Segoe Script",system-ui,sans-serif';

function polyOf(m){
  if(m.k === 'line' || m.k === 'arrow') return [[m.x1,m.y1],[m.x2,m.y2]];
  if(m.k === 'tick')  return [[m.x+3,m.y+13],[m.x+10,m.y+21],[m.x+23,m.y+3]];
  if(m.k === 'cross') return [[m.x+3,m.y+3],[m.x+21,m.y+21],[m.x+21,m.y+3],[m.x+3,m.y+21]];
  return null;
}
function polyLen(p){
  let L = 0;
  for(let i=1;i<p.length;i++) L += Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]);
  return L;
}
function markDur(m){
  if(m.k === 'text')    return Math.max(260, m.lines.join('').length * 26);
  if(m.k === 'ellipse') return Math.min(950, Math.max(280, (Math.PI*(m.w+m.h)/2)/HAND));
  const p = polyOf(m);
  return p ? Math.min(900, Math.max(190, polyLen(p)/HAND)) : 280;
}
function alongPoly(p, t){
  const total = polyLen(p);
  let want = total * t;
  for(let i=1;i<p.length;i++){
    const L = Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]);
    if(want <= L || i === p.length-1){
      const f = L ? Math.min(1, want/L) : 1;
      return { x:p[i-1][0] + (p[i][0]-p[i-1][0])*f, y:p[i-1][1] + (p[i][1]-p[i-1][1])*f };
    }
    want -= L;
  }
  return { x:p[p.length-1][0], y:p[p.length-1][1] };
}
function markPoint(ctx, m, t){
  if(m.k === 'ellipse'){
    const a = -Math.PI/2 + t*Math.PI*2;
    return { x:m.x + Math.cos(a)*m.w/2, y:m.y + Math.sin(a)*m.h/2 };
  }
  if(m.k === 'text'){
    ctx.font = HAND_FONT;
    const n = Math.ceil(m.lines.join('').length * t);
    let idx = 0;
    for(let k=0;k<m.lines.length;k++){
      const len = m.lines[k].length;
      if(idx + len >= n || k === m.lines.length-1){
        const take = Math.max(0, Math.min(len, n - idx));
        return { x:m.x + ctx.measureText(m.lines[k].slice(0, take)).width, y:m.y + k*22 + 15 };
      }
      idx += len;
    }
  }
  const p = polyOf(m);
  return p ? alongPoly(p, t) : { x:m.x || m.x1 || 0, y:m.y || m.y1 || 0 };
}
/* Clip to the part of the path already travelled, so the finished rough stroke is
   revealed rather than redrawn. Redrawing a rough path every frame would jitter,
   because rough.js re-randomises whenever its endpoints move. */
function sweepClip(ctx, p, t){
  const total = polyLen(p);
  let want = total * t;
  const W = 15;
  ctx.beginPath();
  for(let i=1;i<p.length;i++){
    const ax = p[i-1][0], ay = p[i-1][1];
    const L = Math.hypot(p[i][0]-ax, p[i][1]-ay);
    if(L <= 0) continue;
    const f = Math.min(1, want/L);
    if(f <= 0) break;
    const bx = ax + (p[i][0]-ax)*f, by = ay + (p[i][1]-ay)*f;
    const dx = (bx-ax)/ (Math.hypot(bx-ax, by-ay) || 1), dy = (by-ay)/(Math.hypot(bx-ax, by-ay) || 1);
    const nx = -dy*W, ny = dx*W, ex = dx*W*0.6, ey = dy*W*0.6;
    ctx.moveTo(ax-ex+nx, ay-ey+ny);
    ctx.lineTo(bx+ex+nx, by+ey+ny);
    ctx.lineTo(bx+ex-nx, by+ey-ny);
    ctx.lineTo(ax-ex-nx, ay-ey-ny);
    ctx.closePath();
    want -= L;
    if(want <= 0) break;
  }
  ctx.clip();
}
function drawWhole(ctx, rc, m, o, col, upto){
  if(m.k === 'ellipse') rc.ellipse(m.x, m.y, m.w, m.h, o);
  else if(m.k === 'line') rc.line(m.x1, m.y1, m.x2, m.y2, o);
  else if(m.k === 'arrow'){
    rc.line(m.x1, m.y1, m.x2, m.y2, o);
    const ang = Math.atan2(m.y2-m.y1, m.x2-m.x1);
    rc.line(m.x2, m.y2, m.x2-11*Math.cos(ang-0.42), m.y2-11*Math.sin(ang-0.42), o);
    rc.line(m.x2, m.y2, m.x2-11*Math.cos(ang+0.42), m.y2-11*Math.sin(ang+0.42), o);
  }
  else if(m.k === 'tick') rc.linearPath([[m.x+3,m.y+13],[m.x+10,m.y+21],[m.x+23,m.y+3]], o);
  else if(m.k === 'cross'){ rc.line(m.x+3,m.y+3,m.x+21,m.y+21,o); rc.line(m.x+21,m.y+3,m.x+3,m.y+21,o); }
  else if(m.k === 'text'){
    if(m.boxed) rc.rectangle(m.x-6, m.y-4, (m.box[2]-m.box[0])+12, (m.box[3]-m.box[1])+8, {...o, roughness:1.8});
    ctx.fillStyle = col;
    ctx.font = HAND_FONT;
    ctx.textBaseline = 'top';
    const n = upto === undefined ? Infinity : upto;
    let idx = 0;
    m.lines.forEach((ln, k)=>{
      const take = Math.max(0, Math.min(ln.length, n - idx));
      if(take > 0) ctx.fillText(ln.slice(0, take), m.x, m.y + k*22);
      idx += ln.length;
    });
  }
}
/* a pencil at the tip, so the mark is visibly being written by someone */
function drawPencil(ctx, x, y, col){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(0.5);                       /* held up and to the right */
  ctx.fillStyle = col;
  ctx.beginPath();                       /* nib */
  ctx.moveTo(0,0); ctx.lineTo(-3.6,-8); ctx.lineTo(3.6,-8); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = .9;                  /* barrel */
  ctx.beginPath();
  ctx.moveTo(-3.6,-8); ctx.lineTo(-3.6,-27); ctx.lineTo(3.6,-27); ctx.lineTo(3.6,-8);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = .45;                 /* end */
  ctx.beginPath();
  ctx.moveTo(-3.6,-27); ctx.lineTo(3.6,-27); ctx.lineTo(0,-32); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawAnnos(ctx, scrollTop){
  const col = red(), now = performance.now(), still = C.reducedMotion();
  const rc = pen(ctx, col);
  let more = false, tip = null;
  ctx.save();
  for(const a of S.annos){
    if(!a.durs) a.durs = a.marks.map(markDur);
    let start = a.t0;
    for(let i=0;i<a.marks.length;i++){
      const m = a.marks[i], dur = a.durs[i] || 260;
      const t = still ? 1 : (now - start)/dur;
      start += dur + 70;
      if(t <= 0){ more = true; continue; }        /* its turn has not come yet */
      const p = Math.min(1, t);
      if(p < 1){ more = true; tip = markPoint(ctx, m, p); }
      const o = { stroke:col, strokeWidth:1.6, roughness:1.5, seed:seed(a.id)+i, bowing:1.2 };
      try{
        if(p >= 1 || m.k === 'text'){
          drawWhole(ctx, rc, m, o, col, m.k === 'text' && p < 1
            ? Math.ceil(m.lines.join('').length * p) : undefined);
        } else {
          ctx.save();
          if(m.k === 'ellipse'){
            const R = Math.max(m.w, m.h);
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.arc(m.x, m.y, R, -Math.PI/2, -Math.PI/2 + Math.max(0.001, p)*Math.PI*2);
            ctx.closePath();
            ctx.clip();
          } else {
            const poly = polyOf(m);
            if(poly) sweepClip(ctx, poly, p);
          }
          drawWhole(ctx, rc, m, o, col);
          ctx.restore();
        }
      }catch(e){}
    }
  }
  ctx.restore();
  if(tip) drawPencil(ctx, tip.x, tip.y, col);
  animating = more;
  if(more) requestAnimationFrame(()=>N.ink.renderAI());
}

/* ---- asking ---- */
const LEVELS = ['nudge','hint','next step','full solution'];
let level = 0, lastQuestion = '';
async function ask(question, lv){
  level = lv === undefined ? 0 : Math.max(0,Math.min(3,lv));
  lastQuestion = question || lastQuestion || 'help';
  try{
    const out = N.localMath.help(lastQuestion,level,S.nodes||[]);
    clearAnnos('tutor');
    if(out.ops.length) addAnno(out.ops,'tutor');
    reply(esc(out.say));speak(out.say);ladder('answered');
  }catch(e){reply('the maths helper could not check that expression. try typing it again.',true);ladder('idle');}
}
function reply(html, sys){
  const bar = $('#askbar'), r = $('#reply');
  r.innerHTML = html || '';
  r.classList.toggle('sys', !!sys);
  bar.classList.toggle('has-reply', !!html);
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function ladder(mode){
  const el = $('#ladder'), bar = $('#askbar');
  el.innerHTML = '';
  if(mode === 'thinking'){ bar.classList.remove('has-rungs'); return; }
  const mk = (label, cls, fn)=>{
    const b = document.createElement('button');
    b.className = cls; b.textContent = label; b.onclick = fn; el.appendChild(b);
  };
  /* one rung at a time: the next step down, never the whole staircase */
  if(mode === 'answered' && lastQuestion && level < LEVELS.length-1)
    mk(LEVELS[level+1], 'rung', ()=>ask(lastQuestion, level+1));
  mk('check my work', 'quiet', checkWork);
  if(mode === 'answered') mk('clear marks', 'quiet', ()=>clearAnnos('tutor'));
  if(mode === 'answered' && lastQuestion){
    const d = document.createElement('span');
    d.className = 'depth';
    d.title = 'how much of the answer has been shown';
    for(let i=0;i<LEVELS.length;i++){
      const s = document.createElement('i');
      if(i <= level) s.className = 'on';
      d.appendChild(s);
    }
    el.appendChild(d);
  }
  bar.classList.add('has-rungs');
}

/* ---- check my work: the model points, the CAS confirms ---- */
function verifyPair(a,b){return N.localMath.verifyPair(a,b);}
async function checkWork(){
  const selected=new Set(S.selection||[]),all=S.nodes||[];
  const steps=all.filter(n=>(selected.size<2||selected.has(n.id))&&n.src&&!n.ref?.review&&!n.ref?.needsConfirmation&&N.mathcore.looksLikeMath(n.src));
  if(steps.length<2)return reply('write at least two steps and confirm any handwriting first.');
  const bad=[];let checked=0,unknown=0;
  for(let i=1;i<steps.length;i++){
    const previous=steps[i-1],next=steps[i];
    const separated=selected.size<2&&(all.indexOf(next)!==all.indexOf(previous)+1||Math.abs((next.y||0)-(previous.y||0))>C.LINE_H*2.5||Math.abs((next.x||0)-(previous.x||0))>100);
    const valid=separated?null:verifyPair(previous.src,next.src);
    if(valid===false)bad.push(i);
    else if(valid===true)checked++;
    else unknown++;
  }
  clearAnnos('tutor');
  if(bad.length){
    const i=bad[0];
    addAnno([{op:'circle',target:steps[i].id},{op:'label',target:steps[i].id,text:'check this step'}],'tutor');
    return reply('step '+(i+1)+' does not agree with the line above. check the operation on both sides.');
  }
  if(unknown)return reply('verified '+checked+' of '+(steps.length-1)+' transitions. the remaining '+unknown+' are outside what the local checker supports.');
  addAnno([{op:'tick',target:steps.at(-1).id}],'tutor');
  reply('all '+checked+' step transitions agree.');
}
// Browser speech recognition may upload audio. This offline build has no microphone.
function listen(){}
let speechRequest=0,clearSpeech=()=>{};
function speak(t){
  const request=++speechRequest;clearSpeech();
  if(!S.settings.voice||!t||!window.speechSynthesis)return;
  const synth=speechSynthesis,note=S.id;
  synth.cancel();
  const lang=/[\uac00-\ud7af]/u.test(t)?'ko':/[\u3040-\u30ff]/u.test(t)?'ja':/[\u3400-\u9fff\uf900-\ufaff]/u.test(t)?'zh':'en';
  let timer,watch,started=false;
  const cleanup=()=>{clearTimeout(timer);clearInterval(watch);synth.removeEventListener('voiceschanged',play);};
  const play=()=>{
    if(request!==speechRequest||S.id!==note||!S.settings.voice){cleanup();return;}
    if(started)return;
    const voice=synth.getVoices().find(v=>v.localService&&v.lang.toLowerCase().startsWith(lang));
    if(!voice)return;
    started=true;clearTimeout(timer);synth.removeEventListener('voiceschanged',play);
    const utterance=new SpeechSynthesisUtterance(t);utterance.lang=voice.lang||lang;utterance.voice=voice;
    utterance.onend=cleanup;utterance.onerror=cleanup;synth.speak(utterance);
  };
  clearSpeech=cleanup;
  synth.addEventListener('voiceschanged',play);
  timer=setTimeout(cleanup,2000);
  watch=setInterval(()=>{if(S.id!==note||!S.settings.voice){cleanup();synth.cancel();}},100);
  play();
}

N.tutor = { drawAnnos, addAnno, clearAnnos, ask, checkWork, listen, speak, reply, ladder,
            hasVoice:false, findSpace, occupancy, place, verifyPair, LEVELS };
})();
</script>

<script>
/* =========================================================================
   PLOT - a small graph card in the margin, with a slider per free parameter
   ========================================================================= */
(function(){
'use strict';
const C = N.core, S = C.S, M = C.M, $ = C.$;
const cards = new Map();
const marginEl = $('#margin');

function card(node, top){
  let el = cards.get(node.id);
  if(!el){
    el = document.createElement('div');
    el.className = 'plot';
    el.innerHTML = '<canvas role="img"></canvas><div class="plot-desc"></div><div class="plot-error" hidden></div><div class="sliders"></div>';
    marginEl.appendChild(el);
    cards.set(node.id, el);
    el.addEventListener('pointerdown', e=>e.stopPropagation());
  }
  /* the card fills the margin; a narrowed margin gets a smaller graph rather
     than one that hangs past the paper's edge and puts a sideways scroll on
     a phone */
  const w = Math.max(84, Math.min(M.marginW - 16, M.colW - (M.contentW + 14) - 2)), h = Math.round(w*0.78);
  el.style.top = top+'px';
  el.style.left = (M.contentW + 14)+'px';
  el.style.width = w+'px';
  const cv = el.querySelector('canvas');
  const dpr = M.dpr;
  /* assigning width clears a canvas, so only do it when the size changed */
  const cw = Math.floor(w*dpr), ch = Math.floor(h*dpr);
  if(cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; cv.style.height = h+'px'; cv._drawKey = ''; }

  const vals = node.plot.vals || (node.plot.vals = {});
  const box = el.querySelector('.sliders');
  const want = node.plot.params.join(',');
  if(box.dataset.for !== want){
    box.dataset.for = want; box.innerHTML = '';
    for(const p of node.plot.params){
      vals[p] = typeof vals[p]==='number'&&Number.isFinite(vals[p]) ? Math.max(-5,Math.min(5,vals[p])) : 1;
      const row = document.createElement('label');
      row.className = 'sl';
      row.innerHTML = '<span></span><input type="range" min="-5" max="5" step="0.1"><span class="v"></span>';
      row.firstElementChild.textContent=p;row.querySelector('input').value=String(vals[p]);row.querySelector('.v').textContent=String(vals[p]);
      const inp = row.querySelector('input'), out = row.querySelector('.v');
      inp.setAttribute('aria-label','graph parameter '+p);
      inp.addEventListener('input', ()=>{
        vals[p] = parseFloat(inp.value); out.textContent = inp.value;
        C.markDirty();
        /* one redraw per frame however fast the slider moves */
        if(!el._raf) el._raf = requestAnimationFrame(()=>{ el._raf = 0; paintGraphMeta(el,cv,node,w,h,dpr); });
      });
      box.appendChild(row);
    }
  }
  paintGraphMeta(el,cv,node,w,h,dpr);
  return el;
}
function drop(id){ const el = cards.get(id); if(el){ el.remove(); cards.delete(id); } }
function keep(ids){ for(const id of [...cards.keys()]) if(!ids.has(id)) drop(id); }

function paintGraphMeta(el,cv,node,w,h,dpr){
  const meta=draw(cv,node,w,h,dpr);
  if(!meta)return;
  const desc=el.querySelector('.plot-desc'),err=el.querySelector('.plot-error');
  const range='x −10 to 10, y '+fmtAxis(meta.lo)+' to '+fmtAxis(meta.hi);
  const samples=meta.samples&&meta.samples.length?' · '+meta.samples.map(p=>'y('+p.x+') = '+fmtAxis(p.y)).join(', '):'';
  desc.textContent=range+samples;
  err.hidden=!meta.error;err.textContent=meta.error||'';
  cv.setAttribute('aria-label','graph of y = '+node.plot.expr+'. '+range+samples+(meta.error?'. '+meta.error:''));
}
function fmtAxis(v){
  if(!Number.isFinite(v))return '?';
  /* short, but never "1.2e+3": big values are rounded to whole numbers,
     small ones keep their first two meaningful digits */
  const a=Math.abs(v);
  if(a>=1000)return String(Math.round(v));
  if(a<.01&&a!==0)return v.toFixed(Math.min(20,1-Math.floor(Math.log10(a)))).replace(/0+$/,'');
  return String(Math.round(v*100)/100);
}
/* what a redraw depends on, so an unchanged graph is not recomputed on every
   keystroke elsewhere on the page */
function drawKey(node, w, h, dpr){
  const sc = S.scope || {}; let sig = '';
  for(const k of Object.keys(sc)){ const v = sc[k]; sig += k+'='+(typeof v === 'function' ? 'f' : String(v))+';'; }
  return node.plot.expr+'|'+JSON.stringify(node.plot.vals||{})+'|'+sig+'|'+w+'x'+h+'@'+dpr+'|'+S.settings.angle+'|'+(N.ink?N.ink.colors.blue:'');
}
function draw(cv, node, w, h, dpr){
  const key = drawKey(node, w, h, dpr);
  if(cv._drawKey === key && cv._drawMeta) return null;
  const x = cv.getContext('2d');
  x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,w,h);
  const cs = getComputedStyle(document.documentElement);
  const blue = cs.getPropertyValue('--blue').trim();
  const rule = cs.getPropertyValue('--rule').trim();

  const X0 = -10, X1 = 10;
  const pts = [];
  const scope = Object.assign(N.mathcore.baseScope(), S.scope || {}, node.plot.vals || {});
  let lo = Infinity, hi = -Infinity, firstError='';
  const expr=N.mathcore.normalize(node.plot.expr);
  let fn = null;
  try{ fn = N.mathcore.compileRaw(expr); }catch(e){ firstError=e?.message||String(e); }
  const at = xv => { scope.x = xv; return Number(fn.evaluate(scope)); };
  for(let i=0;i<=160;i++){
    const xv = X0 + (X1-X0)*i/160;
    let yv = NaN;
    if(fn) try{ yv = at(xv); }catch(e){ if(!firstError)firstError=e?.message||String(e); }
    if(isFinite(yv)){ lo = Math.min(lo, yv); hi = Math.max(hi, yv); }
    pts.push([xv, yv]);
  }
  const noFinite=!isFinite(lo)||!isFinite(hi);
  if(noFinite || lo === hi){ lo = -5; hi = 5; }
  const padY = (hi-lo)*0.12; lo -= padY; hi += padY;
  if(!Number.isFinite(hi-lo)){lo=-Number.MAX_VALUE/4;hi=Number.MAX_VALUE/4;}
  const sx = v => (v - X0)/(X1-X0)*w;
  const sy = v => h - (v - lo)/(hi - lo)*h;

  /* axes and a small numerical scale, since the page itself carries no grid */
  x.strokeStyle = rule; x.lineWidth = 1;
  x.beginPath(); x.moveTo(sx(0), 0); x.lineTo(sx(0), h); x.moveTo(0, sy(0)); x.lineTo(w, sy(0)); x.stroke();
  x.fillStyle=cs.getPropertyValue('--blue-quiet').trim();x.font='9px "IBM Plex Mono",monospace';
  x.textBaseline='top';
  for(const xv of [-10,-5,0,5,10]){
    const px=sx(xv);x.fillText(String(xv),Math.min(w-18,Math.max(1,px+2)),Math.min(h-11,Math.max(1,sy(0)+2)));
  }
  x.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const yv=lo+(hi-lo)*i/4,py=sy(yv);x.fillText(fmtAxis(yv),Math.min(w-34,Math.max(2,sx(0)+3)),Math.min(h-6,Math.max(6,py)));
  }

  x.strokeStyle = blue; x.lineWidth = 1.6; x.beginPath();
  let pen = false, prev = null;
  for(const [xv, yv] of pts){
    if(!isFinite(yv) || yv < lo - (hi-lo)*3 || yv > hi + (hi-lo)*3){ pen = false; prev = null; continue; }
    const py = sy(yv);
    /* break the path across an asymptote rather than drawing a vertical bar */
    if(prev !== null && Math.abs(py - prev) > h*0.8){ pen = false; }
    if(!pen){ x.moveTo(sx(xv), py); pen = true; } else x.lineTo(sx(xv), py);
    prev = py;
  }
  x.stroke();
  const samples=[];
  if(fn) for(const xv of [-5,0,5]){
    try{const yv=at(xv);if(Number.isFinite(yv))samples.push({x:xv,y:yv});}catch(e){}
  }
  const meta={lo,hi,samples,error:noFinite?('could not graph this expression.'+(firstError?': '+firstError:'')):''};
  cv._drawKey = key; cv._drawMeta = meta;
  return meta;
}

N.plot = { card, drop, keep, draw };
})();
</script>

<script>
/* =========================================================================
   UI - menu, notes, search, export, keyboard, photo drop
   ========================================================================= */
(function(){
'use strict';
const C = N.core, S = C.S, M = C.M, $ = C.$;
const sc = $('#scroller');

/* ---- overlays ---- */
let sheet = null;
let sheetReturnFocus = null;
const inertTargets=['#topbar','#scroller','#pill','#penpop','#textpop','#askbar','#ask-dot','#offline-status','#local-status','#selbar','#library'];
function setMainInert(on){
  /* a panel closing over the notes page or drawer leaves the page behind
     them as it found it: still out of reach */
  const lib=!!(N.library&&N.library.modal);
  for(const sel of inertTargets){const el=document.querySelector(sel);if(el)el.inert=!!on||(lib&&sel!=='#library');}
}
/* The leading <h2> of every panel becomes a fixed header carrying the close
   button; everything after it scrolls. Callers keep passing one flat string. */
/* opts.fit: a short list of actions, as tall as its rows rather than 60% of
   the screen */
function openSheet(html, opts=false){
  closeSheet(true);                     /* one panel replacing another swaps at once */
  sheetReturnFocus=document.activeElement instanceof HTMLElement?document.activeElement:null;
  const m = /^\s*<h2>([\s\S]*?)<\/h2>/.exec(html);
  const heading = m ? m[1] : '';
  const rest = m ? html.slice(m[0].length) : html;
  sheet = document.createElement('div');
  sheet.className = opts===true ? 'sheet notes-sheet' : (opts && opts.fit ? 'sheet fit' : 'sheet');
  const headingId='sheet-title-'+C.uid();
  sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.setAttribute('aria-labelledby',headingId);
  sheet.innerHTML =
    '<div class="box">' +
      '<button class="notes-grab" type="button" aria-label="expand panel" aria-expanded="false" title="drag to resize; drag down to close"></button>' +
      '<div class="head"><h2 id="'+headingId+'">'+heading+'</h2>' +
        '<button class="sheet-x" type="button" title="close" aria-label="close">' +
          '<i class="ph ph-x"></i><span class="fb" hidden>esc</span></button>' +
      '</div>' +
      '<div class="body">'+rest+'</div>' +
    '</div>';
  /* a click on the paper behind, not a press: a scroll that starts on the
     backdrop should not dismiss the panel */
  let backdropPress = false;
  sheet.addEventListener('pointerdown', e=>{ backdropPress = e.target === sheet; });

/* Handwriting search is intentionally tolerant of small recognition mistakes.
   Short words stay exact because one changed letter there is too ambiguous. */
function searchText(s){

function editLimit(word){

function distanceWithin(a,b,limit){
  const aa=Array.from(a),bb=Array.from(b);
  if(Math.abs(aa.length-bb.length)>limit)return limit+1;
  let prev=Array.from({length:bb.length+1},(_,i)=>i);
  for(let i=1;i<=aa.length;i++){
    const cur=[i];let rowMin=i;
    for(let j=1;j<=bb.length;j++){
      const v=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(aa[i-1]===bb[j-1]?0:1));
      cur[j]=v;rowMin=Math.min(rowMin,v);
    }
    if(rowMin>limit)return limit+1;
    prev=cur;
  }

}
function fuzzyHandwriting(query,raw){
  const q=searchText(query), text=searchText(raw);
  if(!q||!text)return null;
  if(text.includes(q))return {score:0};
  /* Chinese, Japanese and Thai are written without spaces, so a query in
     those scripts is matched character by character across the whole line
     rather than against words that do not exist. */
  const spaceless=!q.includes(' ')&&(!text.includes(' ')||/[^\x00-\x7f]/.test(q));
  if(spaceless){
    const qa=Array.from(q),ta=Array.from(text.replace(/ /g,'')),limit=editLimit(q);
    if(!limit)return null;
    let best=Infinity;
    for(let width=Math.max(1,qa.length-limit);width<=qa.length+limit;width++){
      for(let at=0;at+width<=ta.length;at++)best=Math.min(best,distanceWithin(q,ta.slice(at,at+width).join(''),limit));
    }
    return best<=limit?{score:best}:null;
  }

  if(qw.length>tw.length)return null;
  let best=Infinity;
  for(let at=0;at<=tw.length-qw.length;at++){
    let total=0,ok=true;
    for(let i=0;i<qw.length;i++){
      const limit=editLimit(qw[i]),d=distanceWithin(qw[i],tw[at+i],limit);
      if(d>limit){ok=false;break;}

}
function searchHit(doc,q){
  const nq=searchText(q);if(!nq)return null;
  if(searchText(doc.title||'').includes(nq))return {score:0,kind:'title',label:''};
  for(const line of doc.lines||[]){
    const raw=line.text||'';
    if(searchText(raw).includes(nq))return {score:1,kind:'typed',label:raw};
  }
  let best=null;
  // Prefer the dedicated handwriting-text recogniser. Its raw output is the
  // label shown beside the note, even when fuzzy matching recovered a likely
  // OCR mistake such as "hillo" for a search for "hello".
  for(const t of doc.textTranscripts||[]){
    const raw=t.text||'';
    const m=fuzzyHandwriting(q,raw);if(!m)continue;
    const hit={score:2+m.score,kind:'handwriting',label:raw};
    if(!best||hit.score<best.score)best=hit;
  }
  if(best)return best;
  // Older notes may only have the maths recogniser's transcript. Keep that as
  // a lower-priority compatibility fallback until the note is opened/re-read.
  for(const t of doc.transcripts||[]){
    const raw=t.ascii||t.latex||'';
    const m=fuzzyHandwriting(q,raw);if(!m)continue;
    const hit={score:6+m.score,kind:'handwriting',label:raw};

  }

    S.images.forEach((im,index)=>{
      const row=document.createElement('div');row.className='note-row';

      row.innerHTML='<span class="t">image '+(index+1)+'</span><span class="d">'+Math.round(im.w)+'×'+Math.round(im.h)+'</span>'+
        '<button data-a="select">select</button><button data-a="left" aria-label="move image '+(index+1)+' left">←</button>'+
        '<button data-a="up" aria-label="move image '+(index+1)+' up">↑</button><button data-a="down" aria-label="move image '+(index+1)+' down">↓</button>'+
        '<button data-a="right" aria-label="move image '+(index+1)+' right">→</button><button data-a="small">smaller</button><button data-a="large">larger</button><button data-a="delete">delete</button>';
      row.querySelectorAll('button').forEach(b=>b.onclick=()=>{

        if(a==='left')N.ink.nudgeImage(im.id,-10,0);
        if(a==='up')N.ink.nudgeImage(im.id,0,-10);
        if(a==='down')N.ink.nudgeImage(im.id,0,10);
        if(a==='right')N.ink.nudgeImage(im.id,10,0);
        if(a==='small')N.ink.resizeImage(im.id,.85);
        if(a==='large')N.ink.resizeImage(im.id,1.18);
        if(a==='delete')N.ink.deleteImage(im.id);
        paint();
        /* Repainting updates dimensions and indices, but keyboard users should
           stay on the same action instead of being thrown back to <body>. */
        const nextRow=[...list.querySelectorAll('.note-row')].find(r=>r.dataset.imageId===im.id);

      });
