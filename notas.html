    <span class="pill-sep pill-x" aria-hidden="true"></span>
    <button class="pill-image pill-x" id="pill-image" type="button"><i class="ph ph-image-square" aria-hidden="true"></i>place image</button>
  </div>
  <button id="pill-more" type="button" aria-label="more tools" aria-expanded="false" title="more tools"><i class="ph ph-caret-right"></i><span class="fb">&rsaquo;</span></button>
</div>

<!-- The models popover: which model is arriving, under the download button. -->
<div id="dlpop" hidden role="dialog" aria-label="models" tabindex="-1"><h2>models</h2><div class="dl-list"></div></div>
<!-- The pen's own popover: a second tap on the pen opens it above the pill. -->

    <button class="tool swatch" data-color="#2E8B57" aria-label="ink, green" aria-pressed="false" title="green"><i style="--c:#2E8B57"></i></button>
    <button class="tool swatch" data-color="#E08A1E" aria-label="ink, orange" aria-pressed="false" title="orange"><i style="--c:#E08A1E"></i></button>

  </div>
  <div class="penpop-row">
    <button class="tool width" data-w="1.5" aria-label="thin line" aria-pressed="false" title="thin"><i style="--d:4px"></i></button>
    <button class="tool width" data-w="2.4" aria-label="medium line" aria-pressed="true" title="medium"><i style="--d:7px"></i></button>
    <button class="tool width" data-w="4" aria-label="thick line" aria-pressed="false" title="thick"><i style="--d:11px"></i></button>
  </div>
</div>

<!-- AI hint launcher intentionally hidden for now. Keep this markup and the
     implementation below so it can be restored without rebuilding the feature.
<button id="ask-dot" title="ask for a maths hint">&#10022;</button>

    <span class="mark" aria-hidden="true">&#10022;</span>

  </div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="tutorial-text" class="sr-only" role="status" aria-live="polite"></div>
<div id="page-accessible" class="sr-only" role="region" aria-label="notebook contents"></div>

<script>
/* Namespace and error guard. Each subsystem below lives in its own script tag
   so that a syntax error in one cannot take the whole app down. */
window.N = { ready:{}, libs:{} };
/* This banner had no timer, so the one thing every user saw after any error
   was a permanent "Something broke" that nothing could dismiss - including for
   failures the app had already recovered from by itself. It now clears like
   every other message, and says what actually went wrong. */
var brokeTimer = null;
window.addEventListener('error', function(e){
  try{
    var t = document.getElementById('toast');
    var why = (e && e.message) ? String(e.message).replace(/^Uncaught\s+/,'') : '';
    t.textContent = why
      ? 'something broke, ' + why + '. your notes are safe.'
      : 'something broke. your notes are safe, export them from the menu.';
    t.classList.add('in');
    clearTimeout(brokeTimer);
    brokeTimer = setTimeout(function(){ t.classList.remove('in'); }, 8000);
  }catch(_){}
  console.error(e.error || e.message);
});
</script>

<script>
/* =========================================================================
   CORE - state, storage, layout metrics, undo, toast
   ========================================================================= */
(function(){
'use strict';

/* Optional school feedback link. Recognition runs on this device. */
const FEEDBACK_URL = '';

const CONTENT_MAX = 720, MARGIN_MAX = 220, LINE_H = 30;
/* A phone is narrower than the sheet. Rather than let every line run off the
   right edge, both columns give up width together down to these floors: a
   text column still wide enough to read a sentence in, and a margin still
   wide enough for an answer chip. */
const CONTENT_MIN = 200, MARGIN_MIN = 96, COL_GUTTER = 12;

const S = {
  id:null, title:'untitled', created:0, updated:0,
  strokes:[], lines:[], images:[], annos:[],
  clusters:[], nodes:[], textTranscripts:[],
  tool:'text', lastTool:'pen',
  settings:{ angle:'deg', fractions:false, aiOn:true, theme:'auto', voice:false, recognizer:'ink', touchDraw:true },
  docH:1600, dirty:false, selection:[], imageSelection:null, savedRev:0, remoteRev:0
};

/* zoom is a view property like scroll position: it scales the column, the ink
   and the text together, and is remembered per note alongside the scroll */
const M = { colW:940, contentW:720, marginW:220, colLeft:0, vw:0, vh:0, dpr:1, zoom:1 };
const ZOOM_MIN = 0.5, ZOOM_MAX = 3;

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const $ = s => document.querySelector(s);

/* S.strokes is searched by id from a dozen places, several of them inside
   loops over the strokes themselves. The map is rebuilt lazily whenever the
   array is replaced or grows, so callers never have to keep it in step. */
let strokeMap = null, strokeMapFor = null, strokeMapLen = -1;
function strokeById(id){
  if(strokeMapFor !== S.strokes || strokeMapLen !== S.strokes.length){
    strokeMap = new Map(); for(const s of S.strokes) strokeMap.set(s.id, s);
    strokeMapFor = S.strokes; strokeMapLen = S.strokes.length;
  }
  return strokeMap.get(id);
}
const reducedMotion = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };

const APP_PREF_KEYS = ['theme','touchDraw','voice','recognizer'];
function appPrefs(){
  try{ return JSON.parse(localStorage.getItem('notas.prefs')||'{}')||{}; }catch(e){ return {}; }
}
function savePrefs(){
  const out={};for(const k of APP_PREF_KEYS)out[k]=S.settings[k];
  try{ localStorage.setItem('notas.prefs',JSON.stringify(out)); }catch(e){}
}
/* read back with only the settings this version has: one a past version
   stored and this one no longer offers is dropped from storage as well */
function applyPrefs(){
  const stored=appPrefs(),kept={};
  for(const k of APP_PREF_KEYS)if(k in stored)kept[k]=stored[k];
  Object.assign(S.settings,kept);
  if(Object.keys(stored).some(k=>!APP_PREF_KEYS.includes(k)))try{ localStorage.setItem('notas.prefs',JSON.stringify(kept)); }catch(e){}
}
function noteSettings(){
  const out={};for(const [k,v] of Object.entries(S.settings))if(!APP_PREF_KEYS.includes(k))out[k]=v;
  return out;
}
/* The device remembers the last note for the next visit; this tab remembers
   its own, so reloading here does not jump to whatever another tab opened. */
function setActive(id){
  try{ id?localStorage.setItem('notas.active',id):localStorage.removeItem('notas.active'); }catch(e){}
  try{ id?sessionStorage.setItem('notas.active',id):sessionStorage.removeItem('notas.active'); }catch(e){}
}
function getActive(){
  try{ const own=sessionStorage.getItem('notas.active'); if(own) return own; }catch(e){}
  try{ return localStorage.getItem('notas.active')||''; }catch(e){ return ''; }
}
/* localStorage writes are synchronous. The scroll position used to be written
   on every scroll event, which is exactly when the main thread can least
   afford it; it is now coalesced and written once the view settles. */
let viewTimer = null, viewPending = null;
function saveView(id,top,left,zoom){
  if(!id) return;
  viewPending = {id, view:{scrollTop:top||0, scrollLeft:left||0, zoom:zoom||M.zoom||1}};
  if(viewTimer) return;
  viewTimer = setTimeout(flushView, 250);
}
function flushView(){
  clearTimeout(viewTimer); viewTimer = null;
  const p = viewPending; viewPending = null;
  if(!p) return;
  try{ localStorage.setItem('notas.view.'+p.id, JSON.stringify(p.view)); }catch(e){}
}
function getView(id){ flushView(); try{ return JSON.parse(localStorage.getItem('notas.view.'+id)||'null'); }catch(e){ return null; } }

/* ---- storage: idb-keyval when present, localStorage as the safety net ---- */
const Store = {
  async get(k){
    // A fallback copy is authoritative, including a null deletion tombstone.
    try{ const v = localStorage.getItem(k); if(v !== null) return JSON.parse(v) ?? undefined; }catch(e){}
    try{ if(window.idbKeyval) return await idbKeyval.get(k); }catch(e){}
  },
  async set(k,v){
    let fallback = false;
    try{ fallback = localStorage.getItem(k) !== null; }catch(e){}
    if(fallback){
      try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; }
    }
    try{ if(window.idbKeyval){ await idbKeyval.set(k,v); return true; } }catch(e){}
    try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; }
  },
  async del(k){
    try{ if(window.idbKeyval) await idbKeyval.del(k); }
    catch(e){
      try{ localStorage.setItem(k, 'null'); return true; }catch(e){ return false; }
    }
    try{ localStorage.removeItem(k); return true; }catch(e){ return false; }
  },
  async index(){ return (await Store.get('notas.index')) || []; },
  async putIndex(ix){ return await Store.set('notas.index', ix); }
};

/* the first typed line, for a note that was never named */
function firstLine(lines){
  const ln = (lines || []).slice().sort((a,b)=>a.y-b.y).find(l=>l.text && l.text.trim());
  return ln ? ln.text.trim().replace(/\s+/g,' ').slice(0, 60) : '';
}
/* what a note is called on screen: its name, or its first line until it has one */
function displayTitle(title, lines){
  return title && title !== 'untitled' ? title : (firstLine(lines) || 'untitled');
}
/* a page with nothing on it and no name: not yet a note */
function isBlank(){
  return !S.strokes.length && !S.images.length && (!S.title || S.title === 'untitled') && S.lines.every(l=>!l.text);
}
/* "today", "yesterday", then the date, so a list of notes reads as a diary */
function whenLabel(t){
  const d = new Date(t || 0), now = new Date();
  const day = x=>new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  if(diff === 0) return 'today';
  if(diff === 1) return 'yesterday';
  if(diff < 7) return d.toLocaleDateString(undefined, {weekday:'long'});
  return d.toLocaleDateString(undefined, d.getFullYear() === now.getFullYear() ? {day:'numeric', month:'short'} : {day:'numeric', month:'short', year:'numeric'});
}
function serialize(){
  const sc=$('#scroller');
  return {
    id:S.id, title:S.title, created:S.created, updated:Date.now(),
    rev:S.savedRev||0, settings:noteSettings(), docH:S.docH,
    view:{scrollTop:sc?sc.scrollTop:0,scrollLeft:sc?sc.scrollLeft:0},
    /* a stroke nota is still writing is saved whole: the reveal is not ink */
    strokes:S.strokes.map(st=>st._show===undefined?st:(({_show,...rest})=>rest)(st)),
    /* a reply line still waiting for its first word is saved as plain text */
    lines:S.lines.map(l=>l.wait?(({wait,...rest})=>rest)(l):l), images:S.images,
    /* transcriptions are persisted so search can reach handwriting offline */
    localVersion:2,
    answers:N.mathcore ? N.mathcore.savedAnswers() : [],
    transcripts:S.clusters.filter(c=>c.latex||c.ascii||c.asked).map(c=>({hash:c.hash, latex:c.latex, ascii:c.ascii, kind:c.kind, modelVersion:c.modelVersion, alternatives:c.alternatives||[], confirmed:!!c.confirmed, needsConfirmation:!!c.needsConfirmation, confidence:c.confidence||0, asked:!!c.asked, ...(c.dismissed?{dismissed:true}:{}), plotVals:c._plotVals||null})),
    /* PP-OCRv6 prose readings are hidden search metadata. They never replace
       ink or feed the maths evaluator, and the raw reading is kept so search
       can show exactly what the text recogniser saw. */
    textTranscripts:(S.textTranscripts||[]).map(t=>({hash:t.hash,text:t.text,confidence:t.confidence||0,modelVersion:t.modelVersion,...(t.asked?{asked:true}:{})}))
  };
}

let saveTimer = null, saveQueue = Promise.resolve(), revision = 0;
const locallyWrittenRevs=new Map();
/* Web Locks is the simplest cross-tab mutex. Browsers without it still have
   IndexedDB, so idb-keyval's atomic update() gives us a small lease record that
   serializes the same critical section across tabs. This is materially different
   from a same-tab Promise queue: the revision check and write cannot both pass in
   two pages at once, and delete/save races cannot resurrect a canonical note. */
async function withIdbNoteLock(id,fn){
  const kv=window.idbKeyval;
  if(!kv||typeof kv.update!=='function')return fn();
  const key='notas.lock.'+id,token=uid()+Math.random().toString(36).slice(2),leaseMs=30000;
  for(;;){
    let won=false;
    try{
      const now=Date.now();
      await kv.update(key,old=>{
        if(!old||!old.token||Number(old.expires)<=now){won=true;return {token,expires:now+leaseMs};}
        return old;
      });
    }catch(e){return fn();}
    if(won){
      try{return await fn();}
      finally{
        try{await kv.update(key,old=>old&&old.token===token?null:old);}catch(e){}
      }
    }
    await new Promise(r=>setTimeout(r,20+Math.floor(Math.random()*30)));
  }
}
function withNoteLock(id, fn){
  const locks=navigator.locks;
  return locks&&typeof locks.request==='function'
    ? locks.request('notas-note-'+id,{mode:'exclusive'},fn)
    : withIdbNoteLock(id,fn);
}
async function deleteStoredNote(id){
  return withNoteLock(id,async()=>{
    const key='notas.note.'+id,current=await Store.get(key);
    if(!current)return true;
    const ix=await Store.index(),next=ix.filter(r=>r.id!==id);
    if(!await Store.del(key))return false;
    if(!await Store.putIndex(next)){
      await Store.set(key,current);return false;
    }
    await Store.del('notas.thumb.'+id);
    sync?.postMessage({id,deleted:true,rev:(current.rev||0)+1});
    return true;
  });
}
/* Library edits (move, pin, trash, restore) change index rows only. Each row
   is patched under its note's lock, the same one save() holds while it
   rewrites that row, so a move cannot be undone by an autosave in flight. */
async function patchIndexRows(ids, patch){
  let ok = true;
  for(const id of ids){
    ok = await withNoteLock(id, async()=>{
      const ix = await Store.index(), at = ix.findIndex(r=>r.id===id);
      if(at<0) return true;
      const next = {...ix[at], ...patch(ix[at])};
      for(const k of Object.keys(next)) if(next[k]===undefined) delete next[k];
      ix[at] = next;
      return await Store.putIndex(ix);
    }) && ok;
  }
  sync?.postMessage({index:true});
  return ok;
}
/* Browsers may evict IndexedDB under storage pressure unless the site asks
   to be kept. It is asked once, after the first note that is really saved. */
let persistAsked = false;
function askPersistence(){
  if(persistAsked) return; persistAsked = true;
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{}); }catch(e){}
}
const sync = typeof BroadcastChannel!=='undefined' ? new BroadcastChannel('notas-sync-v1') : null;
if(sync) sync.onmessage = e=>{
  const m=e.data||{};
  if(m.id===S.id&&(m.rev||0)>(S.savedRev||0)) S.remoteRev=Math.max(S.remoteRev||0,m.rev||0);
};
function markDirty(collabHint){
  revision++;
  S.dirty = true;
  N.collab && N.collab.changed(collabHint); /* a shared note mirrors the change out */
  if(saveTimer) return;
  const run = () => { saveTimer = null; save(); };
  saveTimer = (window.requestIdleCallback)
    ? requestIdleCallback(run, {timeout:1500})
    : setTimeout(run, 900);
}
let saveFailed = false;
async function save(opts){
  const announce = !!(opts && opts.announce);
  if(saveTimer !== null){
    if(window.requestIdleCallback) window.cancelIdleCallback(saveTimer); else clearTimeout(saveTimer);
    saveTimer = null;
  }
  if(!S.id) return true;
  /* A new note is nothing until something is written on it. Storing the
     blank page listed an "untitled" note for every glance at an empty one,
     so a note that has never been stored waits for its first mark. A
     shared note is the exception: the room is the reason it exists. */
  if(!S.savedRev && isBlank() && !(N.collab && N.collab.isShared(S.id))){ S.dirty = false; return true; }
  let doc;
  try{ doc = JSON.parse(JSON.stringify(serialize())); }catch(e){ console.error('serialize failed', e); return false; }
  const savedRevision = revision;
  const task = saveQueue.then(()=>withNoteLock(doc.id,async()=>{
    try{
      const current = await Store.get('notas.note.'+doc.id);
      const currentRev = current?.rev || 0;
      const expectedRev = doc.rev || 0;
      /* Two save triggers can snapshot the same local revision before the first
         queued write finishes (idle autosave + explicit save). If the newer
         stored revision is one this tab itself just wrote, this task is already
         satisfied and must not manufacture a conflict copy. */
      if(current&&currentRev>expectedRev&&(locallyWrittenRevs.get(doc.id)||0)>=currentRev){
        if(S.id===doc.id&&revision===savedRevision){S.dirty=false;S.savedRev=currentRev;S.remoteRev=0;if(announce||saveFailed)status('saved.');clearSaveError();setActive(doc.id);}
        return true;
      }
      const deletedElsewhere=!current&&expectedRev>0;
      let newerElsewhere=!!current&&(currentRev > expectedRev || (S.id===doc.id && (S.remoteRev||0)>expectedRev));
      /* A shared note is the same merged document in every tab that has it
         open, so a newer revision from another tab is not a rival version
         to keep apart: this write simply follows it. Forking made a
         "conflict copy" whenever a share link was opened beside the
         original. */
      if(newerElsewhere&&N.collab&&N.collab.isShared(doc.id)){ doc.rev=Math.max(currentRev,S.id===doc.id?(S.remoteRev||0):0); newerElsewhere=false; }
      if(deletedElsewhere||newerElsewhere){
        const conflictId=uid();
        const conflict={...doc,id:conflictId,title:(doc.title||'untitled')+(deletedElsewhere?' (recovered copy)':' (conflict copy)'),created:Date.now(),updated:Date.now(),rev:1};
        if(!await Store.set('notas.note.'+conflictId, conflict)) throw new Error('Conflict copy write failed');
        const cix=await Store.index();
        const was=cix.find(r=>r.id===doc.id);
        cix.unshift({id:conflictId,title:conflict.title,updated:conflict.updated,created:conflict.created,preview:firstLine(conflict.lines),...(was&&was.folder?{folder:was.folder}:{})});
        if(!await Store.putIndex(cix)) throw new Error('Conflict index write failed');
        locallyWrittenRevs.set(conflictId,1);
        if(S.id===doc.id && revision===savedRevision){
          S.id=conflictId; S.title=conflict.title; S.savedRev=1; S.remoteRev=0; S.dirty=false;
          $('#title').textContent=S.title; setActive(S.id); clearSaveError(); status('saved a conflict copy.');
          toast(deletedElsewhere?'this note was deleted in another tab. your work was saved as a recovered copy.':'this note changed in another tab. your version was saved as a conflict copy.',7000);
        }
        sync?.postMessage({id:conflictId,rev:1});
        return true;
      }
      doc.rev=Math.max(expectedRev,doc.rev||0)+1;
      if(!await Store.set('notas.note.'+doc.id, doc)) throw new Error('Note write failed');
      locallyWrittenRevs.set(doc.id,doc.rev);
      const ix = await Store.index();
      const row = { id:doc.id, title:doc.title, updated:doc.updated, created:doc.created, preview:firstLine(doc.lines) };
      const at = ix.findIndex(r=>r.id===doc.id);
      /* the library's own fields (folder, pinned, trashed) belong to the row,
         not to the note, so a save carries them over rather than dropping them */
      if(at<0){
        /* a note started from inside a folder is filed there on its first save */
        if(S.newFolder && S.newFolder.id===doc.id && S.newFolder.folder) row.folder = S.newFolder.folder;
        ix.unshift(row);
      } else ix[at] = {...ix[at], ...row};
      if(!await Store.putIndex(ix)) throw new Error('Index write failed');
      askPersistence();
      /* Autosave is silent. "Saved" flashing in the corner after every stroke
         was constant blinking while writing; it is only said when the student
         asked for a save, or when a save that had failed finally went through. */
      if(S.id===doc.id && revision===savedRevision){
        S.dirty=false; S.savedRev=doc.rev; S.remoteRev=0; if(announce||saveFailed) status('saved.'); clearSaveError(); setActive(doc.id);
      }
      sync?.postMessage({id:doc.id,rev:doc.rev});
      return true;
    }catch(e){ setSaveError(); toast('could not save. retry, or export a copy of this note.',7000); return false; }
  }));
  saveQueue = task;
  return task;
}

/* ---- undo: one stack across ink, text and tutor ink ---- */
const Undo = { back:[], fwd:[] };
/* Without hover there is no way to discover that a bar button does nothing,
   so both arrows say so by going dim whenever their stack is empty. */
function paintUndo(){
  const u = $('#btn-undo'), r = $('#btn-redo');
  if(u) u.disabled = !Undo.back.length;
  if(r) r.disabled = !Undo.fwd.length;
}
function act(label, redo, undo, collabHint){
  redo();
  Undo.back.push({label, redo, undo});
  if(Undo.back.length > 200) Undo.back.shift();
  Undo.fwd.length = 0;
  markDirty(collabHint); paintUndo();
}
function undo(){
  const e = Undo.back.pop(); if(!e) return;
  e.undo(); Undo.fwd.push(e); markDirty(); paintUndo();
  N.text && N.text.render(); N.recog && N.recog.rebuild();
  N.ink && N.ink.render(); N.mathcore && N.mathcore.run();
}
function redo(){
  const e = Undo.fwd.pop(); if(!e) return;
  e.redo(); Undo.back.push(e); markDirty(); paintUndo();
  N.text && N.text.render(); N.recog && N.recog.rebuild();
  N.ink && N.ink.render(); N.mathcore && N.mathcore.run();
}

/* ---- layout ---- */
function layout(){
  const sc = $('#scroller'); const r = sc.getBoundingClientRect();
  M.vw = r.width; M.vh = r.height; M.dpr = Math.min(window.devicePixelRatio||1, 2);
  /* The sheet is a fixed size on anything wide enough to hold it. Below that
     - a phone, a split window - it narrows to the screen instead, because a
     line you have to pan sideways to finish reading is not a line. The two
     columns shrink together so the answers stay beside the working. */
  const was = M.contentW;
  const room = Math.round(M.vw) - COL_GUTTER*2;
  if(room >= CONTENT_MAX + MARGIN_MAX){ M.contentW = CONTENT_MAX; M.marginW = MARGIN_MAX; }
  else {
    M.marginW = clamp(Math.round(room*0.3), MARGIN_MIN, MARGIN_MAX);
    M.contentW = Math.max(CONTENT_MIN, room - M.marginW);
  }
  M.colW = M.contentW + M.marginW;
  const z = M.zoom;
  M.colLeft = Math.max(12,Math.round((M.vw - M.colW*z)/2));
  const root = document.documentElement.style;
  root.setProperty('--col-w', M.colW+'px');
  root.setProperty('--content-w', M.contentW+'px');
  root.setProperty('--margin-w', M.marginW+'px');
  /* the column is laid out at its natural size and scaled from its top left,
     so the text layer, chips and plots all follow the zoom for free; the ink
     canvases apply the same scale in their own transform */
  const col = $('#col');
  col.style.marginLeft = M.colLeft+'px';
  col.style.transform = z === 1 ? '' : 'scale('+z+')';
  $('#doc').style.height = Math.round(S.docH*z)+'px';
  /* #col is scaled, so it takes the unscaled height. Its children are all
     absolutely placed, so without this it is zero high, and iPadOS hides the
     caret, the selection handles and the edit menu in an editing host whose
     visible box is empty (#lines fills #col). Not height:100% in CSS: #doc is
     already zoomed, and the scale would apply twice. */
  col.style.height = S.docH+'px';
  /* A narrowed column must not strand what a wider screen already wrote: the
     paper stays as wide as its furthest ink or picture, so old coordinates
     are still reachable by panning even though new lines wrap before them. */
  $('#doc').style.width = Math.max(M.vw,M.colLeft+Math.round(docExtent()*z)+12)+'px';
  if(M.contentW !== was){ N.text && N.text.relayout && N.text.relayout(); }
  else N.text && N.text.reflow && N.text.reflow();
  N.ink && N.ink.resize();
  /* the answers hang off the right of the text column, so a column that
     changed width has to place them again */
  if(M.contentW !== was) N.mathcore && N.mathcore.run();
}
/* how far right the note actually reaches, in page pixels */
function docExtent(){
  let x = M.colW;
  for(const st of S.strokes) if(st.bbox && st.bbox[2] > x) x = st.bbox[2];
  for(const im of S.images) if(im.x + im.w > x) x = im.x + im.w;
  return Math.ceil(x);
}
/* The paper only ever grows. It used to be set to whatever the caller
   asked for, so a text reflow after a zoom or an erase pulled the bottom
   edge back up to the last line of type and the page below the ink could
   not be reached until a fresh stroke pushed it out again. */
function growDoc(y){
  const want = Math.max(1600, Math.ceil((y + 700)/200)*200);
  if(want > S.docH){ S.docH = want; $('#doc').style.height = Math.round(want*M.zoom)+'px'; $('#col').style.height = want+'px'; }
}
/* Zoom about a screen point: the bit of paper under the fingers stays under
   the fingers. cx/cy are client coordinates; omitted means the viewport centre. */
function setZoom(z, cx, cy){
  z = clamp(+z || 1, ZOOM_MIN, ZOOM_MAX);
  if(Math.abs(z - M.zoom) < 0.0005) return false;
  const sc = $('#scroller'), r = sc.getBoundingClientRect();
  const px = cx === undefined ? r.width/2 : cx - r.left, py = cy === undefined ? r.height/2 : cy - r.top;
  const wx = (px - M.colLeft + sc.scrollLeft)/M.zoom, wy = (py + sc.scrollTop)/M.zoom;
  M.zoom = z;
  layout();

function effectiveTool(ev){
  if(ev.pointerType === 'pen' && (ev.buttons & 32)) return 'eraser';   /* pen flipped */
  return S.tool;
}
/* ---- writing through the chips ----
   An answer or a Solve offer sits right after the ink that produced it, which
   is exactly where the next symbol goes. The chip used to take the pen: the
   stroke never started and the tap opened the chip instead. With a drawing
   tool up the chips no longer take pointer input at all (see the CSS), so the
   pen lands on the paper. A tap that would have pressed a chip is still a
   press: the canvas sees where the pen went down and, if it lifts without
   moving, presses the chip itself. An open card keeps its own input. */
function chipTargetAt(cx, cy){
  for(const el of document.querySelectorAll('#margin .chip:not(.open):not(.explaining)')){
    const r = el.getBoundingClientRect();
    if(cx < r.left || cx > r.right || cy < r.top || cy > r.bottom) continue;
    for(const b of el.querySelectorAll('button')){
      const q = b.getBoundingClientRect();

function noteChipTap(ev){

    radius:kindOf(ev)==='pen'?12:8 } : null;

}
/* a tap, not a stroke or a scroll: the chip under the pointer is what was meant */
function chipTap(ev){
  const t = tapChip; tapChip = null;

  if(ev.type==='pointerup'&&Math.hypot(ev.clientX-t.x,ev.clientY-t.y)>t.radius)return false;
  /* A held pen tap is still a button press. Resolve the action by node ID:
     background painting can replace the original button before pen-up. */
  cur=null;clearLive();
  if(ev.type!=='pointerup')return true;
  if(t.solve)N.mathcore.requestSolve(t.node);

    const chip=[...document.querySelectorAll('#margin .chip')].find(el=>el.dataset.node===t.node);

}
/* a chip the pen writes across steps aside until the next paint, so the ink

function yieldChipsUnder(cx, cy){
  if(!chipRects) chipRects = [...document.querySelectorAll('#margin .chip:not(.open):not(.explaining)')].map(el=>({el, r:el.getBoundingClientRect()}));
  for(const c of chipRects){
    if(c.done) continue;
    const r = c.r, pad = 6;
    if(cx < r.left-pad || cx > r.right+pad || cy < r.top-pad || cy > r.bottom+pad) continue;

/* A pen tip lands within a pixel or two of where you aimed. A fingertip is
   about 9mm across and reports its centroid, so a 9px eraser under a finger
   misses the ink you were clearly rubbing out. 14 rather than more, because
   contact removes a whole stroke and too generous a radius takes the
   neighbouring glyph with it: the ring drawn below shows the reach. */
const ERASE_R = { pen:9, mouse:9, touch:14 };
/* Ink colour and width chosen from the pill tray. An empty colour means "the
   theme's graphite", which is why it is left off the stroke: those strokes
   keep following the theme, while a chosen colour is baked in. */
const pen = (()=>{
  try{ const v = JSON.parse(localStorage.getItem('notas.pen')||'{}'); return { color:String(v.color||''), w:+v.w || 2.4 }; }
  catch(e){ return { color:'', w:2.4 }; }
})();
function setPen(patch){
  Object.assign(pen, patch);
  try{ localStorage.setItem('notas.pen', JSON.stringify(pen)); }catch(e){}
  document.querySelectorAll('.tool.swatch').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.color === pen.color)));
  document.querySelectorAll('.tool.width').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.w === pen.w)));
}
function beginStroke(ev, tool){
  /* the eraser's reach is a size on the glass, not on the paper: zoomed in it
     should still cover about a fingertip */
  cur = { id:C.uid(), author:'user', tool:'pen', w:pen.w, pts:[], times:[], t0:inkNow(), _eventT0:Number(ev.timeStamp), erase:(tool==='eraser'),

/* Only what is new gets painted. The whole stroke used to be cleared and
   redrawn from its first point on every move, so a long underline or a big
   bracket got slower to follow the pen the longer it went on. */
function drawLive(){
  if(!cur) return;
  if(tapChip) return; // Keep tentative chip taps off the ink canvas.
  if(cur.erase){
    xInk.clearRect(-1e5,-1e5,2e5,2e5);
    drawEraser(xInk, cur);
    return;
  }
  const n = cur.pts.length/3;
  if(n < 2){ dot(xInk, cur); return; }
  drawSegments(xInk, cur, Math.max(1, cur.drawn));
  cur.drawn = n;
}
function commitStroke(){
  if(!cur){ TRACE && trace('commit', {pointerType:'-',pointerId:'-',button:'-',buttons:'-'}, 'NO STROKE to commit'); return; }
  const st = cur; cur = null;
  if(st.pts.length < 3){ clearLive(); TRACE && trace('commit', {pointerType:'-',pointerId:'-',button:'-',buttons:'-'}, 'DROPPED: too few points'); return; }
  st.t1 = inkNow(); delete st._eventT0; st.bbox = bboxOf(st.pts);

  if(st.erase){ clearLive(); TRACE && trace('commit', {pointerType:'pen',pointerId:'-',button:'-',buttons:'-'}, 'ERASE stroke, no ink drawn'); eraseAlong(st); return; }
  delete st.drawn;

  /* Scribbling something out used to delete it. No heuristic could tell a
     deliberate cross-out from a carefully drawn x or a shaky bar reliably
     enough, and the cost of guessing wrong is ink the student did not ask to
     lose. The eraser is one tap away and never guesses. */
  pendingLive = true;
  C.growDoc(st.bbox[3]);
  C.act('draw', ()=>{ S.strokes.push(st); }, ()=>{ S.strokes = S.strokes.filter(s=>s.id!==st.id); }, {stroke:st});
  const stamped=stampStroke(st);

  after(true,stamped);
}
/* The ink is painted now; grouping, reading and calculating wait for the
   next idle moment. Doing all of it inside pointerup was a stall at every pen
   lift on a full page, felt as the next stroke starting late. Explicit calls
   to N.recog.rebuild() and N.mathcore.run() stay synchronous. */
let afterHandle = 0;
function runAfter(){
  afterHandle = 0;

}
function after(deferred,alreadyPainted){
  if(!alreadyPainted)render();
  N.text && N.text.refreshPlaceholder && N.text.refreshPlaceholder();
  if(!deferred){ flush(); runAfter(); return; }
  if(afterHandle) return;
  afterHandle = window.requestIdleCallback ? requestIdleCallback(runAfter, {timeout:200}) : setTimeout(runAfter, 0);
}
function flush(){
  if(!afterHandle) return;

function eraseAlong(st){
  const before = S.strokes, afterStrokes = [];
  const p = st.pts, radius = st.eraseR || 9, bounds=bboxOf(p);
  const touched = (x,y,r)=>{
    if(x<bounds[0]-r||x>bounds[2]+r||y<bounds[1]-r||y>bounds[3]+r)return false;
    if(p.length===3)return Math.hypot(x-p[0],y-p[1])<=r;
    for(let j=3;j<p.length;j+=3)if(segDist(x,y,p[j-3],p[j-2],p[j],p[j+1])<=r)return true;
    return false;
  };
  for(const stroke of before){
    const b=stroke.bbox,r=radius+stroke.w/2;
    if((stroke.author!=='user'&&stroke.author!=='ai')||b[2]<bounds[0]-r||b[0]>bounds[2]+r||b[3]<bounds[1]-r||b[1]>bounds[3]+r){afterStrokes.push(stroke);continue;}
    // Contact anywhere on a stroke removes that whole handwritten stroke.
    const q=stroke.pts;let hit=touched(q[0],q[1],r);

      const count=Math.max(1,Math.ceil(Math.hypot(q[i]-q[i-3],q[i+1]-q[i-2])/1.5));

  if(!edits.length&&afterStrokes.length===before.length&&afterStrokes.every((s,i)=>s===before[i]))return;
  C.act('erase',
    ()=>{ S.strokes=afterStrokes;for(const e of edits){e.line.text=e.after;e.line.suppressAnswer=e.after;}N.text.render(); },
    ()=>{ S.strokes=before;for(const e of edits)e.line.text=e.before;N.text.render(); });

}

/* ---- the ink clock ----
   Strokes are stamped from a clock that stops while the pen cannot write:
   the text or select tool is up, or the tab is in the background. The
   reader groups ink into expressions partly by the pauses between strokes,
   and a detour to type a note in the middle of an equation looked like a
   long pause, so the half written before it and the half after were read as
   two expressions. Time spent typing is not time spent thinking about the
   ink, so it is simply left out. Only new strokes are stamped this way: the
   offset grows monotonically, so order is kept against everything already
   on the page, and the hash a reading is cached under never looks at time. */
let awayTotal = 0, awaySince = 0;
function inkNow(){ return Date.now() - awayTotal - (awaySince ? Date.now() - awaySince : 0); }
function penAway(){
  const away = document.hidden || !(S.tool === 'pen' || S.tool === 'eraser');
  if(away && !awaySince) awaySince = Date.now();
  else if(!away && awaySince){ awayTotal += Date.now() - awaySince; awaySince = 0; }
}
document.addEventListener('visibilitychange', penAway);

/* ---- tools ---- */
function setTool(t){
  if(t !== S.tool) S.lastTool = S.tool;
  S.tool = t;
  document.body.dataset.tool = t;
  penAway();
  document.querySelectorAll('.tool[data-tool]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.tool===t)));
  if(t !== 'select') clearSelection();
  if(t !== 'pen') setPenPop(false);
  /* picking the text tool does not grab a line: the caret lands where the
     next tap says, or stays wherever it already was */
}
function clearSelection(){ cropping=null; cropDrag=null; S.selection = [];S.imageSelection=null; $('#selbar').hidden = true; render(); }

/* ---- the pen popover: colours and widths, floating just above the pill ---- */
/* it closes on a tap anywhere else, on esc, and when another tool is picked */
const penPop = $('#penpop'), penBtn = document.querySelector('.tool[data-tool="pen"]');
function penPopOpen(){ return !penPop.hidden; }
function placePenPop(){
  const b = penBtn.getBoundingClientRect(), p = $('#pill').getBoundingClientRect(), w = penPop.offsetWidth;
  penPop.style.bottom = Math.round(innerHeight - p.top + 10)+'px';
  penPop.style.left = Math.round(Math.max(p.left, Math.min(innerWidth - w - 8, b.left + b.width/2 - w/2)))+'px';
}
function setPenPop(open){

document.addEventListener('pointerdown', e=>{ if(penPopOpen() && !penPop.contains(e.target) && !penBtn.contains(e.target)) setPenPop(false); }, true);
addEventListener('resize', ()=>{ if(penPopOpen()) placePenPop(); });

/* ---- selection ---- */
function selectionBox(){
  if(S.imageSelection){
    const im=S.images.find(i=>i.id===S.imageSelection);
    if(im)return [im.x,im.y,im.x+im.w,im.y+im.h];
  }
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const id of S.selection){
    const st = C.strokeById(id); if(!st) continue;
    a=Math.min(a,st.bbox[0]); b=Math.min(b,st.bbox[1]);
    c=Math.max(c,st.bbox[2]); d=Math.max(d,st.bbox[3]);
  }
  return [a,b,c,d];
}
/* Inside the selection means grab it; outside starts a new lasso. The padding
   matches the marquee so the dashed box you can see is the box you can grab. */
function hitSelection(x, y){
  if(!S.selection.length&&!S.imageSelection) return false;
  const b = selectionBox(), pad = 12;
  return x >= b[0]-pad && x <= b[2]+pad && y >= b[1]-pad && y <= b[3]+pad;
}
function imageAt(x,y){
  for(let i=S.images.length-1;i>=0;i--){const im=S.images[i];if(inImage(x,y,im))return im;}
  return null;
}
/* ---- the frame round whatever is selected ----
   A picture and a lasso's ink wear the same frame: a corner scales the
   thing about the corner opposite, and the knob standing off its top edge
   turns it. There are no arrow or bigger/smaller buttons for this; the
   hand does it on the page. The frame is described from its centre out, so
   a turned picture's corners are where the picture's corners are seen. */
const HANDLE_R=5, HANDLE_HIT=11, KNOB_REACH=30;
function frameOf(im,dx=0,dy=0){
  if(im) return {cx:im.x+dx+im.w/2, cy:im.y+dy+im.h/2, w:im.w, h:im.h, rot:im.rot||0};
  if(!S.selection.length) return null;
  const b=selectionBox(); if(b[0]>b[2]) return null;
  return {cx:(b[0]+b[2])/2+dx, cy:(b[1]+b[3])/2+dy, w:b[2]-b[0]+6, h:b[3]-b[1]+6, rot:0};
}
function framePoint(f,lx,ly){ const c=Math.cos(f.rot), s=Math.sin(f.rot); return {x:f.cx+lx*c-ly*s, y:f.cy+lx*s+ly*c}; }
function frameHandles(f){

function handleAt(x,y,f,touch){

function drawFrame(ctx,f){

  ctx.beginPath(); ctx.moveTo(0,-f.h/2-2); ctx.lineTo(0,-f.h/2-KNOB_REACH/M.zoom); ctx.stroke();   /* the stem up to the knob */
  ctx.restore();
  ctx.save(); ctx.fillStyle=colors.paper; ctx.strokeStyle=colors.blue; ctx.lineWidth=1.5/M.zoom; ctx.setLineDash([]);
  for(const hd of frameHandles(f)){ ctx.beginPath(); ctx.arc(hd.x,hd.y,(hd.k==='rot'?HANDLE_R+1.5:HANDLE_R)/M.zoom,0,6.284); ctx.fill(); ctx.stroke(); }

/* a turned picture is hit where it is seen: the point is brought back into
   the picture's own upright frame first */
function inImage(x,y,im){
  const r=im.rot||0;
  if(r){ const cx=im.x+im.w/2, cy=im.y+im.h/2, c=Math.cos(-r), sn=Math.sin(-r), px=x-cx, py=y-cy; x=px*c-py*sn+cx; y=px*sn+py*c+cy; }

/* the corner being dragged moves; the opposite corner stays; the shape is kept */
function resizedFrame(b,k,x,y){
  const r=b.rot||0; if(!r) return resizedBox(b,k,x,y);
  const c0x=b.x+b.w/2, c0y=b.y+b.h/2, c=Math.cos(-r), sn=Math.sin(-r), px=x-c0x, py=y-c0y;

  return {x:nb.x+ddx-(ddx*cr-ddy*sr), y:nb.y+ddy-(ddx*sr+ddy*cr), w:nb.w, h:nb.h};
}
function resizedBox(b,k,x,y){
  const min=40;
  let w,nx=b.x,ny=b.y;
  if(k==='se'||k==='ne') w=x-b.x; else w=b.x+b.w-x;
  w=Math.max(min,Math.min(w,6000));
  const hh=w*b.h/b.w;
  if(k==='nw'||k==='sw') nx=b.x+b.w-w;
  if(k==='nw'||k==='ne') ny=b.y+b.h-hh;
  return {x:nx,y:Math.max(0,ny),w,h:hh};

/* select a picture where it is, without changing tools: a tap on it does this */
function pickImage(id){
  if(!S.images.some(i=>i.id===id))return false;
  S.selection=[];S.imageSelection=id;render();showSelBar();return true;
}
function moveStrokes(ids, dx, dy){
  carryReadings(()=>{
    for(const id of ids){
      const st = C.strokeById(id); if(!st) continue;
      for(let i=0;i<st.pts.length;i+=3){ st.pts[i]+=dx; st.pts[i+1]+=dy; }
      st.bbox = bboxOf(st.pts); st.rev = (st.rev||0) + 1;   /* the reading cache keys on the points */
    }

/* ---- turning and scaling ----
   Both are previewed on the ink itself: every move lays the original points
   down again through the new transform, so nothing drifts, and the lift
   records one undo step from the originals to the result. A picture keeps
   its angle as a number and is drawn turned. */
function grabStrokes(ids){
  const m = new Map();
  for(const id of ids){ const st = C.strokeById(id); if(st) m.set(id, {pts:st.pts.slice(), bbox:st.bbox.slice(), w:st.w}); }
  return m;
}
function layStrokes(orig, map, wf){
  for(const [id, o] of orig){
    const st = C.strokeById(id); if(!st) continue;
    const p = o.pts.slice();
    for(let i=0;i<p.length;i+=3){ const q = map(p[i], p[i+1]); p[i] = q[0]; p[i+1] = q[1]; }
    st.pts = p; st.bbox = bboxOf(p); if(wf) st.w = o.w*wf;
  }

function putStrokes(snap){
  carryReadings(()=>{
    for(const [id, o] of snap){ const st = C.strokeById(id); if(!st) continue; st.pts = o.pts.slice(); st.bbox = o.bbox.slice(); st.w = o.w; st.rev = (st.rev||0) + 1; }
  });
}
/* the preview is taken back and the same change made again as one undo step */
function commitLaid(orig, label){
  const now = grabStrokes([...orig.keys()]);
  for(const [id, o] of orig){ const st = C.strokeById(id); if(st){ st.pts = o.pts.slice(); st.bbox = o.bbox.slice(); st.w = o.w; } }
  C.act(label, ()=>putStrokes(now), ()=>putStrokes(orig));
  let low = 0; for(const o of now.values()) low = Math.max(low, o.bbox[3]);
  C.growDoc(low);
}
function startTurn(im, w){
  const f = frameOf(im);
  const t = { id:im?im.id:null, cx:f.cx, cy:f.cy, rot0:f.rot, a0:Math.atan2(w.y-f.cy, w.x-f.cx), rot:f.rot };
  if(!im) t.orig = grabStrokes(S.selection);

}
function turnTo(w){
  const t = turning; let rot = t.rot0 + Math.atan2(w.y-t.cy, w.x-t.cx) - t.a0;
  /* it settles onto the square angles when close, so a picture pasted
     crooked goes straight without a steady hand */
  const q = Math.round(rot/(Math.PI/2))*(Math.PI/2); if(Math.abs(rot-q) < 0.05) rot = q;
  rot = Math.atan2(Math.sin(rot), Math.cos(rot));
  t.rot = rot;
  if(t.id){ const im = S.images.find(i=>i.id===t.id); if(im) im.rot = rot; return; }
  const a = rot - t.rot0, c = Math.cos(a), sn = Math.sin(a), cx = t.cx, cy = t.cy;

  const t = turning; turning = null;
  if(t.id){
    const im = S.images.find(i=>i.id===t.id); if(!im) return;
    const rot = Math.abs(t.rot) < 1e-9 ? 0 : t.rot, was = t.rot0;
    if(was) im.rot = was; else delete im.rot;
    if(rot !== was) C.act('turn image', ()=>{ const l = S.images.find(i=>i.id===t.id); if(l){ if(rot) l.rot = rot; else delete l.rot; } },
                                       ()=>{ const l = S.images.find(i=>i.id===t.id); if(l){ if(was) l.rot = was; else delete l.rot; } });
  } else if(t.rot !== t.rot0) commitLaid(t.orig, 'turn ink');

function startScale(k, w){

  return { ax:a.x, ay:a.y, d0:Math.max(1, Math.hypot(grab.x-a.x, grab.y-a.y)), orig:grabStrokes(S.selection), s:1 };

function scaleTo(w){
  const t = scaling, s = C.clamp(Math.hypot(w.x-t.ax, w.y-t.ay)/t.d0, 0.1, 20); t.s = s;
  const ax = t.ax, ay = t.ay;

  after(); showSelBar();

function carryReadings(change){
  const key = cl => cl.strokeIds.slice().sort().join(',');
  const was = new Map((S.clusters||[]).map(cl=>[key(cl), cl.hash]));
  change();
  /* A cluster's cache key is derived from its stroke points, so moving ink
     would orphan its reading and throw away a confirmed correction. The strokes
     in a cluster do not change when it slides, so the reading moves with it. */
  if(N.recog){
    N.recog.rebuild();
    const cache = N.recog.cache;
    let carried = false;
    for(const cl of S.clusters){
      const old = was.get(key(cl));
      if(old && old !== cl.hash && cache.has(old) && !cache.has(cl.hash)){
        cache.set(cl.hash, cache.get(old)); carried = true;

/* ---- background removal ---- */
/* bg-worker.js holds a 94 MB model and needs about 2 GB while it runs, so it
   is let go a minute after the last job rather than kept all session. The
   model itself stays in the model store, so the next use only restarts it.
   One worker answers every job: a picture asked for while the background
   download is still running waits for that download instead of repeating it. */
const CUTOUT_SIZE=512, CUTOUT_IDLE=60000, CUTOUT_MAX_CHARS=8*1024*1024;  /* IMAGE_MAX_CHARS */

const cutoutJobs=new Map();
function cutoutStop(err){
  const w=cutoutWorker; cutoutWorker=null; clearTimeout(cutoutIdle);
  if(w) w.terminate();
  for(const job of cutoutJobs.values()) job.reject(err||new Error('the background remover stopped.'));
  cutoutJobs.clear();
}
function cutoutPort(){
  clearTimeout(cutoutIdle);
  if(cutoutWorker) return cutoutWorker;
  const w=cutoutWorker=new Worker('./bg-worker.js');
  w.onmessage=e=>{
    const d=e.data||{}, job=cutoutJobs.get(d.id);
    if(d.progress){
      if(d.phase==='download') N.downloads&&N.downloads.set('cutout','download','',null,d.loaded,d.total);
      if(job&&job.progress) job.progress(d);
      return;
    }
    if(!job) return;
    cutoutJobs.delete(d.id);
    if(d.error) job.reject(new Error(d.error)); else job.resolve(d);
    if(!cutoutJobs.size) cutoutIdle=setTimeout(()=>{ if(!cutoutJobs.size&&cutoutWorker===w) cutoutStop(); },CUTOUT_IDLE);
  };
  w.onerror=e=>{
    if(e&&e.preventDefault) e.preventDefault();
    if(cutoutWorker===w) cutoutStop(new Error('the background remover stopped. this device may be short of memory.'));
  };
  return w;
}
function cutoutAsk(msg,transfer,progress){
  const w=cutoutPort(), id=++cutoutSeq;
  return new Promise((resolve,reject)=>{
    cutoutJobs.set(id,{resolve,reject,progress});
    w.postMessage({...msg,id},transfer||[]);
  });
}
/* The model is downloaded in the background once the notebook has started
   and the handwriting readers have finished theirs, so the first "remove
   background" does not sit behind 94 MB. Only the download: starting the
   model waits for a picture. A connection that asks to save data is left
   alone, as are automated browsers (the test suite opens hundreds of fresh
   profiles); both still download on first use. */
let cutoutWarming=null;
function prefetchCutout(){
  if(cutoutWarming) return cutoutWarming;
  if(!navigator.onLine){
    addEventListener('online',()=>prefetchCutout(),{once:true});
    return Promise.resolve(false);
  }
  cutoutWarming=cutoutAsk({prefetch:true}).then(d=>{
    N.downloads&&N.downloads.set('cutout','ready');
    return d.done;
  },()=>{
    cutoutWarming=null;
    N.downloads&&N.downloads.set('cutout','error','',prefetchCutout);
    return false;
  });
  return cutoutWarming;
}
function warmCutoutLater(){
  if(navigator.webdriver) return;
  const c=navigator.connection; if(c&&c.saveData) return;
  const tick=()=>{ if(N.downloads&&N.downloads.busy()) setTimeout(tick,5000); else prefetchCutout(); };
  setTimeout(tick,8000);
}
if(document.readyState==='complete') warmCutoutLater(); else addEventListener('load',warmCutoutLater,{once:true});
/* The picture with the matte as its alpha, at full size, as a PNG. Like a
   pasted picture it shrinks until the data URL fits the note. */
function cutoutEncode(el,mask){
  const W=el.naturalWidth, H=el.naturalHeight, big=Math.max(W,H);
  let side=big;
  for(;;){
    const k=side/big, cw=Math.max(1,Math.round(W*k)), ch=Math.max(1,Math.round(H*k));
    const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    const x=cv.getContext('2d');
    x.imageSmoothingQuality='high';
    x.drawImage(el,0,0,cw,ch);
    x.globalCompositeOperation='destination-in';
    x.drawImage(mask,0,0,cw,ch);
    const src=cv.toDataURL('image/png');
    if(typeof src==='string'&&src.length<=CUTOUT_MAX_CHARS&&src.length>'data:,'.length) return src;
    if(side<=200) throw new Error('that picture is too large to keep without its background.');
    side=Math.max(200,Math.round(side*.7));
  }
}
function loadPicture(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>img.naturalWidth?resolve(img):reject(new Error('that picture is empty.'));
    img.onerror=()=>reject(new Error('that picture could not be opened.'));
    img.src=src;
  });
}
async function removeBackground(id){
  const im=S.images.find(i=>i.id===id); if(!im) return false;
  if(cutoutBusy){ C.toast('still removing a background.'); return false; }
  cutoutBusy=true;
  const note=S.id, before=im.src;
  C.toast('removing the background.', 600000);
  let told=false;
  try{
    const el=await loadPicture(before);
    const n=CUTOUT_SIZE, small=document.createElement('canvas'); small.width=small.height=n;
    const sx=small.getContext('2d',{willReadFrequently:true});
    sx.imageSmoothingQuality='high'; sx.drawImage(el,0,0,n,n);
    const rgba=sx.getImageData(0,0,n,n).data;
    const {alpha}=await cutoutAsk({rgba:rgba.buffer},[rgba.buffer],d=>{
      if(d.phase==='download'&&!told){ told=true; C.toast('downloading the background remover, about 94 MB. this happens once.', 600000); }
      else if(d.phase==='running'){ N.downloads&&N.downloads.set('cutout','ready'); if(told) C.toast('removing the background.', 600000); }
    });
    const mask=sx.createImageData(n,n);
    for(let i=0;i<alpha.length;i++) mask.data[i*4+3]=alpha[i];
    sx.putImageData(mask,0,0);
    const src=cutoutEncode(el,small);
    /* the note, or the picture, may have changed during the few seconds */
    const live=S.images.find(i=>i.id===id);
    if(note!==S.id||!live||live.src!==before){ C.toast('that picture changed, so its background was left.'); return false; }

    C.act('remove background',()=>set(src),()=>set(before));
    after(); showSelBar();
    C.toast('background removed.');
    return true;
  }catch(e){
    N.downloads&&N.downloads.set('cutout','error');
    C.toast(e.message||'could not remove the background.');
    return false;
  }finally{ cutoutBusy=false; }
}
/* ---- cropping a picture ----

   with a handle at each corner and edge, and the part being cut away dimmed.

function noteImageTap(id,ev){
  const now=Date.now(), p=lastImgTap;

  lastImgTap={id,t:now,x:ev.clientX,y:ev.clientY};
  return false;
}
function startCrop(id){
  if(!S.images.some(i=>i.id===id)) return false;
  S.selection=[]; S.imageSelection=id;
  cropping={id,l:0,t:0,r:1,b:1}; cropDrag=null;
  render(); showSelBar(); return true;
}
function cancelCrop(){
  if(!cropping) return false;
  cropping=null; cropDrag=null; render(); showSelBar(); return true;
}
/* a page point in the picture's own upright frame, as fractions of it */
function cropLocal(im,w){
  let x=w.x, y=w.y; const r=im.rot||0;

function cropPoint(im,u,v){

function cropHandles(im){

function cropHandleAt(im,w,touch){
  const r=(touch?20:HANDLE_HIT)/M.zoom;

function drawCrop(ctx,im){

  const x0=-im.w/2, y0=-im.h/2, L=x0+c.l*im.w, T=y0+c.t*im.h, R=x0+c.r*im.w, B=y0+c.b*im.h;

/* a press while cropping: a handle or the box takes it; off the picture it

function cropDown(ev,kind){

  if(!im){ cropping=null; return; }
  const w=toWorld(ev), p=cropLocal(im,w), k=cropHandleAt(im,w,kind==='touch');
  if(k){ cropDrag={k,start:p,from:{...cropping}}; return; }
  if(p.u>=cropping.l&&p.u<=cropping.r&&p.v>=cropping.t&&p.v<=cropping.b){ cropDrag={k:'move',start:p,from:{...cropping}}; return; }
  cropDrag={k:'none'};

function cropMove(w){
  const im=S.images.find(i=>i.id===cropping.id), d=cropDrag; if(!im||d.k==='none') return;
  const p=cropLocal(im,w), f=d.from, du=p.u-d.start.u, dv=p.v-d.start.v;

function cropCursor(im,w){

/* The kept part becomes the picture: cut from the full-resolution pixels,

async function applyCrop(){
  const c=cropping; if(!c) return false;
  cropping=null; cropDrag=null;
  const im=S.images.find(i=>i.id===c.id);
  if(!im||(c.l<=.001&&c.t<=.001&&c.r>=.999&&c.b>=.999)){ render(); showSelBar(); return false; }
  const note=S.id, before={src:im.src,x:im.x,y:im.y,w:im.w,h:im.h};
  const mid=cropPoint(im,(c.l+c.r)/2,(c.t+c.b)/2);

    const el=await loadPicture(before.src);
    const NW=el.naturalWidth, NH=el.naturalHeight;
    const sx=Math.round(c.l*NW), sy=Math.round(c.t*NH);

}
/* ---- ink clipboard ---- */

function selectedStrokes(){ return S.selection.map(id=>C.strokeById(id)).filter(Boolean); }
/* Ctrl/Cmd+A with no line focused: every stroke on the page, ready to move */
function selectAll(){
  const ids = S.strokes.filter(s=>s.author === 'user' || s.author === 'ai').map(s=>s.id);

  setTool('select'); S.selection = ids; S.imageSelection = null;
  render(); showSelBar(); return true;
}
function deleteSelection(){
  const ids=S.selection.slice(); if(!ids.length) return false;
  const gone=S.strokes.filter(s=>ids.includes(s.id));
  C.act('delete', ()=>{ S.strokes = S.strokes.filter(s=>!ids.includes(s.id)); }, ()=>{ S.strokes = S.strokes.concat(gone); });

/* Strokes stored relative to the group's top-left, so they can land anywhere. */
function packStrokes(list){

}
function unpackStrokes(clip,x,y){
  const t=inkNow();

    const pts=s.pts.map((v,k)=>k%3===0?v+x:k%3===1?v+y:v);
    const times=Array.isArray(s.times)&&s.times.length===pts.length/3?s.times.map(Number):null;
    const duration=times&&times.length?Math.max(0,times[times.length-1]):0;
    return {id:C.uid(),author:s.author==='ai'?'ai':'user',tool:'pen',w:s.w,t0:t+i,t1:t+i+duration,pts,bbox:bboxOf(pts),...(times?{times}:{})};

function readClip(){

      (s.times===undefined||(Array.isArray(s.times)&&s.times.length===s.pts.length/3&&s.times.every(Number.isFinite)&&s.times.every((v,i,a)=>v>=0&&(!i||v>=a[i-1]))))))return null;

function clipMarker(clip){ return clip?'notas-ink:'+clip.at:''; }
function copySelection(cut){

/* Pasted ink is selected straight away so a single drag puts it where it

   so it never lands invisibly on top of the previous one. */
function placeStrokes(clip,at,verb){
  const rel=bboxOf(clip.strokes[0].pts);
  const maxX=Math.max(0,M.contentW-Math.min(clip.w,M.contentW-24));
  const vo=viewOrigin();
  let x=at?Number(at.x):Math.max(24,vo.x+24);
  let y=at?Number(at.y):vo.y+80;
  if(!Number.isFinite(x))x=24;if(!Number.isFinite(y))y=80;
  x=C.clamp(Math.round(x),0,maxX);y=Math.max(0,Math.round(y));

function pasteInk(at){

/* Duplicate never touches any clipboard: the copy goes straight below the

   two pointers, which this read as a two-finger scroll, and the first stroke of

      let v; try{ v = num(rawEval(f, Object.assign({}, scope, {[want]:x}))); }catch(e){ continue; }

        let a = prev.x, b = x;
        for(let k=0;k<40;k++){
          const mdl = (a+b)/2;
          const vm = num(rawEval(f, Object.assign({}, scope, {[want]:mdl})));
          const va = num(rawEval(f, Object.assign({}, scope, {[want]:a})));
          if((vm<=0) === (va<=0)) a = mdl; else b = mdl;
        }
        const r = Math.round(((a+b)/2)*1e6)/1e6;
        if(!roots.some(o=>Math.abs(o-r)<1e-4)) roots.push(r);
      }
      prev = {x, v};
    }
    if(roots.length) return want+' = '+roots.join(' or ');

  return '';
}
function symbolic(src){
  if(typeof nerdamer === 'undefined') return '';
  try{ return nerdamer(src).toString(); }catch(e){ return ''; }
}

/* Handwriting is only calculated once the student writes '=' and asks for an
   answer. Half finished working and misread scribbles then stay quiet instead
   of producing a confident answer to something nobody wrote. Typed lines and
   readings the student has confirmed are calculated as before. */
/* A run of three or more letters is a word, not algebra. A model trained only
   on formulae will read "hello" as some equation, sometimes one containing an
   equals sign, so the equals test alone is not enough to keep prose quiet. */
const KNOWN_WORD=/^(sqrt|nthRoot|sin|cos|tan|asin|acos|atan|arcsin|arccos|arctan|log|ln|exp|abs|min|max|det|pi|solve|integrate|antiderivative|derivative|plot|true|false)$/i;
function readsAsProse(src){
  // Named quantities are valid math (Pens=3, Pens*4). Require a single name
  // followed by an operator and a math-only tail, so normal sentences remain
  // quiet. Recognition preserves the name's case; no fuzzy scope substitution.
  if(/^\s*[A-Za-z][A-Za-z0-9_]*\s*[=+*/^-]\s*[-+\d.(][\d\s.+*/^()=-]*$/.test(String(src||'')))return false;
  return (String(src||'').match(/[A-Za-z]{3,}/g) || []).some(word => !KNOWN_WORD.test(word));
}
function asksForAnswer(n){
  if(n.kind !== 'cluster') return true;
  if(n.ref?.confirmed || n.ref?.asked) return true;
  if(n.ref?.needsConfirmation) return false;
  return /=/.test(n.src || '') && !readsAsProse(n.src);
}
/* Handwriting without an '=' is not calculated, but it is not hidden either:
   the chip shows what the reader made of the ink and offers Solve. The student
   sees the reading before any answer exists, can correct it, or can ask for
   the answer with one tap. Prose and doodles still get nothing. */
function offersSolve(n){
  if(n.kind !== 'cluster' || !n.src || n.pending || n.ref?.review) return false;
  if(asksForAnswer(n)) return false;
  return looksLikeMath(n.src) && !readsAsProse(n.src);
}
function requestSolve(id){
  const live = S.clusters.find(c=>c.id===id); if(!live) return;
  live.asked = true; delete live.dismissed;
  const stored = N.recog && N.recog.cache.get(live.hash); if(stored){ stored.asked = true; delete stored.dismissed; }
  C.markDirty(); run();
}
/* The box beside handwriting can be sent away: a working the student does
   not want read, a doodle the reader took for a sum. The reading is kept,
   so search still finds the ink, and the flag travels with it like an
   explicit Solve does; new ink in the same place makes a new reading and a
   new box. Undo brings the box back, and so does Solve on that ink. */
function dismiss(id){
  const live = S.clusters.find(c=>c.id===id); if(!live) return;
  const hash = live.hash;
  const set = on=>{
    const cl = S.clusters.find(c=>c.hash===hash); if(cl){ if(on) cl.dismissed = true; else delete cl.dismissed; }
    const stored = N.recog && N.recog.cache.get(hash); if(stored){ if(on) stored.dismissed = true; else delete stored.dismissed; }
    C.markDirty(); run();
  };
  C.act('dismiss answer', ()=>set(true), ()=>set(false));
}
/* The Solve offer beside a working has no close button: writing past it is
   the answer. Ink the student lays down anywhere else once the box is on
   the page sends it away, quietly and without an undo step, so a student
   working down the page never has to reach for an x. Ink added to the same
   working is not writing past it - that changes the reading and the box
   follows. The pen reports each stroke it lands; the check waits for the
   grouping so a stroke that joins the working is never mistaken for one
   beside it. Only this pen counts: a friend writing in a shared note is not
   this student moving on. */
const landed = [];
function inkLanded(id){ landed.push(id); }
function dismissPassed(){
  if(!landed.length) return;
  const grouped = new Map(); for(const cl of S.clusters) for(const id of cl.strokeIds) grouped.set(id, cl);
  const fresh = landed.filter(id=>grouped.has(id));
  landed.length = 0; for(const id of fresh) landed.push(id);        /* ungrouped ink is judged on the next run */
  if(!fresh.length) return;
  let changed = false;
  for(const [id, el] of chips){
    if(!el.classList.contains('offer') || el.classList.contains('open')) continue;
    const cl = S.clusters.find(c=>c.id===id); if(!cl || cl.dismissed || cl.asked) continue;
    if(!fresh.some(s=>grouped.get(s) !== cl)) continue;
    cl.dismissed = true;
    const stored = N.recog && N.recog.cache.get(cl.hash); if(stored) stored.dismissed = true;
    changed = true;
  }
  landed.length = 0;
  if(changed) C.markDirty();
}
function run(){
  if(!ready && !harden()) return;
  dismissPassed();
  const nodes = collect();
  const scope = baseScope(), defined = new Set();
  provSrc.clear();
  S.nodes = nodes;
  for(const n of nodes) if(!n.ref?.review && !n.pending && asksForAnswer(n)) evalNode(n, scope, defined);
  if(evalMemo.size > nodes.length + 50){ const live = new Set(nodes.map(n=>n.id)); for(const id of [...evalMemo.keys()]) if(!live.has(id)) evalMemo.delete(id); }
  for(const n of nodes) if(n.error) n.error = clean({message:n.error});
  S.scope = scope;
  paint(nodes);
  paintAccessible(nodes);
  N.tutorial && N.tutorial.check('eval');
}
function paintAccessible(nodes){
  const el=$('#page-accessible');if(!el)return;
  const out=[];
  for(const n of nodes){
    if(!n.src)continue;
    out.push((n.kind==='cluster'?'handwriting read as ':'typed ')+n.src);
    if(n.result&&n.kind==='line'&&!n.stated&&/=\s*$/.test(n.src||''))out.push('answer '+n.result+' suggested; press Space to accept');
    else if(n.result)out.push('result '+n.result);
    else if(offersSolve(n))out.push('not calculated yet, solve is offered beside it');
    if(n.error)out.push('calculation issue, '+n.error);
    if(n.plot)out.push('graph, y = '+n.plot.expr+(n.plot.params.length?' with parameters '+n.plot.params.join(', '):''));
  }
  el.textContent=out.join('. ');
}

/* ---- chips in the margin ---- */
/* ---- what the dots are waiting for ---- */
/* The first time, the reader has to be fetched (tens of megabytes), then
   started, and on a slow connection the dots beside a sum sat there saying
   nothing. Read as "the maths is slow", the notebook was put down. The chip
   the student is looking at - the one beside the ink written last - now says
   what it is waiting for, and that it is once. */
function waitText(){
  const p = N.ai && N.ai.setupState ? N.ai.setupState() : null;
  if(!p) return '';
  if(p.phase === 'download') return 'getting the handwriting reader' + (p.detail ? ', ' + p.detail : '') + '. first time only.';
  if(p.phase === 'starting') return 'starting the handwriting reader. a moment.';
  return '';
}
function waitCaption(){
  const text = waitText();
  return text ? '<span class="wait">' + escape(text) + '</span>' : '';
}
function pendingHTML(n, waitOn){
  return '<span class="dots"><span></span><span></span><span></span></span>' + (n.id === waitOn ? waitCaption() : '');
}
/* the ink written last: its chip is the one carrying the setup line */
function latestPending(nodes){
  let best = null, at = -1;
  for(const n of nodes){
    if(!n.pending || n.kind !== 'cluster' || !n.ref?.strokeIds) continue;
    let last = 0; for(const id of n.ref.strokeIds){ const st = C.strokeById(id); if(st) last = Math.max(last, Number(st.t1)||Number(st.t0)||0); }
    if(last >= at){ at = last; best = n.id; }
  }
  return best;
}
/* the download counts up every few hundred milliseconds; only the line in
   the waiting chip is rewritten, the page is not re-run for it */
function refreshWaiting(){
  if(!S.nodes.some(n=>n.pending)) return;
  const waitOn = latestPending(S.nodes);
  let replace = false;
  for(const [id, el] of chips){
    const n = S.nodes.find(o=>o.id === id);
    if(!n || !n.pending || el.classList.contains('open')) continue;
    const html = pendingHTML(n, waitOn);
    if(el.dataset.html === html) continue;
    /* the count changing is the usual case: the words are swapped inside the
       line that is already there, so it does not fade in again every megabyte */
    const wait = el.querySelector('.wait'), text = n.id === waitOn ? waitText() : '';
    if(wait && text){ wait.textContent = text; el.dataset.html = html; continue; }
    /* a line appearing or going changes the chip's height, so it is placed again */
    if(!!wait !== !!text) replace = true;
    el.innerHTML = html; el.dataset.html = html;
  }
  if(replace) run();
}
const SETTLE_MS = 1500;
let settleTimer = 0;
function paint(nodes){
  const seen = new Set(), plotted = new Set(), place = [], waitOn = latestPending(nodes);
  let plotBottom = 0, deepest = 0, settleAt = 0;
  clearTimeout(settleTimer); settleTimer = 0;
  for(const n of nodes){
    deepest = Math.max(deepest, n.mid || n.y);
    /* graphs are too big to sit inline, so they keep the right hand band */
    if(n.plot && N.plot){
      plotted.add(n.id);
      const top = Math.max(n.y - 4, plotBottom + 8);
      const p = N.plot.card(n, top);
      if(p) plotBottom = top + p.offsetHeight;
    }
    /* Completed typed expressions surface evaluator/parser feedback instead of
       failing silently. Handwriting that has not asked for an answer stays quiet. */
    /* Handwriting that does not ask for an answer gets no chip at all. Writing
       a word is not a failed sum, and a model that only knows formulae will
       always read one, so the quiet default is to leave prose alone. */
    const editingError=n.kind==='line'&&n.error&&N.text&&N.text.isFocused&&N.text.isFocused(n.id);
    /* a typed line that reads as words and never asks with '=' is a note, not
       a failed sum: "homework 12 sep" gets no chip */
    const proseLine=n.kind==='line'&&n.error&&!/=/.test(n.src||'')&&readsAsProse(n.src);
    const visibleError=(editingError||proseLine)?'':n.error;
    const offer = offersSolve(n);
    /* A trailing equals sign previews the answer; Space accepts it into the editable line.
       Completed answers need no extra chip; extended answers evaluate their tail. */
    if(n.kind==='line' && N.text && N.text.setGhost){
      const ghost = n.result && !n.error && !n.plot && !n.provides && /=\s*$/.test(n.src||'') ? n.result : '';
      N.text.setGhost(n.id, ghost);
      if(ghost || n.stated) continue;
    }
    const show = n.pending || n.result || visibleError || n.ref?.review || offer || (n.kind==='cluster' && n.src && asksForAnswer(n));
    if(!show || (n.kind==='cluster' && n.ref?.dismissed)) continue;
    /* Ink still warm from the pen gets no chip yet. The chip lands right after
       the working, where the next symbol goes, and a reading that arrived in
       the middle of writing was a thing in the way. It waits for the pen to
       lift and for a short quiet moment after the last stroke of that ink; a
       run is booked for then. A chip already on the page stays, and the
       student's own Solve is never held. */
    if(n.kind==='cluster' && n.ref?.source==='ink' && !n.ref.asked && !chips.has(n.id) && N.ink && N.ink.now){
      let last = 0; for(const id of n.ref.strokeIds){ const st = C.strokeById(id); if(st) last = Math.max(last, Number(st.t1)||Number(st.t0)||0); }
      const wait = N.ink.drawing() ? SETTLE_MS : Math.min(SETTLE_MS, SETTLE_MS - (N.ink.now() - last));
      if(wait > 0){ settleAt = settleAt ? Math.min(settleAt, wait) : wait; continue; }
    }
    seen.add(n.id);
    let el = chips.get(n.id);
    if(!el){
      el = document.createElement('div'); el.className = 'chip';
      el.addEventListener('click', e=>{
        const current=S.nodes.find(o=>o.id===el.dataset.node);
        if(!current)return;
        if(e.target.closest('.solve')){ e.stopPropagation(); requestSolve(current.id); return; }
        /* words being selected on the open card are being copied, not a tap to close it */
        const sel=document.getSelection();
        if(el.classList.contains('open')&&sel&&!sel.isCollapsed&&sel.anchorNode&&el.contains(sel.anchorNode)) return;
        expand(el,current);
      });
      el.setAttribute('role','button');el.tabIndex=0;
      el.addEventListener('keydown', e=>{if(e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.click();}});
      marginEl.appendChild(el); chips.set(n.id, el);
    }
    el.classList.remove('yield');           /* stepped aside for the pen; the paint puts it back */
    el.dataset.node=n.id;
    /* Match a generated handwritten answer to the height of the expression
       that produced it. This is measured from the actual recognition bbox,
       so large and small handwriting scale naturally instead of using a
       fixed answer font size. Typed-line answers keep the normal chip size. */
    const handwritingHeight=n.kind==='cluster'&&(n.result||n.pending)&&n.ref?.bbox
      ? Math.max(1,n.ref.bbox[3]-n.ref.bbox[1]) : 0;
    if(!el.classList.contains('open')&&!el.classList.contains('explaining')){
      el.style.fontSize=handwritingHeight?handwritingHeight+'px':'';
      el.setAttribute('role','button');el.classList.toggle('error',!!visibleError);
      el.classList.toggle('offer',offer);
      el.classList.toggle('typed', n.kind === 'line' && !offer && !visibleError && !n.pending);
      let html;
      if(offer){
        el.setAttribute('aria-label','handwriting read as '+n.src+'. open to correct it.');
        html = '<span class="reading">'+readingHTML(n.ref)+'</span>'+
          '<button class="solve" type="button" aria-label="solve '+escape(n.src)+'"><i class="ph ph-equals" aria-hidden="true"></i>solve</button>';
      }else{
        el.removeAttribute('aria-label');
        html = n.pending
          ? pendingHTML(n, waitOn)
          : escape(visibleError ? 'cannot calculate, '+visibleError : (n.result || 'edit expression'));
      }
      /* Rewritten only when it changes. A blur on a typed line re-runs the
         maths at once, and replacing the Solve button between the press and
         the release of a tap on it swallowed the tap. */
      if(el.dataset.html !== html){ el.innerHTML = html; el.dataset.html = html; }
    }
    /* right after the working. The paper, not the column, is the limit - the
       same freedom a drag has - so an equation moved into the margin keeps its
       answer beside it instead of pinned at the column edge. When the paper
       ends, the chip falls below the working rather than covering it. */
    const zc=M.zoom, docW=$('#doc').offsetWidth||M.vw;
    const paperL=-M.colLeft/zc, paperR=(docW-M.colLeft)/zc;
    const bb=n.kind==='cluster'&&n.ref&&n.ref.bbox?n.ref.bbox:null;
    const MIN_PILL=90, PILL_ROOM=140;
    const floor=(n.right||0)>M.contentW?paperL+2:44;
    let left=Math.max(floor,(n.right||0)+18);
    /* no room beside: the chip falls below the working, left-aligned with it
       but pulled inside the paper so it keeps a real pill width - a short
       answer must never wrap into a tall column of characters */
    const below=()=>{
      const belowMid=bb?bb[3]+14:(n.mid||n.y)+C.LINE_H/2+14;
      const l=Math.min(Math.max(paperL+2,bb?bb[0]:(n.x||0)), Math.max(paperL+2,paperR-6-MIN_PILL));
      el.style.left=l+'px';
      el.style.maxWidth=Math.max(MIN_PILL,paperR-6-l)+'px';
      el.style.top=Math.round(belowMid)+'px';
      /* the paper grows to keep a dropped answer on it */
      deepest=Math.max(deepest, belowMid+(handwritingHeight?handwritingHeight*1.3:C.LINE_H));
    };
    if(left+PILL_ROOM>paperR-6){
      below();
      place.push(null);
    }else{
      el.style.left=left+'px';
      el.style.maxWidth=Math.max(MIN_PILL,paperR-6-left)+'px';
      /* the height one line of this answer takes; a handwritten answer is
         set at the handwriting's height, so the fixed room check above
         cannot know whether it will fit beside. Cards, offers and errors
         are more than one line by design and are left where they are. */
      const plain=!el.classList.contains('open')&&!el.classList.contains('explaining')&&!offer&&!visibleError;

     the two forced a layout per chip. A null entry placed itself below the
     working, where there was no room beside. A chip that turned out taller
     than one line wrapped beside the working: it goes below instead, where
     the whole paper width is its own, rather than climbing off the screen
     as a column of digits centred on the working. */
  for(const p of place){
    if(!p) continue;
    const [el,mid,lineH,below]=p;
    if(lineH&&el.offsetHeight>lineH*1.6+12){ below(); continue; }
    el.style.top = Math.round(mid - el.offsetHeight/2) + 'px';
  }
  for(const [id, el] of chips){
    if(!seen.has(id)){ el.remove(); chips.delete(id); }
  }
  if(settleAt) settleTimer = setTimeout(run, settleAt + 30);
  N.plot && N.plot.keep(plotted);

}
function escape(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* the reading typeset when KaTeX and a LaTeX form are both there, plain text otherwise */
function readingHTML(ref){
  if(!ref) return '';
  if(window.katex && ref.latex){
    try{ return katex.renderToString(ref.latex, {throwOnError:false, displayMode:false}); }catch(e){}
  }

}
/* The clipboard write has to start inside the tap, so no awaits first. The
   execCommand path is for browsers that hide the async API outside https. */
function copyText(text){
  const done=()=>C.toast('copied '+text+'.');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,()=>copyFallback(text)?done():C.toast('could not copy. select the answer and copy it by hand.'));
    return;
  }
  copyFallback(text)?done():C.toast('could not copy. select the answer and copy it by hand.');
}
function copyFallback(text){
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  ta.remove();return ok;
}

function expand(el, n){
  const open = el.classList.toggle('open');
  el.setAttribute('role',open?'group':'button');
  delete el.dataset.html;                 /* the card replaces the chip: the next paint must write it back */
  if(!open){ run(); return; }
  /* The expanded card needs room to breathe, so pull it back from the edge.
     Width follows the space actually left rather than a fixed minimum. The
     card is bounded by the paper, the same bounds a drag or a resting chip
     has, so a chip in the margin opens across the margin instead of being
     yanked back toward the column and wrapping. */
  const edge = 8, widest = 320, narrowest = 150;
  const zc=M.zoom, docW=$('#doc').offsetWidth||M.vw;
  const paperL=-M.colLeft/zc, paperR=(docW-M.colLeft)/zc;
  const room = Math.max(narrowest, Math.min(M.colW, paperR-paperL) - edge * 2);
  const want = Math.max(paperL+edge, Math.min(parseFloat(el.style.left || 0), paperR - edge - Math.min(widest, room)));
  el.style.left = want + 'px';
  el.style.maxWidth = Math.min(widest, Math.max(narrowest, paperR - want - edge)) + 'px';
  let html = '<button class="chip-close" type="button" aria-label="close">×</button>';
  const tx = n.ref && n.ref.latex ? n.ref.latex : (n.kind==='cluster' ? (n.ref.ascii||'') : n.src);
  if(tx){
    html += '<span class="tx">'+(n.kind==='cluster' ? readingHTML(n.ref) : escape(tx))+'</span>';
  }
  html += escape(n.result || '');
  if(offersSolve(n))html += '<button class="solve" type="button"><i class="ph ph-equals" aria-hidden="true"></i>solve</button>';
  if(n.result)html += '<button class="copy-answer" type="button">copy answer</button>';
  if(n.kind==='cluster')html += '<button class="copy-answer chip-dismiss" type="button" aria-label="dismiss this box">dismiss</button>';
  if(n.error)html += '<span class="tx">'+escape(n.error)+'</span>';
  if(n.ref?.review)html += '<span class="tx">'+escape(n.ref.error||'this reading could not be calculated.')+'</span>';
  else if(n.kind==='cluster' && !n.ref?.confirmed && n.ref?.latex)html += '<span class="tx">'+(n.ref.needsConfirmation?'check this reading before solving.':'read automatically. correct it below if it is wrong.')+'</span>';
  if(n.steps && n.steps.length){
    html += '<span class="steps">' + n.steps.map(s=>'<div>'+escape(s)+'</div>').join('') + '</span>';
  }
  if(n.kind === 'cluster'){
    html += '<label class="fix">read as<input aria-label="recognized expression" value="'+escape(n.ref.ascii || latexToMath(n.ref.latex||''))+'"></label>';
    if(!n.ref.confirmed&&n.ref.alternatives?.length)html+='<span class="tx">other readings</span>'+n.ref.alternatives.map(t=>'<button class="reading-option" data-expression="'+escape(latexToMath(t))+'">'+escape(latexToMath(t))+'</button>').join(' ');
    html+='<button class="confirm-reading">use expression</button>';
  }
  el.innerHTML = html;
  const close=el.querySelector('.chip-close');
  if(close)close.onclick=e=>{e.stopPropagation();el.classList.remove('open');run();};
  const copy=el.querySelector('.copy-answer:not(.chip-dismiss)');
  if(copy)copy.onclick=e=>{e.stopPropagation();copyText(n.result);};
  const away=el.querySelector('.chip-dismiss');
  if(away)away.onclick=e=>{e.stopPropagation();el.classList.remove('open');dismiss(n.id);};
  const solve=el.querySelector('.solve');
  if(solve)solve.onclick=e=>{e.stopPropagation();el.classList.remove('open');requestSolve(n.id);};
  const fix = el.querySelector('.fix input');
  if(fix){
    for(const option of el.querySelectorAll('.reading-option'))option.onclick=e=>{e.stopPropagation();fix.value=option.dataset.expression;fix.focus();};
    fix.addEventListener('click', e=>e.stopPropagation());
    const apply=()=>{const live=S.clusters.find(c=>c.id===n.id);if(!live)return;el.classList.remove('open');N.recog.confirm(live,fix.value);};
    fix.addEventListener('keydown', e=>{e.stopPropagation();if(e.key==='Enter')apply();});
    el.querySelector('.confirm-reading').onclick=e=>{e.stopPropagation();apply();};
  }
  /* When the page is zoomed or scrolled the panel can open outside the visible
     area even though it sits correctly inside the column. Nudge it into view;
     'nearest' means nothing moves when it is already fully on screen. */
  try{ el.scrollIntoView({block:'nearest',inline:'nearest',behavior:C.reducedMotion()?'auto':'smooth'}); }catch(e){}
}

function reset(){ for(const [,el] of chips) el.remove(); chips.clear(); evalMemo.clear(); savedMemo.clear(); }

/* a graph evaluates its expression a few hundred times per redraw; parsing
   it once and evaluating the compiled form is what makes a slider keep up */
const compiled = new Map();
function compileRaw(expr){
  let c = compiled.get(expr);
  if(!c){ c = rawParse(expr).compile(); if(compiled.size > 200) compiled.clear(); compiled.set(expr, c); }
  return c;
}
N.mathcore = { run, refreshWaiting, normalize, latexToMath, looksLikeMath, readsAsProse, fmt, freeVars, harden, reset, ensureCAS, savedAnswers, restoreAnswers,

})();
