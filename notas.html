/* ---- export ---- */
function contentBottom(){
  let y = 400;
  for(const s of S.strokes) y = Math.max(y, s.bbox[3]);
  for(const l of S.lines) y = Math.max(y, l.y + Math.max(C.LINE_H,l.h||C.LINE_H));
  for(const im of S.images) y = Math.max(y, im.y + im.h);
  document.querySelectorAll('#margin .chip, #margin .plot').forEach(el=>{
    y = Math.max(y, parseFloat(el.style.top||0) + el.offsetHeight);
  });
  return y + 40;
}
function loadImages(){
  return Promise.all(S.images.map(im=>new Promise(res=>{
    const el = new Image();
    el.onload = ()=>res({im, el}); el.onerror = ()=>res(null);
    el.src = im.src;
  })));
}
async function renderExport(opts={}){
  /* Export is a fresh rendering of note state, not a screenshot of whichever
     transient popup happened to be open. Recalculate first so an immediate
     export after typing cannot capture an older answer. */
  N.mathcore.run();
  const loaded = opts.loaded || await loadImages();
  const w=M.colW, top=opts.top||0, h=opts.height||contentBottom();
  /* iPadOS gives a canvas at most about 16.7 million pixels and hands back
     nothing past that, so a long note is drawn smaller rather than lost */
  const scale=Math.min(2,Math.sqrt(16e6/(w*h)),32000/h);
  if(scale<1)throw new Error('this note needs multiple export pages.');
  const cv = document.createElement('canvas');
  cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
  const x = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  x.fillStyle = cs.getPropertyValue('--paper').trim(); x.fillRect(0,0,cv.width,cv.height);
  x.scale(scale, scale); x.translate(0,-top);
  for(const pair of loaded){
    if(!pair) continue;
    try{
      const im=pair.im;
      if(im.rot){ x.save(); x.translate(im.x+im.w/2, im.y+im.h/2); x.rotate(im.rot); x.drawImage(pair.el, -im.w/2, -im.h/2, im.w, im.h); x.restore(); }
      else x.drawImage(pair.el, im.x, im.y, im.w, im.h);
    }catch(e){}
  }
  for(const st of S.strokes) N.ink.drawStroke(x, st);
  x.font = '400 16px '+((getComputedStyle(document.documentElement).getPropertyValue('--type')||'').trim()||'ui-monospace, monospace'); x.textBaseline = 'top';
  for(const l of S.lines) if(l.text){ x.fillStyle = l.tutor ? N.ink.colors.red : N.ink.colors.text; drawWrapped(x,l.text,2,l.y+3,M.contentW-4,22.4); }
  x.fillStyle = cs.getPropertyValue('--blue').trim();
  x.font = '600 21px "Caveat","Segoe Script",system-ui,sans-serif';
  x.textBaseline='alphabetic';
  document.querySelectorAll('#margin .chip').forEach(el=>{
    const n=S.nodes.find(o=>o.id===el.dataset.node);if(!n)return;
    const label=n.error?('cannot calculate, '+n.error):(n.result||'');if(!label)return;
    x.fillText(label, parseFloat(el.style.left||0), parseFloat(el.style.top||0) + 18);
  });
  document.querySelectorAll('#margin .plot').forEach(el=>{
    const pc=el.querySelector('canvas');if(!pc)return;
    const left=parseFloat(el.style.left||0),top=parseFloat(el.style.top||0),cw=parseFloat(pc.style.width)||pc.clientWidth,ch=parseFloat(pc.style.height)||pc.clientHeight;
    x.fillStyle=cs.getPropertyValue('--panel').trim();x.fillRect(left,top,el.offsetWidth,el.offsetHeight);
    try{x.drawImage(pc,left+8,top+8,cw,ch);}catch(e){}
    x.fillStyle=cs.getPropertyValue('--blue').trim();x.font='500 11px "IBM Plex Mono",monospace';x.textBaseline='top';
    let sy=top+8+ch+5;
    for(const row of el.querySelectorAll('.sl')){x.fillText((row.querySelector('span')?.textContent||'')+' = '+(row.querySelector('.v')?.textContent||''),left+8,sy);sy+=15;}
  });
  return cv;
}
function drawWrapped(ctx,text,left,top,maxWidth,lineHeight){
  let y=top;
  for(const para of String(text).split(/\r?\n/)){
    const pieces=/\s/.test(para)?(para.match(/\S+\s*/g)||[]):Array.from(para);
    let line='';
    for(const piece of pieces){
      const next=line+piece;
      if(line&&ctx.measureText(next).width>maxWidth){ctx.fillText(line.trimEnd(),left,y);y+=lineHeight;line=piece.trimStart();}
      else line=next;
    }
    if(line||!pieces.length){ctx.fillText(line.trimEnd(),left,y);y+=lineHeight;}
  }
  return y;
}
function download(name, href){
  const a = document.createElement('a');
  a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
async function exportPNG(){
  try{
    N.mathcore.run();
    const height=contentBottom(),pageHeight=Math.max(1,Math.floor(Math.min(12000,16e6/M.colW))),count=Math.ceil(height/pageHeight),loaded=await loadImages();
    for(let i=0;i<count;i++){
      const cv=await renderExport({top:i*pageHeight,height:Math.min(pageHeight,height-i*pageHeight),loaded});
      const b=await new Promise(r=>cv.toBlob(r));if(!b)throw Error('image export failed');
      const u=URL.createObjectURL(b);
      download((S.title||'notas')+(count>1?' part '+(i+1)+' of '+count:'')+'.png',u);
      setTimeout(()=>URL.revokeObjectURL(u),60000);
      if(count>1)await new Promise(r=>setTimeout(r,150));
    }
    if(count>1)C.toast('exported '+count+' readable images. allow multiple downloads if your browser asks.',7000);
  }catch(e){ C.toast('could not export that image.'); }
}
function downloadJSON(name,value){
  const text=C.exportText(value),limit=180*1024*1024;
  const send=(file,body)=>{const u=URL.createObjectURL(new Blob([body],{type:'application/json'}));download(file,u);setTimeout(()=>URL.revokeObjectURL(u),60000);};
  if(new Blob([text]).size<=limit){send(name,text);return;}
  const id=C.uid(),width=20*1024*1024,parts=Math.ceil(text.length/width);
  for(let part=0;part<parts;part++)setTimeout(()=>send(name.replace(/\.json$/i,'')+' part '+(part+1)+' of '+parts+'.json',JSON.stringify({notasParts:1,id,part,parts,text:text.slice(part*width,(part+1)*width)})),part*700);
  C.toast('this export has '+parts+' parts. select all parts with import in the notes library.',9000);
}

async function printNote(){
  /* opened inside the tap, before the drawing is awaited: Safari refuses a
     window opened after an await as a pop-up */
  const w = window.open('', '_blank');
  if(!w) return C.toast('allow pop-ups to print this note.');
  try{
    N.mathcore.run();
    const height=contentBottom(),pageHeight=Math.max(1,Math.floor(M.colW*1.414)),loaded=await loadImages();
    w.document.write('<title>'+esc(S.title)+'</title><style>@page{margin:10mm}body{margin:0}img{display:block;width:100%;break-after:page}img:last-child{break-after:auto}</style>');
    for(let top=0;top<height;top+=pageHeight){
      const cv=await renderExport({top,height:Math.min(pageHeight,height-top),loaded});
      const img=w.document.createElement('img');img.src=cv.toDataURL('image/png');w.document.body.appendChild(img);
      await img.decode();
    }
    w.document.close();w.focus();w.print();
  }catch(e){w.close();C.toast('could not print this note.');}
}

  input.onchange=()=>{const f=input.files&&input.files[0];input.remove();if(f)onFile(f);};
  document.body.appendChild(input);input.click();
}

/* Every way in (file picker, drop, Ctrl+V, the Paste image button) goes through
   one normaliser because images are stored inline as data URLs. A screenshot
   from a tablet or a 4K display is several times wider than the 720px column
   can show and would bloat the note for nothing, and SVG, BMP, HEIC or AVIF
   cannot come back through Import note, which only accepts PNG, JPEG, GIF and
   WebP. Oversized or unusual images are redrawn through a canvas; small files
   in a supported format keep their exact bytes, so an animated GIF stays
   animated and a photo is not recompressed. */
const IMAGE_MAX_SIDE=2000, IMAGE_KEEP_BYTES=4*1024*1024, IMAGE_MAX_CHARS=8*1024*1024;
/* what one note may hold in pictures, so that everything a note can hold
   also comes back through import */
const NOTE_IMAGES=200, NOTE_IMAGE_CHARS=64*1024*1024;
function imageRoom(adding){
  if(S.images.length>=NOTE_IMAGES){ C.toast('a note holds up to '+NOTE_IMAGES+' pictures. start a new note for more.',6000); return false; }
  const used=S.images.reduce((n,im)=>n+(im.src||'').length+(im.full||'').length+(im.bg||im.cut||'').length,0);
  if(used+adding>NOTE_IMAGE_CHARS){ C.toast('this note is full of pictures. start a new note for more.',6000); return false; }
  return true;
}
const IMAGE_KEEP=/^image\/(png|jpeg|gif|webp)$/i, IMAGE_OPAQUE=/^image\/(jpeg|bmp|tiff|heic|heif)$/i;
function readAsDataURL(f){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('could not read that image.'));
    r.onload=()=>resolve(r.result);
    r.readAsDataURL(f);
  });
}
async function normaliseImage(f){
  const url=URL.createObjectURL(f);
  try{
    const el=await new Promise((resolve,reject)=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('that image could not be opened.'));
      img.onload=()=>img.naturalWidth>0&&img.naturalHeight>0?resolve(img):reject(new Error('that image is empty.'));
      img.src=url;
    });
    /* A screenshot of a maths problem usually arrives with a wide band of
       page background around it. Trimming that (animated GIFs excepted, since
       they are kept byte for byte) makes the picture land at a useful size. */
    const crop=/^image\/gif$/i.test(f.type)?null:trimBox(el);
    const sx=crop?crop.x:0,sy=crop?crop.y:0,w=crop?crop.w:el.naturalWidth,h=crop?crop.h:el.naturalHeight,big=Math.max(w,h);
    if(!crop&&IMAGE_KEEP.test(f.type)&&big<=IMAGE_MAX_SIDE&&f.size<=IMAGE_KEEP_BYTES)return {src:await readAsDataURL(f),w,h};
    /* Opaque formats are re-encoded as JPEG. Anything that may carry
       transparency stays PNG so a cut-out pasted from another app keeps its
       edge. Each pass shrinks further until the data URL fits the note. */
    const opaque=IMAGE_OPAQUE.test(f.type);
    let side=Math.min(big,IMAGE_MAX_SIDE);
    while(true){
      const k=side/big,cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
      const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      const x=cv.getContext('2d');
      if(opaque){x.fillStyle='#fff';x.fillRect(0,0,cw,ch);}
      x.drawImage(el,sx,sy,w,h,0,0,cw,ch);
      const src=opaque?cv.toDataURL('image/jpeg',.9):cv.toDataURL('image/png');
      if(typeof src==='string'&&src.length<=IMAGE_MAX_CHARS&&src.length>'data:,'.length)return {src,w:cw,h:ch};
      if(side<=200)throw new Error('that image is too large to keep in a note.');
      side=Math.max(200,Math.round(side*.7));
    }
  }finally{URL.revokeObjectURL(url);}
}
/* The content box of an image whose four corners share one colour, in source
   pixels, with a small margin of that colour left around it. Measured on a
   reduced copy so a large screenshot costs nothing noticeable. Null means
   leave the image alone: no uniform border, nothing but border, or a trim too
   small to be worth re-encoding for. */
function trimBox(el){
  const W=el.naturalWidth,H=el.naturalHeight,k=Math.min(1,480/Math.max(W,H));
  const cw=Math.max(1,Math.round(W*k)),ch=Math.max(1,Math.round(H*k));
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  const x=cv.getContext('2d',{willReadFrequently:true});
  let d;
  try{x.drawImage(el,0,0,cw,ch);d=x.getImageData(0,0,cw,ch).data;}catch(e){return null;}
  const at=(i,j)=>(j*cw+i)*4;
  const c=at(0,0),differs=o=>Math.abs(d[o]-d[c])+Math.abs(d[o+1]-d[c+1])+Math.abs(d[o+2]-d[c+2])>30||Math.abs(d[o+3]-d[c+3])>10;
  if(differs(at(cw-1,0))||differs(at(0,ch-1))||differs(at(cw-1,ch-1)))return null;
  let l=cw,t=ch,r=-1,b=-1;
  for(let j=0;j<ch;j++)for(let i=0;i<cw;i++)if(differs(at(i,j))){if(i<l)l=i;if(i>r)r=i;if(j<t)t=j;if(j>b)b=j;}
  if(r<0)return null;
  const pad=16;
  const X=Math.max(0,Math.floor(l/k)-pad),Y=Math.max(0,Math.floor(t/k)-pad);
  const R=Math.min(W,Math.ceil((r+1)/k)+pad),B=Math.min(H,Math.ceil((b+1)/k)+pad);

}
/* Where a new image lands. A drop uses the pointer; anything else uses the top
   left of what is on screen, which on a horizontally panned tablet is not
   x=24. A repeat paste is stepped diagonally so it never sits exactly on top
   of the previous one, where it would look as though nothing had happened. */
function imageSpot(at,w,h){
  const sc=$('#scroller');
  const vo=N.ink.viewOrigin();
  let x=at?Number(at.x):Math.max(24,vo.x+24);
  let y=at?Number(at.y):vo.y+80;
  if(!Number.isFinite(x))x=24;if(!Number.isFinite(y))y=80;
  const maxX=Math.max(0,M.contentW-80);
  x=C.clamp(Math.round(x),0,maxX);y=Math.max(0,Math.round(y));
  for(let i=0;i<=S.images.length&&S.images.some(im=>Math.abs(im.x-x)<2&&Math.abs(im.y-y)<2);i++){x=Math.min(x+24,maxX);y+=24;}
  const iw=Math.min(M.contentW-x,Math.max(80,w));
  return {x,y,w:iw,h:iw*h/w};
}
/* Pasted while typing, an image joins the text the way it does in a document:
   under the line the caret is on (or in place of an empty one), left aligned,
   scaled to the column, with the lines below moved down to make room and the
   caret on a fresh line beneath it. */
function flowImage(img,ln){
  const lineH=Math.max(C.LINE_H,ln.h||C.LINE_H), gap=10;
  const maxW=M.contentW, maxH=Math.max(160,Math.round((M.vh*.6)/M.zoom));
  let w=Math.min(img.w,maxW), h=w*img.h/img.w;
  if(h>maxH){h=maxH;w=h*img.w/img.h;}
  w=Math.round(w);h=Math.round(h);
  const y=ln.text?ln.y+lineH+gap:ln.y;
  const im={id:C.uid(),z:Math.max(Date.now(),...S.images.map(i=>(i.z||0)+1)),x:0,y,w,h,src:img.src};
  const before=S.lines.map(l=>({...l}));
  /* room for the picture, and for the fresh line under it when one is added */
  const shift=h+gap*2+(ln.text?C.LINE_H:0);
  const nextId=C.uid();
  /* everything under the caret's line moves down; an empty caret line moves
     with it, since the picture takes its place */
  const after=before.map(l=>({...l,y:(l.y>ln.y||(l.id===ln.id&&!ln.text))?l.y+shift:l.y}));
  /* the caret continues under the picture: the empty line that was replaced,
     or a new line when the picture sits under written text */
  if(ln.text)after.push({id:nextId,y:y+h+gap*2,text:'',h:C.LINE_H});
  const ch=N.text.lineChanges(before,after),redraw=()=>{N.text.render();N.text.queue();};
  C.act('add image',()=>{if(!S.images.some(i=>i.id===im.id))S.images.push(im);ch.forward();redraw();},()=>{S.images=S.images.filter(i=>i.id!==im.id);ch.back();redraw();});
  N.text.focusLine(ln.text?nextId:ln.id,false);
  return im;
}
async function insertImageFile(f,at,flowLine){
  if(!f||!/^image\//i.test(f.type||''))return false;
  const note=S.id;
  let img;
  try{img=await normaliseImage(f);}
  catch(e){C.toast(e.message||'could not read that image.');return false;}
  // The note may have changed while a large image was decoding.
  if(note!==S.id)return false;
  if(!imageRoom(img.src.length))return false;
  let im;
  const line=flowLine&&S.lines.find(l=>l.id===flowLine.id);
  if(line)im=flowImage(img,line);
  else{
    im={id:C.uid(),z:Math.max(Date.now(),...S.images.map(i=>(i.z||0)+1)),...imageSpot(at,img.w,img.h),src:img.src};
    C.act('add image',()=>{if(!S.images.some(i=>i.id===im.id))S.images.push(im);},()=>{S.images=S.images.filter(i=>i.id!==im.id);});
  }
  C.growDoc(im.y+im.h);C.layout();N.ink.render();N.text.refreshPlaceholder();
  return true;
}
/* Several images at once (a multi-file drop, or a clipboard holding more than
   one) are added one after another so each lands offset from the last. */
async function insertImages(files,at,flowLine){
  const list=[...files||[]].filter(f=>f&&/^image\//i.test(f.type||''));
  if(!list.length)return 0;
  let n=0;
  for(const f of list){
    /* each picture flows under the line the previous one left the caret on */
    const line=flowLine?(N.text.focusedLine()||flowLine):null;
    if(await insertImageFile(f,at,line))n++;
  }
  return n;
}
/* Image files carried by a paste or drop. Chrome exposes a copied image both
   as an item and in .files; dedupe so it is not inserted twice. Copying a
   picture from a web page also carries text/html, so that is not a reason to
   treat the clipboard as text. */
function transferImages(dt){
  const out=[],seen=new Set();
  const add=f=>{if(!f||!/^image\//i.test(f.type||''))return;const key=f.name+'|'+f.size+'|'+f.type+'|'+f.lastModified;if(seen.has(key))return;seen.add(key);out.push(f);};
  if(dt&&dt.items)for(const it of dt.items)if(it.kind==='file')add(it.getAsFile());
  if(dt&&dt.files)for(const f of dt.files)add(f);
  return out;
}
function transferHasText(dt){
  const t=transferText(dt).trim();
  return !!t&&!/^notas-ink:\d+$/.test(t);
}
/* Ctrl/Cmd+V anywhere on the page. Inside a typed line the text on the
   clipboard still wins, so copying a paragraph that happens to include a
   picture pastes the words; an image on its own (a screenshot) is inserted
   even from a field, because the field could do nothing with it. A dialog
   keeps its own paste. */
document.addEventListener('paste', e=>{
  if(sheet)return;
  const dt=e.clipboardData;
  const files=transferImages(dt);
  const inLine=!!(e.target&&e.target.closest&&e.target.closest('#lines'));
  if(!files.length){
    /* Only the marker written by Copy means the ink is still the newest thing
       copied. Even inside a typed line the ink is what was asked for; the
       marker text itself would be nonsense there. */
    const text=transferText(dt);
    if(inkIsNewest(text)){e.preventDefault();N.ink.pasteInk();return;}
    /* into a typed line go the words alone: the browser would paste markup */
    if(inLine){e.preventDefault();N.text.pasteText(text);}
    return;
  }
  if(N.ink.isTyping(e)&&transferHasText(dt)){ if(inLine){e.preventDefault();N.text.pasteText(transferText(dt));} return; }
  e.preventDefault();
  insertImages(files,undefined,N.ink.isTyping(e)?N.text.focusedLine():null);
});
/* Safari only enables Paste in its Edit menu for a page that says it will
   handle it. */
document.addEventListener('beforepaste', e=>{ if(!sheet && !N.ink.isTyping(e)) e.preventDefault(); });
function transferText(dt){ try{return dt&&dt.getData?dt.getData('text/plain'):'';}catch(e){return '';} }
/* 'unknown' is for a clipboard that could not be read at all: then the copied
   ink is the best guess, since the marker could not have been checked. */
function inkIsNewest(text){
  const clip=N.ink.readClip(); if(!clip) return false;
  if(text==='unknown')return true;
  return String(text||'').trim()===N.ink.clipMarker(clip);
}
/* Tablets have no Ctrl+V outside a text field, and iPadOS never delivers a
   paste event to a page that has no focused field. The menu button asks the
   clipboard directly instead; the browser shows its own paste prompt. The
   read must start inside the tap that requested it, so nothing awaits first.
   Copied ink is pasted when it is the newest thing copied, or when the
   clipboard cannot be read at all and there is nothing else to go on. */

  return !!(navigator.clipboard&&typeof navigator.clipboard.read==='function'&&window.isSecureContext);

async function pasteFromClipboard(){
  const apple=/Mac|iPhone|iPad|iPod/.test(navigator.platform||'')||/Mac OS/.test(navigator.userAgent||'');
  const key=apple?'⌘V':'Ctrl+V';
  if(!clipboardReadable()){
    if(inkIsNewest('unknown'))return N.ink.pasteInk();
    C.toast('this browser cannot read the clipboard here. press '+key+' on the page instead.',5000);return false;
  }
  let items;
  try{items=await navigator.clipboard.read();}
  catch(e){
    if(inkIsNewest('unknown'))return N.ink.pasteInk();
    const blocked=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    C.toast(blocked?'notas was not allowed to read the clipboard. allow paste when asked, or press '+key+' on the page.':'could not read the clipboard. press '+key+' on the page instead.',5000);
    return false;
  }
  const files=[];let text='';
  for(const item of items||[]){
    const type=(item.types||[]).find(t=>/^image\//i.test(t));
    if(!type){
      if((item.types||[]).includes('text/plain'))try{text=await (await item.getType('text/plain')).text();}catch(e){}
      continue;
    }
    try{
      const blob=await item.getType(type);
      files.push(new File([blob],'pasted.'+(type.split('/')[1]||'png').replace(/[^a-z0-9]/gi,''),{type:blob.type||type}));
    }catch(e){}
  }
  if(files.length)return (await insertImages(files))>0;
  if(inkIsNewest(text))return N.ink.pasteInk();
  /* ink cut here and not pasted since is the one thing that would be lost */
  if(N.ink.pasteCut())return true;
  C.toast(N.ink.readClip()?'nothing new to paste. copy ink with select, or copy an image, then try again.':'nothing to paste. copy ink with select, or copy an image, then try again.',4500);
  return false;
}

  if(!Array.isArray(doc.lines)||!Array.isArray(doc.strokes)||!Array.isArray(doc.images))throw new Error('this note export is incomplete.');

    hash:t.hash,...(Array.isArray(t.bbox)&&t.bbox.length===4&&t.bbox.every(coord)?{bbox:t.bbox.map(Number)}:{}),latex:typeof t.latex==='string'?t.latex.slice(0,2000):'',ascii:typeof t.ascii==='string'?t.ascii.slice(0,2000):'',
    kind:t.kind==='expression'?'expression':'expression',modelVersion:typeof t.modelVersion==='string'?t.modelVersion.slice(0,100):'',
    alternatives:Array.isArray(t.alternatives)?t.alternatives.filter(x=>typeof x==='string').slice(0,20):[],confirmed:!!t.confirmed,needsConfirmation:!!t.needsConfirmation,
    confidence:Number.isFinite(Number(t.confidence))?Number(t.confidence):0,asked:!!t.asked,...(t.dismissed?{dismissed:true}:{}),
    plotVals:t.plotVals&&typeof t.plotVals==='object'?Object.fromEntries(Object.entries(t.plotVals).filter(([k,v])=>/^[A-Za-z_]\w*$/.test(k)&&Number.isFinite(Number(v))).slice(0,50).map(([k,v])=>[k,Number(v)])):null
  })):[];
  const settings={};
  if(doc.settings&&typeof doc.settings==='object'){
    if(doc.settings.angle==='deg'||doc.settings.angle==='rad')settings.angle=doc.settings.angle;
    if(typeof doc.settings.fractions==='boolean')settings.fractions=doc.settings.fractions;
    if(typeof doc.settings.aiOn==='boolean')settings.aiOn=doc.settings.aiOn;
  }
  const answers=Array.isArray(doc.answers)?doc.answers.filter(e=>Array.isArray(e)&&typeof e[0]==='string'&&e[0].length<=1000&&e[1]&&typeof e[1].key==='string'&&e[1].key.length<=250000&&typeof e[1].result==='string'&&e[1].result.length<=250000).slice(0,20000):[];
  return {title:typeof doc.title==='string'?doc.title.slice(0,500):'imported note',strokes,lines,images,textTranscripts,transcripts,answers,
    created:Number.isFinite(Number(doc.created))&&Number(doc.created)>0?Number(doc.created):Date.now(),folder:typeof doc.folder==='string'?doc.folder.slice(0,200):'',
    docH:finite(doc.docH,2e6)?Math.max(1600,Number(doc.docH)):1600,settings};
}
async function importNoteFile(f){
  if(changingNote)return false;
  changingNote=true;
  try{
    if(!await settle())return false;
    if(f.size>200*1024*1024)throw new Error('that note export is too large to import safely.');
    const raw=JSON.parse(await f.text());
    if(raw?.notasParts)throw Error('select all parts together using import in the notes library.');
    /* a backup of many notes goes into the library rather than onto the page */
    if(raw&&raw.notasBundle&&Array.isArray(raw.notes)&&N.library)return await N.library.importBundle(raw);
    const doc=validateImportedNote(raw);
    /* what was written while the file was read belongs to the old note */
    if(S.dirty&&!await settle())return false;
    blank();
    N.collab&&N.collab.noteChanged();
    S.title=typeof doc.title==='string'&&doc.title.trim()?doc.title.trim():'imported note';
    S.created=doc.created;
    if(doc.folder)S.newFolder={id:S.id,folder:doc.folder};
    S.strokes=doc.strokes;S.lines=doc.lines;S.images=doc.images;
    S.textTranscripts=doc.textTranscripts;
    S.docH=Math.max(1600,Number(doc.docH)||1600);
    if(doc.settings)for(const k of ['angle','fractions','aiOn'])if(k in doc.settings)S.settings[k]=doc.settings[k];
    C.applyPrefs();
    for(const t of doc.transcripts)N.recog.cache.set(t.hash,t);
    if(!S.lines.length)S.lines.push({id:C.uid(),y:120,text:'',h:C.LINE_H});
    paintAll(doc.answers);$('#scroller').scrollTop=0;$('#scroller').scrollLeft=0;
    C.markDirty();
    if(!await C.save())return false;
    return true;
  }catch(e){C.toast(e&&e.message?e.message:'could not import that note.',7000);return false;}
  finally{changingNote=false;}
}

/* ---- ask bar ---- */
let askOpen = false, holdT = null, held = false, askTimer = null;
function showAsk(on){
  if(askOpen === on) return;
  askOpen = on;

  clearTimeout(askTimer);

/* ---- theme ---- */
/* a colour from settings, or '' for the theme's own */
function cssColor(v){ return typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) ? v : ''; }
function applyTheme(){
  const root = document.documentElement;
  /* white paper is the light palette on white: graphite ink stays dark on it */
  const white = S.settings.paper === 'white', t = white ? 'light' : S.settings.theme;
  if(t === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', t);
  if(white) root.dataset.paper = 'white'; else delete root.dataset.paper;

/* Keep the active typed line above a software keyboard without maintaining a
   second layout model. Android's interactive-widget mode usually resizes the
   content viewport itself; iPadOS exposes the same change through visualViewport. */
if(window.visualViewport){
  let viewportRaf=0;
  const keepEditorVisible=()=>{
    if(viewportRaf)return;
    viewportRaf=requestAnimationFrame(()=>{
      viewportRaf=0;
      const active=document.activeElement;
      if(!active)return;
      /* the editing host is the whole page; the line the caret is in is what must show */
      const el=active.closest?.('#lines')?(N.text&&N.text.currentText&&N.text.currentText()):(active.matches?.('#ask-in,.keyin,#search')?active:null);
      if(!el)return;
      try{el.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}
    });
  };
  visualViewport.addEventListener('resize',keepEditorVisible,{passive:true});
  visualViewport.addEventListener('scroll',keepEditorVisible,{passive:true});
}

/* ---- keyboard ---- */
let springFrom = null, springAt = 0;
window.addEventListener('keydown', e=>{
  const typing = N.ink.isTyping(e);
  const mod = e.metaKey || e.ctrlKey;
  if(e.isComposing || e.keyCode===229 || typeof e.key !== 'string') return;   /* Scribble sends key events without a key */
  const k = e.key.toLowerCase();
  /* App-level commands work even while a typed line has focus. Undo is
     deliberately excluded here so Ctrl/Cmd+Z remains native text undo. */
  if(mod && k === 's'){ e.preventDefault(); C.save({announce:true}); return; }
  if(mod && e.key === ','){ e.preventDefault(); menuSheet(); return; }
  if(mod && e.shiftKey && k === 'o'){ e.preventDefault(); notesSheet(); return; }
  /* ctrl/cmd K finds a note, unless the hint bar (hidden in this build) is back */
  if(mod && !e.shiftKey && k === 'k' && $('#ask-dot').hidden){ e.preventDefault(); notesSheet(); return; }
  if(mod && e.shiftKey && k === 'n'){ e.preventDefault(); newNote(); return; }
  if((mod && e.key === '/') || (!typing && e.key === '?')){ e.preventDefault(); shortcutsSheet(); return; }
  if(typing) return;
  if(e.defaultPrevented)return;
  if(document.querySelector('.sheet:not(.leave)') || N.library?.modal){ if(e.key==='Escape'){e.preventDefault();closeSheet();} return; }
  if(mod && k === 'a'){ e.preventDefault(); N.ink.selectAll(); return; }
  /* The hint surface is intentionally hidden in this build. Do not let its old
     shortcut expose a panel that has no visible launcher. */
  if(mod && k === 'k' && !$('#ask-dot').hidden){ e.preventDefault(); showAsk(!askOpen); return; }
  if(N.ink.cropping()){
    if(e.key === 'Enter'){ e.preventDefault(); N.ink.applyCrop(); return; }
    if(e.key === 'Escape'){ e.preventDefault(); N.ink.cancelCrop(); return; }
  }
  if(e.key === 'Escape'){ closeSheet(); showAsk(false); N.ink.setPenPop(false); N.ink.setTextPop(false); N.ink.clearSelection(); return; }
  /* a sheet or the library over the page has the keys: Delete on a note in
     the list trashed it and deleted the ink selected behind it as well */
  if(document.querySelector('.sheet:not(.leave)') || (N.library && N.library.modal) || (e.target && e.target.closest && e.target.closest('.sheet'))) return;
  /* the docked list keeps the page's other shortcuts, but Delete there is the note's */
  if((e.key === 'Delete' || e.key === 'Backspace') && e.target && e.target.closest && e.target.closest('#library')) return;
  if(mod && k === 'z'){ e.preventDefault(); e.shiftKey ? C.redo() : C.undo(); return; }
  if(mod && k === 'y'){ e.preventDefault(); C.redo(); return; }
  /* Shift makes the key 'Z', and Caps Lock does too: compare the lower case */
  if(k === 'z' && !mod && !e.altKey){ e.shiftKey ? C.redo() : C.undo(); return; }
  const map = {'p':'pen','v':'select','t':'text'};
  if(!mod && !e.altKey && map[k]){ N.ink.setTool(map[k]); if(map[k] === 'pen') penNotice(); return; }
  if(!mod && !e.altKey && k === 'e' && !e.repeat){ springFrom = S.tool; springAt = Date.now(); N.ink.setTool('eraser'); }
  if(e.key === 'Delete' || e.key === 'Backspace'){
    if(S.imageSelection){
      const del=[...document.querySelectorAll('#selbar button')].find(b=>b.textContent==='delete');
      if(del)del.click();
    }else if(S.selection.length){
      N.ink.deleteSelection();
    }
  }
  /* Copy, cut and duplicate act on lassoed ink. Paste is the paste event, so
     the system clipboard gets to say whether an image was copied since. */
  if(mod && S.selection.length && !e.shiftKey && !e.altKey){
    if(k === 'c'){ e.preventDefault(); N.ink.copySelection(false); return; }
    if(k === 'x'){ e.preventDefault(); N.ink.copySelection(true); return; }
    if(k === 'd'){ e.preventDefault(); N.ink.duplicateSelection(); return; }
  }
});
window.addEventListener('keyup', e=>{
  if(typeof e.key === 'string' && e.key.toLowerCase() === 'e' && springFrom){
    /* held long enough to be a spring, short enough to be a switch */
    if(!N.ink.isTyping(e) && Date.now() - springAt > 350) N.ink.setTool(springFrom);
    springFrom = null;
  }
});
window.addEventListener('blur', ()=>{ if(springFrom){N.ink.setTool(springFrom);springFrom=null;} });
$('#btn-undo').onclick = ()=>C.undo();
$('#btn-share').onclick = ()=>N.collab && N.collab.share();

/* ---- models: what is arriving behind the page ----
   The handwriting readers are fetched in the background, so nothing holds
   the notebook. The button in the bar wears a ring that fills while a model
   is on its way and opens a popover naming it, with how far along; a model
   that has arrived leaves the list, and an empty list says so. Rows are
   updated in place: a count that changes every few hundred milliseconds
   must not rebuild the list. The other readers still report here (the
   offline copy, the algebra engine) so a chip can ask after them, but only
   the models are shown. */
const DL = new Map();
const DL_MODELS = ['ink','text','cutout'];
const DL_NAMES = { ink:'hand-to-tex stroke reader', text:'pp-ocrv6 small text reader', cutout:'birefnet lite background remover', offline:'offline copy of notas', cas:'algebra engine' };
const DL_BUSY = new Set(['download','starting','loading','preparing']);
const dlPop = $('#dlpop'), dlBtn = $('#btn-downloads');
function dlSet(key, phase, detail, retry, loaded, total){
  const was = DL.get(key);
  loaded = loaded || 0; total = total || 0;
  if(was && was.phase === phase && (was.detail||'') === (detail||'') && was.loaded === loaded && was.total === total) return;
  DL.set(key, { phase, detail:detail||'', retry:retry || (was && was.retry) || null, loaded, total });
  dlPaint();
}
/* a model counts as arriving once its bytes are: "fetching" before the
   first byte, or a stored copy being read, shows nothing */
function dlArriving(key){ const d = DL.get(key); return !!d && d.phase === 'download' && d.loaded > 0; }
function dlBusy(){ for(const d of DL.values()) if(DL_BUSY.has(d.phase)) return true; return false; }
function dlMB(n){ return (n/1048576).toFixed(2)+' MB'; }
function dlPaint(){
  const rows = DL_MODELS.filter(dlArriving), ring = $('#dl-ring');
  if(ring){
    ring.hidden = !rows.length;
    let l = 0, t = 0, known = true;
    for(const k of rows){ const d = DL.get(k); l += d.loaded; if(d.total) t += d.total; else known = false; }
    ring.classList.toggle('spin', !known || !t);
    ring.style.setProperty('--p', known && t ? Math.min(100, Math.round(100*l/t)) : 0);
  }
  if(dlBtn){ const words = rows.length ? 'models, downloading' : 'models'; dlBtn.title = words; dlBtn.setAttribute('aria-label', words); }
  if(dlPop && !dlPop.hidden) dlRender();
}
function dlRender(){
  const list = dlPop.querySelector('.dl-list'); if(!list) return;
  const keys = DL_MODELS.filter(dlArriving);
  const shape = keys.join('|');
  if(list.dataset.shape !== shape){
    list.dataset.shape = shape;
    list.innerHTML = keys.length ? keys.map(k=>
      '<div class="dl-row" data-key="'+k+'"><i class="ph ph-cube"></i><span class="dl-name">'+esc(DL_NAMES[k])+'</span>' +
      '<span class="dl-bar"><span><i></i></span><span><i></i></span><span><i></i></span></span>' +
      '<span class="dl-state"><span class="dl-spin"></span><span class="dl-words"></span></span></div>').join('')
      : '<p class="dl-empty">no models are being downloaded yet.</p>';
  }
  for(const row of list.querySelectorAll('.dl-row')){
    const d = DL.get(row.dataset.key), words = row.querySelector('.dl-words'), parts = row.querySelectorAll('.dl-bar span > i');
    const p = d.total ? Math.min(1, d.loaded/d.total) : 0;
    const text = 'downloading: ' + (d.total ? Math.round(100*p)+'%, ' : '') + dlMB(d.loaded);
    if(words.textContent !== text) words.textContent = text;
    /* three segments fill in turn, the whole bar being the whole download */
    parts.forEach((part, i)=>{ part.style.width = Math.round(100*Math.max(0, Math.min(1, p*parts.length - i)))+'%'; });
  }
}
function dlPlace(){
  const r=dlBtn.getBoundingClientRect(), v=window.visualViewport;
  const x=v?v.offsetLeft:0, y=v?v.offsetTop:0, w=v?v.width:innerWidth, h=v?v.height:innerHeight;
  const bar=$('#topbar').getBoundingClientRect();
  const left=Math.max(x+12,bar.left), right=Math.min(x+w-12,bar.right);
  const width=Math.max(0,Math.min(400,right-left));
  const top=Math.max(y+12,Math.min(r.bottom+8,y+h-80));
  dlPop.style.width=width+'px';
  dlPop.style.left=Math.max(left,Math.min(r.right-width,right-width))+'px';
  dlPop.style.right='auto';
  dlPop.style.top=top+'px';
  dlPop.style.maxHeight='max(0px, calc('+Math.max(0,y+h-12-top)+'px - var(--safe-b)))';
}
function dlOpen(open){
  if(dlPop.hidden === !open) return;
  dlPop.hidden = !open;
  dlBtn.setAttribute('aria-expanded', String(open));
  if(open){ dlRender(); dlPlace(); dlPop.focus({preventScroll:true}); }
  else if(document.activeElement === dlPop) dlBtn.focus({preventScroll:true});
}
dlBtn.onclick = ()=>dlOpen(dlPop.hidden);
dlPop.addEventListener('keydown', e=>{ if(e.key === 'Escape'){ e.preventDefault(); dlOpen(false); } });
document.addEventListener('pointerdown', e=>{ if(!dlPop.hidden && !dlPop.contains(e.target) && !dlBtn.contains(e.target)) dlOpen(false); }, true);
addEventListener('resize', ()=>{ if(!dlPop.hidden) dlPlace(); });
for(const type of ['resize','scroll']) window.visualViewport?.addEventListener(type,()=>{ if(!dlPop.hidden) dlPlace(); });
/* the two readers report their own setup; the panel mirrors it */
function dlSyncReaders(){
  if(!N.ai) return;
  const a = N.ai.setupState ? N.ai.setupState() : null, t = N.ai.textSetupState ? N.ai.textSetupState() : null;
  if(a) dlSet('ink', a.phase, a.detail, N.ai.retry, a.loaded, a.total);
  if(t) dlSet('text', t.phase, t.detail, N.ai.retryText, t.loaded, t.total);
}
if(N.ai && N.ai.watch){ N.ai.watch(dlSyncReaders); N.ai.watchText && N.ai.watchText(dlSyncReaders); dlSyncReaders(); }
N.downloads = { set:dlSet, sync:dlSyncReaders, open:dlOpen, busy:dlBusy };
$('#btn-redo').onclick = ()=>C.redo();
$('#btn-menu').onclick = menuSheet;
$('#brand').onclick = ()=>N.library ? N.library.toggle({overview:true}) : notesSheet();
/* the title edits where it sits: tap it, type, and Enter or a tap elsewhere
   keeps the new name. Escape puts the old one back. */
const titleEl = $('#title'), titleIn = $('#title-edit');
function editTitle(){
  if(!titleIn.hidden) return;
  titleIn.value = S.title === 'untitled' ? '' : S.title;
  titleIn.placeholder = C.displayTitle(S.title, S.lines);
  /* a preferred width, not a fixed one: the bar may shrink it further */
  titleIn.style.width = Math.max(120, Math.min(titleEl.offsetWidth + 32, Math.round(innerWidth * .44))) + 'px';
  titleEl.hidden = true; titleIn.hidden = false;
  document.body.classList.add('renaming');
  titleIn.focus(); titleIn.select();
}
function refreshTitle(){ titleEl.textContent = C.displayTitle(S.title, S.lines); }
function endTitleEdit(keep){
  if(titleIn.hidden) return;
  if(keep){
    const v = titleIn.value.trim() || 'untitled';
    if(v !== S.title){ S.title = v; C.markDirty(); }
  }
  refreshTitle();
  titleIn.hidden = true; titleEl.hidden = false;
  document.body.classList.remove('renaming');
}
titleEl.onclick = editTitle;
titleIn.addEventListener('keydown', e=>{
  if(e.isComposing || e.keyCode===229)return;
  if(e.key === 'Enter'){ e.preventDefault(); endTitleEdit(true); titleEl.focus(); }
  else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); endTitleEdit(false); titleEl.focus(); }
});
titleIn.addEventListener('blur', ()=>endTitleEdit(true));

/* ---- icon fallback: if Phosphor did not load, the letters teach the keys ---- */
function checkIcons(){
  const ok = ()=>{ try{ return document.fonts.check('16px Phosphor'); }catch(e){ return true; } };
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(!ok()) document.body.classList.add('noicons'); });
}

document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ C.flushView(); C.rescueSave(); C.save().then(()=>N.library && N.library.leaving()); } });
/* pagehide is the last event some browsers give (a tab closed, a page
   bfcached without a visibility change): a note with unsaved words starts
   its save here too */
window.addEventListener('pagehide', ()=>{ C.flushView(); if(S.dirty){C.rescueSave(); C.save();} const t=$('#toast'); if(t) t.classList.remove('in'); });
window.addEventListener('beforeunload', e=>{ C.flushView(); if(S.dirty){ C.save(); } });

/* closing "the panel" from outside also closes the notes library when it
   is the thing covering the page */
function closePanel(immediate){ if(!sheet && immediate !== true && N.library) N.library.close(); closeSheet(immediate); }
N.ui = { openSheet, closeSheet:closePanel, notesSheet, menuSheet, privacySheet, penNotice, refreshTitle, newNote, openNote,
         shortcutsSheet, applyTheme, checkIcons, showAsk, exportPNG, exportJSON, printNote, renderExport, downloadJSON, paintAll,
         searchText, searchHit, fuzzyHandwriting, chooseImage, chooseNoteImport, importNoteFile,
          insertImageFile, insertImages, pasteFromClipboard, transferImages, transferHasText, imageSpot, normaliseImage,
          validateImportedNote, download, esc, get changing(){ return changingNote; } };
})();

<script>
/* =========================================================================
   LIBRARY - every note, where it lives, and what it looks like.
   One panel, three shapes. On a phone it is a page of its own: the list is
   somewhere you go, and a sheet over the paper had its search box buried by
   the keyboard and its swipe-to-close fighting the list's own scrolling.
   On a tablet it is a drawer over the paper; on a desktop it docks beside
   it and stays open while you write. Short, focused choices (a note's
   actions, where to move it, confirming a delete) are still sheets on touch
   and a small menu under the pointer on a desktop.
   Notes are filed in flat folders, can be pinned, and go to a trash that
   keeps notes until they are explicitly deleted. Each has a small WebP picture of its first
   screen, because a page of handwriting is recognised by its shape long
   before anyone reads its title.
   ========================================================================= */
(function(){
'use strict';
const C = N.core, S = C.S, M = C.M, $ = C.$;
const el = $('#library'), panel = el.querySelector('.lib-panel'), list = $('#notelist');
const search = $('#search'), chips = el.querySelector('.lib-chips'), heading = $('#lib-heading');
const selbar = el.querySelector('.lib-selbar'), undoBar = $('#lib-undo');
const esc = s=>N.ui.esc(s);
const TRASH_DAYS = 30, THUMB_W = 400, THUMB_H = 300, THUMB_EVERY = 30000;

/* ---- shape ---- */
const mqDock = matchMedia('(pointer:fine) and (min-width:1100px)');
const mqWide = matchMedia('(min-width:700px)');
const mqFine = matchMedia('(pointer:fine)');
function shape(){ return mqDock.matches ? 'dock' : mqWide.matches ? 'drawer' : 'page'; }

/* ---- preferences: sort order, whether the desktop sidebar stays open ---- */
const PREF_KEY = 'notas.library';
function prefs(){ try{ return JSON.parse(localStorage.getItem(PREF_KEY)||'{}')||{}; }catch(e){ return {}; } }
function setPref(k, v){ const p = prefs(); p[k] = v; try{ localStorage.setItem(PREF_KEY, JSON.stringify(p)); }catch(e){} }

const L = { open:false, view:'all', query:'', rows:[], ix:[], folders:[], selecting:false, sel:new Set(),
            pushed:false, docs:new Map(), hits:null, purged:false, searchSeq:0 };

/* ---- folders: flat names; an empty folder is remembered on its own ---- */
function cleanFolder(v){ return String(v||'').replace(/\s+/g,' ').trim().slice(0,60); }
async function loadFolders(){
  const kept = (await C.Store.get('notas.folders')) || [];
  const all = new Set(kept.map(cleanFolder).filter(Boolean));
  for(const r of L.ix) if(r.folder) all.add(r.folder);
  return [...all].sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:'base', numeric:true}));
}
async function saveFolders(names){ await C.Store.set('notas.folders', [...new Set(names.map(cleanFolder).filter(Boolean))]); }

/* ---- the list ---- */
function title(r){ const name=C.cleanTitle(r.title); return name&&name!=='untitled'?name:(r.preview||'untitled'); }
function inView(r){
  if(L.query) return !r.trashed;
  if(L.view === 'trash') return !!r.trashed;
  if(r.trashed) return false;
  if(L.view === 'shared') return !!(N.collab && N.collab.isShared(r.id));
  if(L.view.startsWith('f:')) return r.folder === L.view.slice(2);
  return true;
}
function sorted(rows){
  const by = prefs().sort || 'updated';
  const cmp = by === 'name' ? (a,b)=>title(a).localeCompare(title(b), undefined, {sensitivity:'base', numeric:true})
            : by === 'created' ? (a,b)=>(b.created||b.updated||0)-(a.created||a.updated||0)
            : (a,b)=>(b.updated||0)-(a.updated||0);
  const trash = L.view === 'trash';
  return rows.slice().sort((a,b)=>trash ? (b.trashed-a.trashed) : ((!!b.pinned - !!a.pinned) || cmp(a,b)));
}
let unreadWarned = 0;
async function refresh(){
  /* a list that cannot be read now keeps what it showed last */
  try{ L.ix = await C.Store.index(); }
  catch(e){ if(Date.now()-unreadWarned > 60000){ unreadWarned = Date.now(); C.toast('your notes could not be read just now. they are safe. reload if this keeps happening.', 7000); } }
  if(L.open&&el.dataset.mode==='overview')updateCurrentPreview();
  warnTrashedHere();
  await purgeTrash();
  L.folders = await loadFolders();
  if(L.view.startsWith('f:') && !L.folders.includes(L.view.slice(2))) L.view = 'all';
  if(L.view === 'shared' && !L.ix.some(r=>!r.trashed && N.collab && N.collab.isShared(r.id))) L.view = 'all';
  const ids = new Set(L.ix.map(r=>r.id));
  for(const id of [...L.sel]) if(!ids.has(id)) L.sel.delete(id);
  /* an untitled note is named by its first line, which the row may have from
     before its handwriting was read. Notes already in memory are named now;
     the rest are read after the list is on screen, not before it */
  const unread = [];
  for(const row of L.ix){
    if(named(row)) continue;
    if(row.id !== S.id && !L.docs.has(row.id)){ unread.push(row.id); continue; }
    row.preview = previewOf(row) || row.preview;
  }
  const seq = ++previewSeq;
  darkMemo = null;
  paintChips();
  if(L.query) await runSearch(L.query); else paint();
  if(unread.length) fillPreviews(unread, seq);
}
function named(r){ const n = C.cleanTitle(r.title); return !!n && n !== 'untitled'; }
function previewOf(row){
  if(row.id === S.id) return C.firstLine(S.lines, S.textTranscripts, S.clusters);
  const doc = L.docs.get(row.id);
  return doc ? C.firstLine(doc.lines, doc.textTranscripts, doc.transcripts) : '';
}
let previewSeq = 0;
async function fillPreviews(ids, seq){
  await settled();
  for(let i = 0; i < ids.length; i += 16){
    if(seq !== previewSeq || !L.open) return;
    await Promise.all(ids.slice(i, i+16).map(docOf));
  }
  if(seq !== previewSeq || !L.open) return;
  const want = new Set(ids), changed = [];
  for(const row of L.ix){
    if(!want.has(row.id) || named(row)) continue;
    const p = previewOf(row) || row.preview;
    if(p !== row.preview){ row.preview = p; changed.push(row); }
  }
  if(!changed.length) return;
  /* sorted by name, a new name can move a row; otherwise it is relabelled in place */
  if(prefs().sort === 'name' && !L.query){ paint(); return; }
  for(const row of changed){
    const d = list.querySelector('.note-row[data-id="'+CSS.escape(row.id)+'"]'); if(!d) continue;
    d.querySelector('.lib-name').textContent = title(row);
    d.querySelector('.lib-thumb-txt').textContent = row.preview || '';
    d.querySelector('.lib-more').setAttribute('aria-label', 'more for '+title(row));
  }
}
/* Work the list can do without (reading whole notes, drawing their pictures)
   waits until it has finished arriving: done during the view transition or
   the panel's slide, it costs that animation its frames. */
let settleAt = 0;
async function settled(){
  await overviewNavigation;
  const wait = settleAt - performance.now();
  if(wait > 0) await new Promise(r=>setTimeout(r, wait));
  await new Promise(r=>(window.requestIdleCallback||setTimeout)(r, {timeout:400}));
}
/* Trash is retained until explicitly deleted, even if the device clock jumps. */
async function purgeTrash(){ L.purged=true; }
/* The open note went to the trash from another tab. It still saves, but
   into the trash, so the page says so once rather than let it be written
   in until it is purged. */
let trashedWarned = null;
/* notes this tab is moving to the trash itself: it moves off them anyway */
const trashingHere = new Set();
function warnTrashedHere(){
  for(const id of trashingHere) if(id !== S.id) trashingHere.delete(id);
  if(trashingHere.has(S.id)) return;
  const row = L.ix.find(r=>r.id===S.id);
  if(!row || !row.trashed){ if(trashedWarned===S.id) trashedWarned = null; return; }
  if(trashedWarned === S.id) return;
  trashedWarned = S.id;
  C.toast('this note is in the trash (moved there from another tab). restore it from the trash to keep it.', 9000);
}

function chip(view, icon, label, count){
  const on = L.view === view;
  return '<button type="button" class="lib-chip" role="tab" aria-selected="'+on+'" data-view="'+esc(view)+'">' +
    '<i class="ph '+icon+'" aria-hidden="true"></i><span>'+esc(label)+'</span>' +
    (count ? '<span class="n">'+count+'</span>' : '') + '</button>';
}
function paintChips(){
  el.classList.toggle('searching',!!L.query);
  const live = L.ix.filter(r=>!r.trashed), trashed = L.ix.length - live.length;
  const shared = live.filter(r=>N.collab && N.collab.isShared(r.id)).length;
  chips.innerHTML =
    chip('all','ph-notebook','all notes', live.length) +
    (shared ? chip('shared','ph-users','shared', shared) : '') +
    L.folders.map(f=>chip('f:'+f,'ph-folder-simple', f, live.filter(r=>r.folder===f).length)).join('') +
    '<button type="button" class="lib-chip add" data-add="1"><i class="ph ph-folder-simple-plus" aria-hidden="true"></i><span>new folder</span></button>' +
    chip('trash','ph-trash','trash', trashed);
  heading.textContent = L.query ? 'notes' : L.view === 'trash' ? 'trash' : L.view === 'shared' ? 'shared' : L.view.startsWith('f:') ? L.view.slice(2) : 'notes';
  $('#lib-fab').hidden = L.view === 'trash';
}
chips.addEventListener('click', e=>{
  const b = e.target.closest('.lib-chip'); if(!b) return;
  if(b.dataset.add){ newFolderSheet(); return; }
  setView(b.dataset.view);
});
/* arrow keys walk the folders, as in any row of tabs */
chips.addEventListener('keydown', e=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
  const all = [...chips.querySelectorAll('.lib-chip')], at = all.indexOf(document.activeElement); if(at<0) return;
  e.preventDefault();
  const next = all[(at + (e.key==='ArrowLeft'||e.key==='ArrowUp' ? -1 : 1) + all.length) % all.length];
  next.focus(); next.scrollIntoView({block:'nearest', inline:'nearest'});
});
function setView(v){
  if(L.view === v) return;
  L.view = v; endSelect(); paintChips();
  if(L.query) runSearch(L.query); else paint();
  list.scrollTop = 0;
}

function emptyText(){
  if(L.query) return 'no notes match that yet.';
  if(L.view === 'trash') return 'the trash is empty. notes stay here until you delete them forever.';
  if(L.view === 'shared') return 'no shared notes.';
  if(L.view.startsWith('f:')) return 'nothing in this folder yet. move notes here from their menu, or start one with new note.';
  return 'no notes yet. start one with new note.';
}
function meta(r){
  const bits = [];
  if(L.view === 'trash') bits.push('deleted '+C.whenLabel(r.trashed));
  else bits.push(C.whenLabel(prefs().sort === 'created' ? (r.created||r.updated) : r.updated));
  if(r.folder && !L.view.startsWith('f:')) bits.push(r.folder);
  return bits.join(' · ');
}
function paint(hits){
  const focusId = document.activeElement && document.activeElement.closest && document.activeElement.closest('.note-row')?.dataset.id;
  const keepTop = list.scrollTop;
  const rows = hits ? hits.map(h=>h.row) : sorted(L.ix.filter(inView));
  L.rows = rows; L.hits = hits || null;
  list.innerHTML = '';
  list.classList.toggle('selecting', L.selecting);
  if(!rows.length){ list.innerHTML = '<p class="lib-empty">'+esc(emptyText())+'</p>'; paintSel(); return; }
  /* one string, parsed once: a few hundred notes built row by row was a
     visible pause before the list appeared */
  const hitOf = new Map((hits||[]).map(h=>[h.row.id, h]));
  const drag = mqFine.matches && L.view !== 'trash', html = [];
  for(const r of rows){
    const h = hitOf.get(r.id);
    const shared = N.collab && N.collab.isShared(r.id);
    html.push('<div class="note-row'+(L.sel.has(r.id)?' sel':'')+'" data-id="'+esc(r.id)+'" role="listitem"'+(r.id === S.id?' aria-current="true"':'')+(drag?' draggable="true"':'')+'>' +
      '<span class="lib-swipe" aria-hidden="true"><span class="l"><i class="ph ph-push-pin"></i>'+(r.pinned?'unpin':'pin')+'</span>' +
        '<span class="r"><i class="ph ph-trash"></i>'+(L.view==='trash'?'restore':'trash')+'</span></span>' +
      '<div class="lib-card">' +
        '<span class="lib-tick" aria-hidden="true"><i class="ph '+(L.sel.has(r.id)?'ph-check-circle':'ph-circle')+'"></i></span>' +
        '<button type="button" class="t" '+(L.selecting?'aria-pressed="'+L.sel.has(r.id)+'"':'')+'>' +
          '<span class="lib-thumb" data-thumb="'+esc(r.id)+'"><span class="lib-thumb-txt">'+esc(r.preview||'')+'</span></span>' +
          '<span class="lib-text"><span class="lib-name">'+esc(title(r))+'</span>' +
            '<span class="lib-meta">'+(r.pinned&&L.view!=='trash'?'<i class="ph ph-push-pin" aria-label="pinned"></i>':'')+(shared?'<i class="ph ph-users" aria-label="shared"></i>':'')+esc(meta(r))+'</span>' +
            (h&&h.label?'<span class="match" title="'+esc(h.kind==='handwriting'?'handwriting was read as this':'matching note text')+'">'+esc(h.label)+'</span>':'') +
          '</span>' +
        '</button>' +
        '<button type="button" class="lib-more" aria-label="more for '+esc(title(r))+'" title="more"><i class="ph ph-dots-three-vertical"></i><span class="fb" hidden>...</span></button>' +
      '</div></div>');
  }
  list.innerHTML = html.join('');
  list.scrollTop = keepTop;
  if(focusId){ const f = list.querySelector('.note-row[data-id="'+CSS.escape(focusId)+'"] .t'); if(f) f.focus({preventScroll:true}); }
  watchThumbs();
  paintSel();
}

/* ---- search: typed text, names and handwriting, as before ---- */
let searchTimer = null;
search.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  L.query = search.value.trim();
  paintChips();
  if(!L.query){ L.searchSeq++; paint(); return; }
  searchTimer = setTimeout(()=>runSearch(L.query), 150);
});
search.addEventListener('keydown', e=>{
  if(e.isComposing || e.keyCode===229)return;
  if(e.key === 'ArrowDown'){ const f = list.querySelector('.note-row .t'); if(f){ e.preventDefault(); f.focus(); } }
  if(e.key === 'Enter'){ const f = list.querySelector('.note-row'); if(f){ e.preventDefault(); openRow(f.dataset.id); } }
});
async function docOf(id){
  if(id === S.id) return C.serialize();
  if(!L.docs.has(id)) L.docs.set(id, (await C.Store.get('notas.note.'+id)) || null);
  return L.docs.get(id);
}
async function runSearch(q){
  const seq = ++L.searchSeq, hits = [], rows = L.ix.filter(inView);
  /* notes not yet in memory are read a batch at a time, not one after another */
  for(let i = 0; i < rows.length; i += 16){
    const batch = rows.slice(i, i+16), docs = await Promise.all(batch.map(r=>docOf(r.id)));
    if(seq !== L.searchSeq) return;
    batch.forEach((row, j)=>{
      if(!docs[j]) return;
      const hit = N.ui.searchHit(docs[j], q);
      if(hit) hits.push({row, ...hit});
    });
  }
  hits.sort((a,b)=>a.score-b.score || ((b.row.updated||0)-(a.row.updated||0)));
  paint(hits);
}

/* ---- thumbnails ----
   The first screen of the note, drawn from its saved state (so any note can
   be pictured, not only the open one) into a 400x300 WebP of a few KB. The
   paper is left transparent and the picture remembers which theme drew it;
   shown under the other theme it is inverted, so a page of graphite ink
   never turns into a white card in dark mode. */
const thumbs = new Map();                /* id -> {src, dark, at} */
/* asked once per picture shown; reading the theme each time restyled the
   page for every row that came into view. Forgotten when the theme changes */
let darkMemo = null;
function darkNow(){
  if(darkMemo !== null) return darkMemo;
  const g = getComputedStyle(document.documentElement).getPropertyValue('--graphite').trim();
  const cx = document.createElement('canvas').getContext('2d'); cx.fillStyle = g;
  const hex = /^#([0-9a-f]{6})$/i.exec(cx.fillStyle); if(!hex) return darkMemo = false;
  const n = parseInt(hex[1],16); return darkMemo = ((n>>16&255)*.299 + (n>>8&255)*.587 + (n&255)*.114) > 140;
}
function loadImage(src){
  return new Promise(res=>{
    const im = new Image(), t = setTimeout(()=>res(null), 1500);
    im.onload = ()=>{ clearTimeout(t); res(im); }; im.onerror = ()=>{ clearTimeout(t); res(null); };
    im.src = src;
  });
}
function wrapText(x, text, left, top, maxW, lh, bottom){
  let y = top;
  for(const para of String(text).split(/\r?\n/)){
    const pieces = /\s/.test(para) ? (para.match(/\S+\s*/g)||[]) : Array.from(para);
    let line = '';
    for(const p of pieces){
      const next = line + p;
      if(line && x.measureText(next).width > maxW){ x.fillText(line.trimEnd(), left, y); y += lh; line = p.trimStart(); if(y > bottom) return; }
      else line = next;
    }
    x.fillText(line.trimEnd(), left, y); y += lh; if(y > bottom) return;
  }
}
async function renderThumb(doc){
  const strokes = doc.strokes||[], lines = (doc.lines||[]).filter(l=>l.text&&l.text.trim()), images = doc.images||[];
  if(!strokes.length && !lines.length && !images.length) return null;
  /* the picture is as wide as the writing, not the whole column: a few words
     in the corner of a wide page are still legible at 72px */
  const full = M.contentW || C.CONTENT_MAX || 720;
  let top = Infinity, right = 0;
  for(const st of strokes) if(st.bbox){ top = Math.min(top, st.bbox[1]); right = Math.max(right, st.bbox[2]); }
  for(const l of lines){ top = Math.min(top, l.y); right = Math.max(right, Math.min(full, 4 + 9.7*Math.max(...l.text.split(/\r?\n/).map(t=>t.length)))); }
  for(const im of images){ top = Math.min(top, im.y); right = Math.max(right, im.x + im.w); }
  const w = Math.max(360, Math.min(full, right + 24)), h = w*THUMB_H/THUMB_W;
  top = Math.max(0, (Number.isFinite(top) ? top : 0) - 24);
  const bottom = top + h, cv = document.createElement('canvas');
  cv.width = THUMB_W; cv.height = THUMB_H;
  const x = cv.getContext('2d'), cs = getComputedStyle(document.documentElement);
  x.scale(THUMB_W/w, THUMB_W/w); x.translate(0, -top);
  for(const im of images){
    if(im.y > bottom || im.y + im.h < top) continue;
    const img = await loadImage(im.src); if(!img) continue;
    try{
      if(im.rot){ x.save(); x.translate(im.x+im.w/2, im.y+im.h/2); x.rotate(im.rot); x.drawImage(img, -im.w/2, -im.h/2, im.w, im.h); x.restore(); }
      else x.drawImage(img, im.x, im.y, im.w, im.h);
    }catch(e){}
  }
  for(const st of strokes){
    if(st.bbox && (st.bbox[1] > bottom || st.bbox[3] < top)) continue;
    try{ N.ink.drawStroke(x, st); }catch(e){}
  }
  x.fillStyle = cs.getPropertyValue('--graphite').trim();
  x.font = '400 16px '+(cs.getPropertyValue('--type').trim()||'ui-monospace, monospace'); x.textBaseline = 'top';
  for(const l of lines) if(l.y < bottom && l.y + 400 > top) wrapText(x, l.text, 2, l.y+3, w-4, 22.4, bottom);
  let src = '';
  try{ src = cv.toDataURL('image/webp', 0.72); }catch(e){ return null; }
  /* Safari before 17 cannot encode WebP and hands back a PNG; that is kept,
     only larger */
  return {src, dark:darkNow(), at:Date.now()};
}
async function thumbOf(id){
  if(thumbs.has(id)) return thumbs.get(id);
  const t = (await C.Store.get('notas.thumb.'+id)) || null;
  thumbs.set(id, t); return t;
}
async function storeThumb(id, t){
  thumbs.set(id, t);
  if(t) await C.Store.set('notas.thumb.'+id, t); else await C.Store.del('notas.thumb.'+id);
}
/* the page being left is pictured on the way out, so the list shows it as
   it was just now; while the sidebar stays docked it is redrawn at most
   every half minute of writing */
let lastThumb = new Map();
async function pictureCurrent(){
  if(!S.id || !S.savedRev) return;
  try{
    const t = await renderThumb(C.serialize());
    await storeThumb(S.id, t); lastThumb.set(S.id, Date.now());
    showThumb(S.id);
  }catch(e){}
}
/* a picture is a nicety: switching notes never waits more than a moment for one */
async function leaving(){
  if(!S.id || (lastThumb.get(S.id)||0) >= (L.lastEdit||0)) return;
  await Promise.race([pictureCurrent(), new Promise(r=>setTimeout(r, 600))]);
}
/* rows scrolled into view are pictured if they have none, or theirs is older
   than the note (edited in another tab, or before thumbnails existed) */
const backlog = [];
let backlogBusy = false;
async function drainBacklog(){
  if(backlogBusy) return; backlogBusy = true;
  try{
    while(backlog.length){
      const id = backlog.shift(), row = L.ix.find(r=>r.id===id); if(!row) continue;
      const have = await thumbOf(id);
      if(have ? (have.at >= (row.updated||0) - 1000) : false){ showThumb(id); continue; }
      await settled();
      const doc = id === S.id ? C.serialize() : await C.Store.get('notas.note.'+id);
      if(!doc) continue;
      const t = await renderThumb(doc);
      if(t) await storeThumb(id, t); else { thumbs.set(id, null); await C.Store.del('notas.thumb.'+id); }
      if(id === S.id) lastThumb.set(id, Date.now());
      showThumb(id);
    }
  }finally{ backlogBusy = false; }
}
async function showThumb(id){
  const box = list.querySelector('.lib-thumb[data-thumb="'+CSS.escape(id)+'"]'); if(!box) return;
  const t = await thumbOf(id);
  let img = box.querySelector('img');
  if(!t){ if(img) img.remove(); box.classList.remove('has'); return; }
  if(!img){ img = document.createElement('img'); img.alt = ''; img.decoding = 'async'; box.appendChild(img); }
  if(img.getAttribute('src') !== t.src) img.src = t.src;
  img.classList.toggle('flip', !!t.dark !== darkNow());
  box.classList.add('has');
}
let seen = null;
function watchThumbs(){
  if(seen) seen.disconnect();
  const boxes = list.querySelectorAll('.lib-thumb');
  const want = box=>{ const id = box.dataset.thumb; showThumb(id); if(!backlog.includes(id)) backlog.push(id); drainBacklog(); };
  if(!('IntersectionObserver' in window)){ boxes.forEach(want); return; }
  seen = new IntersectionObserver(es=>{ for(const e of es) if(e.isIntersecting){ seen.unobserve(e.target); want(e.target); } }, {root:list, rootMargin:'200px 0px'});
  boxes.forEach(b=>seen.observe(b));
}
/* the theme changed: pictures drawn under the other one are inverted */
new MutationObserver(()=>{ darkMemo = null; if(L.open) list.querySelectorAll('.lib-thumb img').forEach(img=>{ const id = img.parentNode.dataset.thumb, t = thumbs.get(id); if(t) img.classList.toggle('flip', !!t.dark !== darkNow()); }); })
  .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ darkMemo = null; if(L.open) paint(L.hits || undefined); });

/* ---- open, close, dock ---- */
const MAIN = ['#topbar','#scroller','#pill','#penpop','#textpop','#askbar','#offline-status','#local-status','#selbar'];
function setMainInert(on){ for(const sel of MAIN){ const m = document.querySelector(sel); if(m) m.inert = !!on; } }
let returnFocus = null;
/* Snapshot navigation leaves the real editor's zoom, scroll and input
   geometry alone. Queue changes so a fast close/open cannot reuse a
   transition name while the preceding snapshot is still alive. */
let overviewNavigation = Promise.resolve();
function overviewChange(opening, update, source){
  const run = async()=>{
    if(!document.startViewTransition || C.reducedMotion()) return update();
    // Leaving the notebook uses a shared page snapshot. Opening a card instead
    // grows the complete new scene from its bounds, with real content from frame one.
    const old = opening ? $('#scroller') : null;
    const oldName = old?.style.viewTransitionName || '';
    let target = null, targetName = '';
    const root = document.documentElement, bounds = !opening && source?.getBoundingClientRect();
    const expanding = !!(bounds && bounds.width > 0 && bounds.height > 0);
    if(expanding){
      root.style.setProperty('--note-from-x',bounds.left+'px');
      root.style.setProperty('--note-from-y',bounds.top+'px');
      root.style.setProperty('--note-from-sx',String(bounds.width/innerWidth));
      root.style.setProperty('--note-from-sy',String(bounds.height/innerHeight));
      root.classList.add('library-expand');
    }
    document.documentElement.classList.add('library-transition');
    if(old) old.style.viewTransitionName = 'notebook';
    const transition = document.startViewTransition(async()=>{
      if(old) old.style.viewTransitionName = oldName;
      await update();
      if(expanding && L.open) transition.skipTransition(); // A failed save keeps the library in place.
